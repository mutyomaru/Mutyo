<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星詠みの旅団 アップデートファイル生成</title>
<style>body{background:#15191d;color:#f1e9d6;font:16px/1.75 system-ui,sans-serif;max-width:700px;margin:30px auto;padding:0 17px}h1{color:#d6b476;font-size:1.45rem}button,.choose{display:block;background:#66543a;color:white;border:1px solid #d6b476;border-radius:12px;padding:13px;margin:16px 0;width:100%;font-size:16px;text-align:center;box-sizing:border-box}button:disabled{opacity:.45}input{display:none}.panel{border:1px solid #776a53;border-radius:12px;padding:20px;background:#252a29}small{color:#b6aa97}#status{white-space:pre-line}a{color:#eed197}</style></head>
<body><div class="panel"><h1>🎁 星詠みの旅団 アップデート</h1><p>週替わり福袋5種・開封アニメーション・敵の素早さ倍率の修正を、公開中のゲームにまとめて追加します。</p><p>GitHubの最新版から新しい <b>index.html</b> を生成します。既存の初心者ミッションやイベントなどはそのまま残します。</p>
<button id="get">最新版から完成版 index.html を作る</button>
<p><small>取得できない場合は、GitHubで現在の index.html をダウンロードして、下から選んでください。</small></p><label class="choose">自分の index.html を選んで作る<input type="file" id="pick" accept=".html,text/html"></label>
<p id="status" role="status"></p><hr><small>※このページは生成用です。公開するのは生成された「index.html」の方です。セーブデータは更新後も引き継げます。毎週月曜日0:00（日本時間）に各商品が再購入可能になります。</small></div>
<script>
function patchGame(input){
  let src=input.replace(/^\uFEFF/,'');
  if(!src.includes('星詠みの旅団') || !src.includes('function renderShop()') || !src.includes('function makeUnit('))throw new Error('対象のゲームの最新版 index.html ではないようです。');
  if(src.includes('WEEKLY_BUNDLES_V1'))throw new Error('このファイルにはすでに今回のアップデートが適用されています。');
  const oldSpeed='speed:Math.max(1,Math.floor(c.speed*m))';
  if(!src.includes(oldSpeed))throw new Error('敵の素早さ計算が想定と異なります。元ファイルを確認してください。');
  src=src.replace(oldSpeed,'speed:Math.max(1,Math.floor(c.speed))');
  const shopRegex=/function renderShop\(\)\{[^\r\n]*\}/;
  if(!shopRegex.test(src))throw new Error('ショップ描画コードが想定と異なります。');
  src=src.replace(shopRegex,s=>s.slice(0,-1)+';renderWeeklyShop()'+s.slice(-1));
  const code=String.raw`
/* ===== WEEKLY_BUNDLES_V1: 週替わり福袋ショップ ===== */
const WEEKLY_BUNDLES=[
 {id:'small',name:'小さな福袋',icon:'🎁',price:2000,detail:'💎 50ジェム・ランダムな指輪 ×1'},
 {id:'regular',name:'福袋',icon:'🎀',price:5000,detail:'💎 100ジェム・ランダムな指輪 ×1'},
 {id:'luxury',name:'豪華な福袋',icon:'👑',price:10000,detail:'💎 250ジェム・🪨 レベルストーン ×1・ランダムな指輪 ×1'},
 {id:'rings',name:'指輪パック',icon:'💍',price:7000,detail:'ランダムな指輪 ×2'},
 {id:'characters',name:'キャラパック',icon:'⚔️',price:5000,detail:'ランダムなレアキャラ ×1・ノーマルキャラ ×2'}
];
function ensureWeeklyBundles(){
 const key=questPeriodKey('weekly');
 if(!state.weeklyBundles||typeof state.weeklyBundles!=='object'||state.weeklyBundles.key!==key){
  state.weeklyBundles={key,purchased:{}};save();
 }
 if(!state.weeklyBundles.purchased||typeof state.weeklyBundles.purchased!=='object')state.weeklyBundles.purchased={};
 return state.weeklyBundles;
}
function renderWeeklyShop(){
 const host=$('shop');if(!host)return;
 const stock=ensureWeeklyBundles();
 const block=document.createElement('section');block.className='panel';block.id='weeklyBundlesPanel';
 block.innerHTML='<h2 class="section-title">🎁 週替わり福袋・パック</h2><p class="small">毎週月曜日 0:00（日本時間）に購入上限リセット。各商品は週1回まで。<br>中身は購入時に抽選されます。</p><div class="shop-product-grid">'+WEEKLY_BUNDLES.map(item=>{
  const sold=!!stock.purchased[item.id],affordable=state.gold>=item.price;
  return '<div class="shop-product"><div class="weekly-bundle-icon">'+item.icon+'</div><b>'+item.name+'</b><div class="small">'+item.detail+'</div><div class="shop-product-price">🪙 '+item.price.toLocaleString('ja-JP')+'</div><button class="wide" data-action="weeklyBundlePurchase" data-bundle="'+item.id+'" '+(sold||!affordable?'disabled':'')+'>'+(sold?'今週は購入済み':affordable?'購入する':'金貨不足')+'</button></div>';
 }).join('')+'</div>';
 host.appendChild(block);
}
function buyWeeklyBundle(id){
 const item=WEEKLY_BUNDLES.find(x=>x.id===id),stock=ensureWeeklyBundles();
 if(!item||stock.purchased[id])return;
 if(state.gold<item.price){showError('金貨が足りません');renderShop();return;}
 if(!confirm(item.name+'を'+item.price.toLocaleString('ja-JP')+'金貨で購入しますか？'))return;
 // 先に購入履歴と所持金を確定し、連続タップでの二重購入を防ぐ。
 state.gold-=item.price;stock.purchased[id]=true;
 const items=[];
 const grantRing=()=>{const type=random(shopRings);state.ringInventory[type]=(Number(state.ringInventory[type])||0)+1;items.push({name:RINGS[type].name,icon:'💍'});};
 const grantGems=n=>{state.gems+=n;items.push({name:n+'ジェム',icon:'💎'});};
 const grantCharacter=c=>{const msg=addCharacter(c.id);items.push({name:c.name,icon:'⚔️',detail:msg});};
 if(id==='small'){grantGems(50);grantRing();}
 if(id==='regular'){grantGems(100);grantRing();}
 if(id==='luxury'){grantGems(250);state.levelStones=Math.max(0,Number(state.levelStones)||0)+1;items.push({name:'レベルストーン ×1',icon:'🪨'});grantRing();}
 if(id==='rings'){grantRing();grantRing();}
 if(id==='characters'){
  const rares=shopCharacters.filter(c=>c.rarity==='レア');
  const normals=shopCharacters.filter(c=>c.rarity==='ノーマル');
  if(rares.length&&normals.length>=2){
   grantCharacter(random(rares));
   const first=random(normals);grantCharacter(first);
   grantCharacter(random(normals.filter(c=>c.id!==first.id)));
  }
 }
 recordQuestEvent('shop');save();renderAll();renderShop();
 playWeeklyBundleOpening(item,items);
}
function playWeeklyBundleOpening(item,items){
 let overlay=$('weeklyBundleOverlay');
 if(!overlay){overlay=document.createElement('div');overlay.id='weeklyBundleOverlay';overlay.className='weekly-bundle-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');document.body.appendChild(overlay);}
 overlay.innerHTML='<div class="weekly-bundle-box"><h2>'+item.name+'</h2><div class="weekly-bundle-gift" aria-label="福袋開封中">'+item.icon+'</div><p id="weeklyBundleStatus">福袋を開封中…</p><div id="weeklyBundleRewards" class="weekly-bundle-rewards" aria-live="polite"></div><button id="weeklyBundleClose" class="wide" disabled>開封しています…</button></div>';
 overlay.classList.add('active');
 const result=overlay.querySelector('#weeklyBundleRewards'),status=overlay.querySelector('#weeklyBundleStatus'),close=overlay.querySelector('#weeklyBundleClose');
 // 報酬は購入時点で保存済み。演出中にページを離れても失われない。
 items.forEach((reward,i)=>setTimeout(()=>{
  if(!overlay.classList.contains('active'))return;
  const line=document.createElement('div');line.className='weekly-bundle-reward';
  const title=document.createElement('b');title.textContent=reward.icon+' '+reward.name;line.appendChild(title);
  if(reward.detail){const note=document.createElement('div');note.className='small';note.textContent=reward.detail;line.appendChild(note);}
  result.appendChild(line);requestAnimationFrame(()=>line.classList.add('shown'));
 },1200+i*650));
 setTimeout(()=>{if(!overlay.classList.contains('active'))return;status.textContent='✨ 開封完了！';close.disabled=false;close.textContent='受け取って閉じる';},1200+items.length*650);
 close.onclick=()=>{if(close.disabled)return;overlay.classList.remove('active')};
}
/* ===== END WEEKLY_BUNDLES_V1 ===== */
`;
  const anchor='function purchaseShopItem(key)';
  if(!src.includes(anchor))throw new Error('購入処理の差込先が見つかりません。');
  src=src.replace(anchor,code+'\n'+anchor);
  const action="case 'shopPurchase':purchaseShopItem(button.dataset.shopKey);break;";
  if(!src.includes(action))throw new Error('ショップのクリック処理が見つかりません。');
  src=src.replace(action,"case 'weeklyBundlePurchase':buyWeeklyBundle(button.dataset.bundle);break;\n   "+action);
  const css=String.raw`
/* WEEKLY_BUNDLES_V1 */
.weekly-bundle-icon{display:grid;place-items:center;height:94px;font-size:64px;filter:drop-shadow(0 5px 8px #0007)}
.weekly-bundle-overlay{display:none;position:fixed;inset:0;z-index:3000;background:#050609ed;align-items:center;justify-content:center;padding:14px}
.weekly-bundle-overlay.active{display:flex}
.weekly-bundle-box{max-height:92dvh;overflow:auto;width:min(100%,440px);padding:20px 16px;text-align:center;background:radial-gradient(circle at top,#615039,#222827 75%);border:2px solid #d6b476;border-radius:16px;box-shadow:0 0 45px #d6b47655}
.weekly-bundle-box h2{color:var(--gold);margin:4px 0}
.weekly-bundle-gift{font-size:88px;animation:weeklyGift 1.15s ease-in-out both;text-shadow:0 0 35px #ffe2a7}
.weekly-bundle-rewards{display:grid;gap:9px;margin:14px 0}.weekly-bundle-reward{opacity:0;transform:translateY(20px) scale(.93);border:1px solid #c6a56d;border-radius:9px;background:#31382f;padding:12px 8px}.weekly-bundle-reward.shown{opacity:1;transform:none;transition:opacity .4s,transform .4s}.weekly-bundle-reward b{color:#ffe3a6}
@keyframes weeklyGift{0%{transform:scale(.5) rotate(-18deg);opacity:0}30%{transform:scale(1.15) rotate(12deg);opacity:1}50%{transform:rotate(-9deg)}70%{transform:rotate(8deg)}85%{transform:scale(1.35);filter:brightness(1.9)}100%{transform:scale(1);filter:brightness(1.2)}}
`;
  if(!src.includes('</style>'))throw new Error('スタイルの差込先が見つかりません。');
  src=src.replace('</style>',css+'\n</style>');
  if(!src.includes('WEEKLY_BUNDLES_V1')||src.includes(oldSpeed))throw new Error('変更内容の検証に失敗しました。');
  return src;
}

async function generate(src){try{const out=patchGame(src);const blob=new Blob([out],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);document.getElementById('status').textContent='✅ 完成版 index.html を生成しました。GitHubの現在の index.html と置き換えてください。';}catch(e){document.getElementById('status').textContent='⚠️ '+e.message}}
document.getElementById('get').onclick=async()=>{const b=document.getElementById('get');b.disabled=true;document.getElementById('status').textContent='GitHubの公開中ファイルを読み込んでいます…';try{const res=await fetch('https://raw.githubusercontent.com/mutyomaru/Mutyo/main/index.html?bundle_update=20261109',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);await generate(await res.text());}catch(e){document.getElementById('status').textContent='自動取得できませんでした。下の「自分の index.html を選んで作る」を利用してください。（'+e.message+'）';}finally{b.disabled=false;}};
document.getElementById('pick').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(f)await generate(await f.text())};
</script></body></html>
