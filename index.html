
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星詠みの旅団</title>
<style>
:root{
  --bg:#101525;
  --panel:#1b2540;
  --gold:#f4c76b;
  --text:#f4f5fb;
  --muted:#aab4ca;
  --line:#394866;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top,#202d4c,#101525 60%);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}
button{
  font:inherit;
  color:inherit;
  border:1px solid #62708e;
  background:linear-gradient(#354666,#263453);
  border-radius:11px;
  padding:10px 13px;
  cursor:pointer;
}
button:disabled{opacity:.4}
.wrap{max-width:900px;margin:auto;padding:12px}
.top,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.top{justify-content:space-between;padding:12px 0}
.brand,.section-title{color:var(--gold);font-weight:900}
.brand{font-size:22px}
.pill{
  background:#202c46;
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:30px;
}
.nav{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin:10px 0 16px;
}
.page{display:none}
.page.active{display:block}
.panel{
  background:linear-gradient(145deg,#1d2945,#172139);
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px;
  margin-bottom:13px;
}
.hero{text-align:center;padding:25px}
.hero h1{color:var(--gold)}
.section-title{font-size:20px;margin:0 0 12px}
.muted,.small{color:var(--muted)}
.small{font-size:12px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:9px;
}
.card{
  position:relative;
  background:#202d49;
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px 10px 43px;
}
.card.selected{outline:2px solid var(--gold)}
.portrait{
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}
.portrait img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}
.name{font-weight:900}
.stats{font-size:13px;line-height:1.7;margin:6px 0}
.normal{color:#cbd5e1}
.rare{color:#74b8ff}
.epic{color:#d9a0ff}
.wide{width:100%}
.plus{
  position:absolute;
  bottom:8px;
  right:8px;
  width:32px;
  height:32px;
  padding:0;
  border-radius:9px;
  color:#ffe5a0;
  border-color:#b99550;
  background:#58472d;
  font-size:23px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:#050914e8;
  align-items:center;
  justify-content:center;
  padding:14px;
}
.modal.active{display:flex}
.modal-box{
  width:100%;
  max-width:460px;
  max-height:88vh;
  overflow:auto;
  background:linear-gradient(#263653,#151f34);
  border:1px solid #7185a8;
  border-radius:18px;
  padding:16px;
}
.slots,.stock{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.slot{
  min-height:65px;
  background:#111b30;
  border:1px solid #465779;
  border-radius:10px;
  padding:8px;
  text-align:center;
}
.slot.empty{border-style:dashed}
.stock{
  grid-template-columns:repeat(3,1fr);
  margin:10px 0;
}
.stock>div{
  background:#111b30;
  border-radius:9px;
  padding:8px 3px;
  text-align:center;
  font-size:12px;
}
.choice{
  display:flex;
  width:100%;
  justify-content:space-between;
  align-items:center;
  text-align:left;
  margin:8px 0;
}
.stage-map{
  padding:15px;
  border:2px solid #58794e;
  border-radius:18px;
  background:linear-gradient(145deg,#456c43,#31543b 55%,#426a40);
}
.map-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.stage-node{
  min-height:83px;
  padding:7px 2px;
  background:linear-gradient(#e1e9b7,#a9c27b);
  color:#263b26;
  border:2px solid #b4c98b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.stage-node .num{font-size:22px;font-weight:900}
.stage-node .small{color:inherit;font-size:10px}
.stage-node.completed{background:linear-gradient(#c5e9bb,#76b879)}
.stage-node.current{background:linear-gradient(#fff0a8,#e9b94e)}
.stage-node.boss{
  background:linear-gradient(#f1b2a3,#bd625b);
  color:#451e25;
}
.stage-node.locked{background:#788477;color:#344236}
.stage-node.selected{outline:3px solid white}
.stage-info{
  margin-top:14px;
  background:#203c2dcc;
  padding:12px;
  border-radius:11px;
  line-height:1.7;
}
.map-start{
  width:100%;
  margin-top:10px;
  background:linear-gradient(#e6c16a,#a77c32);
  color:#30230e;
  font-weight:900;
}
.battle-side{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}
.unit{
  position:relative;
  min-width:0;
  background:#263653;
  border:1px solid #5476a4;
  border-radius:13px;
  text-align:center;
  padding:9px 5px;
}
.unit.enemy{background:#513541;border-color:#895767}
.unit.dead{opacity:.35;filter:grayscale(1)}
.unit.active{
  outline:3px solid #ffe17c;
  box-shadow:0 0 15px #f4c76b99;
}
.unit.enemy.active{outline-color:#ff8585}
.unit .portrait{height:130px}
.hpbar,.gaugebar{
  height:9px;
  background:#101827;
  border-radius:10px;
  overflow:hidden;
  margin:6px 0;
}
.hpbar i{display:block;height:100%;background:#76d6a1}
.gaugebar{height:7px}
.gaugebar i{display:block;height:100%;background:#8c9fff}
.battle-divider{
  text-align:center;
  font-size:20px;
  color:var(--gold);
  font-weight:900;
  margin:12px;
}
.action-panel{
  margin-top:13px;
  background:#202e4b;
  border:1px solid #536486;
  border-radius:13px;
  padding:13px;
}
.action-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}
.action-buttons button{min-height:50px}
.attack{background:#853c49}
.skill{background:#5b4694}
.enemy-preview{
  background:#633b48;
  border:2px solid #bd687b;
  padding:14px;
  border-radius:12px;
  line-height:1.8;
}
.result{text-align:center;line-height:1.8}
.result h2{color:var(--gold)}
.effect{
  position:absolute;
  top:30%;
  left:0;
  width:100%;
  font-size:26px;
  font-weight:900;
  color:#ff8585;
  text-shadow:0 2px 5px black;
  pointer-events:none;
}
.error{
  display:none;
  background:#542d36;
  border:1px solid #b65d6a;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
.summon{
  display:none;
  position:fixed;
  inset:0;
  z-index:1100;
  background:radial-gradient(ellipse,#26345b,#080c18);
  align-items:center;
  justify-content:center;
  padding:15px;
}
.summon.active{display:flex}
.summon-box{text-align:center;max-width:520px;width:100%}
.magic{
  position:relative;
  margin:15px auto;
  width:230px;
  height:230px;
  border-radius:50%;
  border:3px solid #7ecbff;
  box-shadow:0 0 20px #398cff,inset 0 0 30px #398cff;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:rotate 6s linear infinite;
}
.magic:before{
  content:'✦ ᚷ ✧ ᚨ ✦ ᚱ ✧';
  position:absolute;
  inset:20px;
  border:2px dashed #b5e7ff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d5f3ff;
}
.magic img{
  position:relative;
  z-index:1;
  width:160px;
  height:160px;
  object-fit:contain;
  animation:counterrotate 6s linear infinite;
}
.summon.epic-mode .magic{
  border-color:#ffe08b;
  box-shadow:0 0 28px #ffc34b,0 0 42px #d58aff;
}
.summon-name{font-size:23px;font-weight:900;color:var(--gold)}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes counterrotate{to{transform:rotate(-360deg)}}
.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:12px;
}
@media(max-width:600px){
  .nav{grid-template-columns:repeat(2,1fr)}
  .battle-side{grid-template-columns:repeat(2,minmax(0,1fr))}
  .unit .portrait{height:115px}
  .map-grid{gap:7px}
  .stage-node{min-height:78px}
  .wrap{padding:9px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">✦ 星詠みの旅団</div>
    <div class="row">
      <span class="pill">💎 <b id="gems">0</b></span>
      <span class="pill">🪙 <b id="gold">0</b></span>
      <span class="pill">到達ステージ <b id="stage">1</b></span>
    </div>
  </header>
  <div id="errorBox" class="error"></div>
  <nav class="nav">
    <button data-page="home">ホーム</button>
    <button data-page="gacha">ガチャ</button>
    <button data-page="team">編成・図鑑</button>
    <button data-page="battle">戦闘</button>
    <button data-page="shop">ショップ</button>
  </nav>
  <main>
    <section id="home" class="page active">
      <div class="panel hero">
        <h1>星の導きが、旅の始まり</h1>
        <p class="muted">仲間を集め、育て、未知の敵に挑もう。</p>
        <div class="row" style="justify-content:center">
          <button data-page="gacha">仲間を召喚する</button>
          <button data-page="team">編成を確認する</button>
          <button data-page="battle">冒険に出る</button>
        </div>
      </div>
      <div class="panel">
        <h2 class="section-title">旅団の状況</h2>
        <div id="homeSummary"></div>
      </div>
    </section>
    <section id="gacha" class="page">
      <div class="panel">
        <h2 class="section-title">星詠み召喚</h2>
        <p>ノーマル 70% / レア 25% / エピック 5%</p>
        <div class="row">
          <button data-action="summon" data-count="1">1回召喚（💎100）</button>
          <button data-action="summon" data-count="10">10回召喚（💎900）</button>
        </div>
        <div id="gachaResult" class="muted" style="margin-top:12px">
          召喚結果がここに表示されます。
        </div>
      </div>
      <div class="panel">
        <h2 class="section-title">所持状況</h2>
        <div id="gachaOwned"></div>
      </div>
    </section>
    <section id="team" class="page">
      <div class="panel">
        <h2 class="section-title">パーティ編成</h2>
        <p class="muted">所持キャラクターを最大3人まで編成できます。</p>
        <div id="partyView" class="grid"></div>
      </div>
      <div class="panel">
        <h2 class="section-title">キャラクター図鑑</h2>
        <p class="muted">右下の「＋」から指輪を装備できます。</p>
        <div id="characterList" class="grid"></div>
      </div>
    </section>
    <section id="shop" class="page">
      <div class="panel">
        <h2 class="section-title">ショップ</h2>
        <p>ショップは準備中です。</p>
      </div>
    </section>
    <section id="battle" class="page">
      <div class="panel">
        <h2 class="section-title">草原マップ</h2>
        <p class="muted">クリア済みのステージにも再挑戦できます。</p>
        <div id="stageMap"></div>
      </div>
      <div class="panel">
        <h2 class="section-title">冒険準備</h2>
        <div id="battleIntro"></div>
        <button id="startBattleButton" class="map-start" data-action="startBattle">
          挑戦する
        </button>
      </div>
    </section>
    <section id="battleFight" class="page">
      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <h2 class="section-title">戦闘</h2>
          <button data-action="returnMap">ステージ選択に戻る</button>
        </div>
        <div id="battleArea">
          <h3 style="color:#ffaaaa">▼ 敵軍 <span id="bossLabel"></span></h3>
          <div id="enemyUnits" class="battle-side"></div>
          <div class="battle-divider">✦ VS ✦</div>
          <h3 style="color:#9acbff">▲ 旅団</h3>
          <div id="allyUnits" class="battle-side"></div>
          <div id="actionArea" class="action-panel"></div>
        </div>
      </div>
    </section>
  </main>
  <div class="footer">星詠みの旅団</div>
</div>

<div id="characterRingModal" class="modal">
  <div class="modal-box">
    <h2 class="section-title">アクセサリー一覧</h2>
    <div id="characterRingContent"></div>
    <button class="wide" data-action="closeCharacterRingModal">図鑑に戻る</button>
  </div>
</div>

<div id="equipmentModal" class="modal">
  <div class="modal-box">
    <h2 class="section-title">指輪を選択</h2>
    <div id="equipmentModalCharacter" class="small"></div>
    <div id="equipmentModalChoices"></div>
    <button class="wide" data-action="closeEquipmentModal">戻る</button>
  </div>
</div>

<div id="summonOverlay" class="summon">
  <div class="summon-box">
    <h2 class="section-title">星詠み召喚</h2>
    <div id="summonVisual"></div>
    <div id="summonControls"></div>
  </div>
</div>

const $=id=>document.getElementById(id);
const byId=id=>CHARACTERS.find(c=>c.id===id);
const RING_IDS=Object.keys(RINGS);

function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function fresh(){
  return {
    gems:500,
    gold:300,
    stage:1,
    clearedStage:0,
    stageClearCounts:{},
    owned:{
      swordman:{level:1,dupes:0},
      archer:{level:1,dupes:0},
      spearman:{level:1,dupes:0}
    },
    party:['swordman','archer','spearman'],
    ringInventory:{power:0,heart:0,skill:0},
    equipment:{}
  };
}

function loadState(){
  let saved=null;
  try{
    saved=JSON.parse(localStorage.getItem(KEY));
  }catch(e){}

  const base=fresh();
  if(!saved||typeof saved!=='object')return base;

  const s={...base,...saved};
  s.owned=saved.owned&&typeof saved.owned==='object'
    ?saved.owned:base.owned;
  s.party=Array.isArray(saved.party)
    ?saved.party.filter(id=>s.owned[id]&&byId(id)).slice(0,3)
    :base.party;
  s.stageClearCounts={
    ...base.stageClearCounts,
    ...(saved.stageClearCounts||{})
  };
  s.ringInventory={
    ...base.ringInventory,
    ...(saved.ringInventory||{})
  };
  s.equipment=saved.equipment&&typeof saved.equipment==='object'
    ?saved.equipment:{};

  s.gems=Math.max(0,Number(s.gems)||0);
  s.gold=Math.max(0,Number(s.gold)||0);
  s.clearedStage=Math.min(
    IMPLEMENTED_STAGE,
    Math.max(0,Number(s.clearedStage)||0)
  );
  s.stage=Math.min(
    IMPLEMENTED_STAGE,
    Math.max(1,Number(s.stage)||1)
  );

  for(const id of Object.keys(s.owned)){
    const c=byId(id);
    if(!c){
      delete s.owned[id];
      continue;
    }
    const entry=s.owned[id];
    if(typeof entry!=='object'||!entry){
      s.owned[id]={level:1,dupes:0};
    }else{
      entry.level=Math.min(
        c.maxLevel,
        Math.max(1,Number(entry.level)||1)
      );
      entry.dupes=Math.max(0,Number(entry.dupes)||0);
    }
  }

  return s;
}

let selectedStage=Math.min(
  IMPLEMENTED_STAGE,
  state.clearedStage+1
);
let characterRingTarget=null;
let equipmentModalTarget=null;
let battle=null;
let summonQueue=[];
let summonIndex=0;

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));

}

function showError(message){
  const box=$('errorBox');

      box.style.display='none';

function showPage(page){
  document.querySelectorAll('.page').forEach(el=>{

  window.scrollTo(0,0);
  if(page!=='battleFight')renderAll();

function imagePath(id){
  const c=byId(id);
  return c?'images/'+encodeURIComponent(c.imageFile):'';
}

function portrait(id){
  const c=byId(id);
  if(!c)return '<div class="portrait">？</div>';
  return `<div class="portrait">
    <img src="${imagePath(id)}"
      alt="${esc(c.name)}"
      onerror="this.style.display='none';this.parentElement.insertAdjacentText('beforeend','⚔️')">
  </div>`;
}

function getLevelMultiplier(id){
  const c=byId(id);
  if(!c)return 1;
  const level=state.owned[id]?.level||1;
  return 1+(level-1)*c.growth;
}

function getSlotCount(id){
  return EQUIPMENT_SLOTS[id]||0;
}

function getEquipped(id,type){
  const equipment=state.equipment[id]||[];
  return equipment.filter(t=>t===type).length;
}

function getRingAvailable(type){
  const total=Number(state.ringInventory[type])||0;
  let used=0;
  for(const equipment of Object.values(state.equipment)){
    if(Array.isArray(equipment)){
      used+=equipment.filter(t=>t===type).length;
    }
  }
  return Math.max(0,total-used);
}

function getCharacterEquipmentStats(id){
  const c=byId(id);
  if(!c)return null;
  const multiplier=getLevelMultiplier(id);
  return {
    hp:Math.floor(
      c.hp*multiplier*(1+.1*getEquipped(id,'heart'))
    ),
    atk:Math.floor(
      c.atk*multiplier*(1+.1*getEquipped(id,'power'))
    ),
    speed:c.speed,
    skillMultiplier:1+.1*getEquipped(id,'skill')
  };
}

function rarityClass(rarity){
  if(rarity==='エピック')return 'epic';
  if(rarity==='レア')return 'rare';
  return 'normal';
}

function cardHTML(id,encyclopedia=false){

    <div class="stats">

function toggleParty(id){
  if(!state.owned[id])return;

  if(state.party.includes(id)){
    state.party=state.party.filter(x=>x!==id);
  }else{
    if(state.party.length>=3){
      showError('編成できるのは最大3体です。');
      return;
    }
    state.party.push(id);

  renderAll();

function equipRing(id,index,type){
  if(!RINGS[type])return;
  if(getRingAvailable(type)<=0)return;
  if(index<0||index>=getSlotCount(id))return;

  if(!state.equipment[id])state.equipment[id]=[];
  if(state.equipment[id][index])return;

  state.equipment[id][index]=type;
  save();
  renderEquipmentModal();
  renderCharacterRingList();
  renderAll();
}

  state.equipment[id][index]=null;
  save();
  renderEquipmentModal();
  renderCharacterRingList();
  renderAll();
}

function getFormationText(stage){
  const enemies=STAGE_ENEMIES[stage]||[];

  return enemies.map(([id,multiplier,extra])=>{
    const c=byId(id);
    let text=(c?.name||id)+' '+Math.round(multiplier*100)+'%';

    if(extra?.hpMultiplier){
      text+='（HP '+Math.round(
        multiplier*extra.hpMultiplier*100
      )+'%）';
    }

    return text;
  }).join(' / ');
}

function renderStageMap(){
  const cleared=state.clearedStage;
  const unlocked=Math.min(IMPLEMENTED_STAGE,cleared+1);

  let nodes='';

  for(let i=1;i<=IMPLEMENTED_STAGE;i++){
    const boss=BOSS_STAGES.includes(i);
    const locked=i>unlocked;

    nodes+=`
      <button
        class="stage-node
          ${boss?'boss':''}
          ${i<=cleared?'completed':''}
          ${i===unlocked?'current':''}
          ${i===selectedStage?'selected':''}

        data-stage="${i}"

        </span>
        <span class="small">
          ${locked?'🔒 未解放':
            i<=cleared?'✓ クリア済み':'挑戦可能'}
        </span>

  const count=state.stageClearCounts[selectedStage]||0;

    STAGE_GOLD[selectedStage]*Math.pow(.8,count)
  );

  $('stageMap').innerHTML=`

function addCharacter(id){
  const c=byId(id);
  if(!c)return '';

  if(!state.owned[id]){
    state.owned[id]={level:1,dupes:0};
    return '新しい仲間を獲得！';
  }

  const entry=state.owned[id];
  entry.dupes=(entry.dupes||0)+1;

  if(entry.level<c.maxLevel){
    entry.level++;
    return '重複獲得！ Lv.'+entry.level+' に成長！';
  }

  return '重複獲得！（最大レベル）';
}

function drawCharacter(){
  const r=Math.random();
  const rarity=r<.7?'ノーマル':
    r<.95?'レア':'エピック';

  const pool=CHARACTERS.filter(c=>c.rarity===rarity);
  return pool[Math.floor(Math.random()*pool.length)];
}

function summon(count){
  const cost=count===10?900:100;

  if(state.gems<cost){
    showError('ジェムが足りません。');
    return;
  }

  state.gems-=cost;
  summonQueue=[];

  for(let i=0;i<count;i++){
    const c=drawCharacter();
    const message=addCharacter(c.id);
    summonQueue.push({character:c,message});
  }

  save();
  renderAll();

  summonIndex=0;
  summonSkipping=false;

  $('summonOverlay').classList.add('active');
  showSummonResult();
}

function showSummonResult(){
  if(summonTimer){
    clearTimeout(summonTimer);
    summonTimer=null;
  }

  const item=summonQueue[summonIndex];
  if(!item){
    finishSummon();
    return;
  }

  const c=item.character;
  const rarity=c.rarity;

  $('summonVisual').innerHTML=`
    <div class="magic">
      <img src="${imagePath(c.id)}"
        alt="${esc(c.name)}">
    </div>
    <div class="summon-name">${esc(c.name)}</div>
    <p class="${rarityClass(rarity)}">
      ${esc(rarity)}
    </p>
    <p>${esc(item.message)}</p>
  `;

  $('summonProgress').textContent=
    (summonIndex+1)+' / '+summonQueue.length;

  $('summonControls').innerHTML=`
    <button data-action="nextSummon">
      ${summonIndex===summonQueue.length-1?
        '結果を確認':'次の召喚結果へ'}
    </button>
    <button data-action="skipSummon">
      スキップ
    </button>
  `;
}

function nextSummon(){
  summonIndex++;
  showSummonResult();
}

function skipSummon(){
  finishSummon();
}

function finishSummon(){
  const html=summonQueue.map(item=>`
    <div class="row" style="margin:8px 0">
      <div style="width:80px">
        ${portrait(item.character.id)}
      </div>
      <div>
        <b class="${rarityClass(item.character.rarity)}">
          ${esc(item.character.name)}
        </b><br>
        <span class="small">${esc(item.message)}</span>
      </div>
    </div>
  `).join('');

  $('gachaResult').innerHTML=html;

  $('summonOverlay').classList.remove('active');
  summonQueue=[];
  renderAll();
}

const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

function randomAlive(units){
  const alive=units.filter(u=>u.hp>0);
  return alive.length
    ?alive[Math.floor(Math.random()*alive.length)]
    :null;
}

function aliveUnits(units){
  return units.filter(u=>u.hp>0);
}

function makeUnit(id,side,options={}){
  const c=byId(id);
  if(!c)return null;

  let hp,atk,speed,skillMultiplier=1;

  if(side==='ally'){
    const st=getCharacterEquipmentStats(id);
    hp=st.hp;
    atk=st.atk;
    speed=st.speed;
    skillMultiplier=st.skillMultiplier;
  }else{
    const multiplier=options.multiplier??1;
    hp=Math.max(1,Math.floor(
      c.hp*multiplier*(options.hpMultiplier||1)
    ));
    atk=Math.max(1,Math.floor(c.atk*multiplier));
    speed=Math.max(1,Math.floor(c.speed*multiplier));
  }

  if(options.hp)hp=options.hp;
  if(options.speed)speed=options.speed;

  return {
    uid:Math.random().toString(36).slice(2),
    id,
    side,
    name:c.name,
    rarity:c.rarity,
    maxHp:hp,
    hp,
    atk,
    speed,
    charge:options.charge??c.charge,
    skillCount:0,
    gauge:0,
    skillMultiplier,
    buff:1,
    buffTurns:0,
    permanentBuff:1,
    guard:0,
    evade:0,
    poison:0,
    acting:false
  };
}

function makeEnemy(setting){
  const [id,multiplier,extra={}]=setting;
  return makeUnit(id,'enemy',{
    multiplier,
    ...extra
  });
}

function startBattle(){
  if(battle&&battle.running)return;

  if(selectedStage>state.clearedStage+1){
    showError('このステージはまだ解放されていません。');
    return;
  }

  if(!state.party.length){
    showError('キャラクターを編成してください。');
    return;
  }

  const allies=state.party
    .map(id=>makeUnit(id,'ally'))
    .filter(Boolean);

  const enemies=(STAGE_ENEMIES[selectedStage]||[])
    .map(makeEnemy)
    .filter(Boolean);

  if(!allies.length||!enemies.length){
    showError('戦闘を開始できませんでした。');
    return;
  }

  battle={
    stage:selectedStage,
    allies,
    enemies,
    running:true,
    busy:false,
    current:null,
    awaitingAction:false,
    result:null,
    token:Date.now()+Math.random(),
    message:'戦闘開始！'
  };

  showPage('battleFight');
  renderBattle();
  advanceTurn();
}

      :'STAGE '+battle.stage;

  $('enemyUnits').innerHTML=
    battle.enemies.map(unitCard).join('');

  $('allyUnits').innerHTML=
    battle.allies.map(unitCard).join('');

  if(battle.result){
    renderBattleResult();
    return;
  }

  const u=battle.current;

  if(battle.awaitingAction&&u&&u.side==='ally'){
    const c=byId(u.id);
    const ready=u.skillCount>=u.charge;

    $('actionArea').innerHTML=`
      <b>${esc(u.name)} の行動</b>
      <p class="small">
        ${esc(battle.message)}
      </p>
      <div class="action-buttons">
        <button class="attack" data-action="battleAttack">
          ⚔️ 通常攻撃
        </button>
        <button class="skill"
          data-action="battleSkill"
          ${ready?'':'disabled'}>
          ✨ ${esc(c.skill)}
          ${ready?'':'（溜め中）'}
        </button>
      </div>`;
  }else{
    $('actionArea').innerHTML=`
      <div class="${u?.side==='enemy'?'enemy-preview':''}">
        ${esc(battle.message||'次の行動を待っています…')}
      </div>`;
  }
}

function chooseNextUnit(){
  if(!battle)return null;

  const units=[
    ...aliveUnits(battle.allies),
    ...aliveUnits(battle.enemies)
  ];

  if(!units.length)return null;

  let loops=0;

  while(loops++<10000){
    const ready=units.filter(u=>u.gauge>=100);

    if(ready.length){
      ready.sort((a,b)=>{
        if(a.side!==b.side){
          return a.side==='ally'?-1:1;
        }
        return b.gauge-a.gauge;
      });

      const next=ready[0];
      next.gauge-=100;
      return next;
    }

    for(const u of units){
      u.gauge+=u.speed;
    }
  }

  return units[0];
}

function clearActing(){
  if(!battle)return;
  [...battle.allies,...battle.enemies]
    .forEach(u=>u.acting=false);
}

async function advanceTurn(){
  if(!battle||!battle.running||battle.busy)return;

  if(checkBattleEnd())return;

  clearActing();

  const next=chooseNextUnit();
  if(!next)return;

  battle.current=next;
  next.acting=true;

  if(next.poison>0){
    const damage=Math.max(1,Math.floor(next.maxHp*.08));
    next.hp=Math.max(0,next.hp-damage);
    next.poison--;

    battle.message=
      next.name+' は毒で '+damage+' ダメージを受けた！';

    renderBattle();
    await sleep(650);

    if(!battle||!battle.running)return;

    if(next.hp<=0){
      clearActing();
      if(checkBattleEnd())return;
      advanceTurn();
      return;
    }
  }

  if(next.side==='ally'){
    battle.awaitingAction=true;
    battle.message=next.name+' の行動を選択してください。';
    renderBattle();
    return;
  }

  battle.awaitingAction=false;
  const c=byId(next.id);
  const skillReady=next.skillCount>=next.charge;

  battle.message=
    next.name+' の行動！'+
    (skillReady?' スキル「'+c.skill+'」を準備中':' 通常攻撃を準備中');

  renderBattle();

  const token=battle.token;
  await sleep(1100);

  if(!battle||!battle.running||battle.token!==token)return;

  await enemyAct(next);
}

function getAttackPower(unit){
  let atk=unit.atk*unit.buff*unit.permanentBuff;

  if(
    unit.id==='一閃スピアドン'&&
    unit.hp<=unit.maxHp/2
  ){
    atk*=1.5;
  }

  return Math.max(1,Math.floor(atk));
}

function showEffect(target,text,healing=false){
  if(!battle||!target)return;

  const list=target.side==='ally'
    ?battle.allies:battle.enemies;

  const index=list.indexOf(target);
  const parent=$(target.side==='ally'
    ?'allyUnits':'enemyUnits');

  const card=parent?.children[index];
  if(!card)return;

  const el=document.createElement('div');
  el.className='effect';
  el.textContent=text;

  if(healing)el.style.color='#86f3ad';

  card.appendChild(el);

  el.animate([
    {transform:'translateY(15px)',opacity:0},
    {transform:'translateY(-10px)',opacity:1},
    {transform:'translateY(-32px)',opacity:0}
  ],{
    duration:800,
    easing:'ease-out'
  });

  setTimeout(()=>el.remove(),800);
}

function dealDamage(attacker,target,amount,isSkill=false){
  if(!target||target.hp<=0)return 0;

  if(target.evade>0){
    target.evade--;
    battle.message=target.name+' は攻撃を回避した！';
    return 0;
  }

  let damage=Math.max(1,Math.floor(amount));

  if(target.guard>0){
    damage=Math.max(1,Math.floor(
      damage*(1-target.guard)
    ));
    target.guard=0;
  }

  target.hp=Math.max(0,target.hp-damage);

  battle.message=
    attacker.name+' → '+target.name+
    ' に '+damage+' ダメージ！';

  if(
    target.id==='鍛錬剣士'&&
    target.hp>0&&
    attacker.hp>0
  ){
    const counterChance=isSkill?1:.2;

    if(Math.random()<counterChance){
      const reflected=Math.max(1,damage*2);
      attacker.hp=Math.max(0,attacker.hp-reflected);
      battle.message+=
        ' アルティメットカウンター！'+
        reflected+' ダメージを反射！';
    }
  }

  return damage;
}

function healUnit(target,amount){
  if(!target||target.hp<=0)return 0;

  const before=target.hp;
  target.hp=Math.min(
    target.maxHp,
    target.hp+Math.max(1,Math.floor(amount))
  );

  return target.hp-before;
}

function chooseAttackTarget(attacker){
  const opponents=attacker.side==='ally'
    ?battle.enemies:battle.allies;

  const alive=aliveUnits(opponents);
  if(!alive.length)return null;

  if(attacker.id==='狙撃手アーチャー'){
    return [...alive].sort((a,b)=>a.hp-b.hp)[0];
  }

  return randomAlive(alive);
}

async function allyAct(useSkill){
  if(
    !battle||
    !battle.running||
    !battle.awaitingAction||
    battle.busy
  )return;

  const u=battle.current;
  if(!u||u.side!=='ally')return;

  if(useSkill&&u.skillCount<u.charge)return;

  battle.busy=true;
  battle.awaitingAction=false;

  await performAction(u,useSkill);

  if(!battle||!battle.running)return;

  battle.busy=false;
  clearActing();

  if(checkBattleEnd())return;

  await sleep(450);
  advanceTurn();
}

async function enemyAct(u){
  if(!battle||!battle.running)return;

  battle.busy=true;

  const c=byId(u.id);
  const useSkill=u.skillCount>=u.charge;

  battle.message=
    u.name+' の'+
    (useSkill?'スキル「'+c.skill+'」':'通常攻撃')+
    '！';

  renderBattle();

  await sleep(350);
  await performAction(u,useSkill);

  if(!battle||!battle.running)return;

  battle.busy=false;
  clearActing();

  if(checkBattleEnd())return;

  await sleep(500);
  advanceTurn();
}

async function performAction(u,useSkill){
  if(!battle||!battle.running)return;

  const c=byId(u.id);
  let targets=[];

  if(!useSkill){
    const target=chooseAttackTarget(u);

    if(target){
      dealDamage(u,target,getAttackPower(u),false);
      targets=[target];
    }

    u.skillCount=Math.min(
      u.charge,
      u.skillCount+1
    );
  }else{
    u.skillCount=0;

    const power=c.power*u.skillMultiplier;

    if(c.effect==='damage'){
      if(c.target==='all'){
        targets=aliveUnits(
          u.side==='ally'?battle.enemies:battle.allies
        );

        for(const target of targets){
          dealDamage(u,target,power,true);
        }

        battle.message=
          u.name+' の「'+c.skill+'」！'+
          '敵全体に攻撃！';
      }else{
        const target=chooseAttackTarget(u);
        if(target){
          dealDamage(u,target,power,true);
          targets=[target];
        }
      }
    }

    else if(c.effect==='heal'){
      const allies=u.side==='ally'
        ?battle.allies:battle.enemies;

      const target=c.target==='self'
        ?u
        :[...aliveUnits(allies)]
          .sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];

      if(target){
        const amount=healUnit(target,power);
        battle.message=
          u.name+' の「'+c.skill+'」！'+
          target.name+' のHPを '+amount+' 回復！';
        targets=[target];
      }
    }

    else if(c.effect==='evade'){
      u.evade=1;
      battle.message=
        u.name+' は回避状態になった！';
      targets=[u];
    }

    else if(c.effect==='guard'){
      u.guard=Math.min(.95,power/100);
      battle.message=
        u.name+' は防御態勢を取った！';
      targets=[u];
    }

    else if(c.effect==='buffAlly'){
      const allies=u.side==='ally'
        ?battle.allies:battle.enemies;

      for(const target of aliveUnits(allies)){
        target.buff=1+power/100;
        target.buffTurns=2;
      }

      battle.message=
        u.name+' の「'+c.skill+'」！'+
        '味方の攻撃力が上昇！';
      targets=aliveUnits(allies);
    }
  }

  if(u.buffTurns>0){
    u.buffTurns--;
    if(u.buffTurns===0)u.buff=1;
  }

  renderBattle();

  for(const target of targets){
    if(c.effect==='heal'&&useSkill){
      showEffect(target,'回復',true);
    }else if(
      useSkill&&
      ['guard','evade','buffAlly'].includes(c.effect)
    ){
      showEffect(target,'強化',true);
    }else{
      showEffect(target,'HIT!');
    }
  }

  await sleep(650);
}

function checkBattleEnd(){
  if(!battle||!battle.running)return true;

  if(aliveUnits(battle.enemies).length===0){
    finishBattle(true);
    return true;
  }

  if(aliveUnits(battle.allies).length===0){
    finishBattle(false);
    return true;
  }

  return false;
}

/* =========================
   ステージ報酬
========================= */

function createStageDrop(stage){
  const settings=STAGE_ENEMIES[stage]||[];
  const candidates=[...new Set(
    settings.map(item=>item[0])
  )];

  const successful=[];

  for(const id of candidates){
    const c=byId(id);
    if(!c)continue;

    const chance=CHARACTER_DROP_RATES[c.rarity]||0;

    if(Math.random()*100<chance){
      successful.push(id);
    }
  }

  if(!successful.length)return null;

  const id=successful[
    Math.floor(Math.random()*successful.length)
  ];

  const message=addCharacter(id);

  return {
    id,
    name:byId(id).name,
    rarity:byId(id).rarity,
    message
  };
}

function grantStageRewards(stage){
  const previousClears=
    Number(state.stageClearCounts[stage])||0;

  const firstClear=previousClears===0;
  const baseGold=STAGE_GOLD[stage]||200;

  const gold=Math.floor(
    baseGold*Math.pow(.8,previousClears)
  );

  state.gold+=gold;

  let gems=0;

  if(firstClear&&Math.random()<.2){
    gems=50;
    state.gems+=gems;
  }

  let ringReward=null;

  if(stage===20&&firstClear){
    state.ringInventory.power=
      (Number(state.ringInventory.power)||0)+1;

    ringReward='power';
  }

  const drop=createStageDrop(stage);

  state.stageClearCounts[stage]=previousClears+1;

  if(stage>state.clearedStage){
    state.clearedStage=stage;
  }

  state.stage=Math.min(
    IMPLEMENTED_STAGE,
    state.clearedStage+1
  );

  save();

  return {
    firstClear,
    gold,
    gems,
    ringReward,
    drop
  };
}

function finishBattle(victory){
  if(!battle||!battle.running)return;

  battle.running=false;
  battle.busy=false;
  battle.awaitingAction=false;
  clearActing();

  const rewards=victory
    ?grantStageRewards(battle.stage)
    :null;

  battle.result={
    victory,
    rewards
  };

  renderBattle();
}

function renderBattleResult(){
  if(!battle?.result)return;

  const {victory,rewards}=battle.result;

  if(!victory){
    $('actionArea').innerHTML=`
      <div class="result">
        <h2>敗北…</h2>
        <p>編成や装備を見直して再挑戦しよう。</p>
        <button data-action="returnMap">
          草原マップへ戻る
        </button>
      </div>`;
    return;
  }

  let rewardHTML=`
    <p>🪙 金貨 +${rewards.gold}</p>
  `;

  if(rewards.gems){
    rewardHTML+=`
      <p>💎 ジェム +${rewards.gems}</p>
    `;
  }

  if(rewards.ringReward){
    const ring=RINGS[rewards.ringReward];

    rewardHTML+=`
      <p>
        ${ring.icon}
        ${ring.name} ×1
        <br>
        <span class="small">初回クリア確定報酬</span>
      </p>`;
  }

  if(rewards.drop){
    rewardHTML+=`
      <p>
        🎁 キャラクタードロップ！<br>
        <b>${esc(rewards.drop.name)}</b><br>
        <span class="small">
          ${esc(rewards.drop.message)}
        </span>
      </p>`;
  }

  $('actionArea').innerHTML=`
    <div class="result">
      <h2>🎉 ステージクリア！</h2>
      <p>ステージ ${battle.stage} 勝利！</p>
      ${rewards.firstClear?
        '<p>✨ 初回クリア！</p>':''}
      ${rewardHTML}
      <button data-action="returnMap">
        草原マップへ戻る
      </button>
    </div>`;
}

function returnMap(){
  if(battle?.running){
    battle.running=false;
    battle.token=-1;
  }

  battle=null;

  selectedStage=Math.min(
    IMPLEMENTED_STAGE,
    Math.max(1,state.clearedStage+1)
  );

  showPage('battle');
}

/* =========================
   ステージ選択
========================= */

function selectStage(stage){
  if(!Number.isInteger(stage))return;

  if(stage<1||stage>IMPLEMENTED_STAGE)return;

  if(stage>state.clearedStage+1){
    showError('まだ解放されていません。');
    return;
  }

  selectedStage=stage;
  renderAll();
}

/* =========================
   ガチャ表示の補助
========================= */

function ensureSummonProgress(){
  if($('summonProgress'))return;

  const progress=document.createElement('div');
  progress.id='summonProgress';
  progress.className='small';
  progress.style.marginBottom='10px';

  const controls=$('summonControls');
  controls.parentNode.insertBefore(progress,controls);
}

/* =========================
   ボタン操作
========================= */

document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button||button.disabled)return;

  const page=button.dataset.page;

  if(page){
    showPage(page);
    return;
  }

  const action=button.dataset.action;
  if(!action)return;

  const id=button.dataset.id;
  const index=Number(button.dataset.index);
  const type=button.dataset.type;
  const stage=Number(button.dataset.stage);

  switch(action){
    case 'summon':
      ensureSummonProgress();
      summon(Number(button.dataset.count));
      break;

    case 'nextSummon':
      nextSummon();
      break;

    case 'skipSummon':
      skipSummon();
      break;

    case 'toggleParty':
      toggleParty(id);
      break;

    case 'openCharacterRingModal':
      openCharacterRingModal(id);
      break;

    case 'closeCharacterRingModal':
      closeCharacterRingModal();
      break;

    case 'openRingList':
      openRingList(id,index);
      break;

    case 'closeEquipmentModal':
      closeEquipmentModal();
      break;

    case 'equipRing':
      equipRing(id,index,type);
      break;

    case 'unequipRing':
      unequipRing(id,index);
      break;

    case 'selectStage':
      selectStage(stage);
      break;

    case 'startBattle':
      startBattle();
      break;

    case 'battleAttack':
      allyAct(false);
      break;

    case 'battleSkill':
      allyAct(true);
      break;

    case 'returnMap':
      returnMap();
      break;
  }
});

/* =========================
   初期化
========================= */

window.addEventListener('error',event=>{
  console.error(event.error||event.message);
  showError(
    'ゲーム内でエラーが発生しました：'+
    (event.message||'不明なエラー')
  );
});

renderAll();

</script>
