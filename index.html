

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星詠みの旅団</title>
<style>
:root{
  --bg:#101525;
  --panel:#1b2540;
  --gold:#f4c76b;
  --text:#f4f5fb;
  --muted:#aab4ca;
  --line:#394866;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100dvh;
  color:var(--text);
  background:radial-gradient(ellipse at top,#202d4c,#101525 60%);
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
}
button{
  font:inherit;
  color:inherit;
  border:1px solid #62708e;
  background:linear-gradient(#354666,#263453);
  border-radius:11px;
  padding:10px 12px;
  cursor:pointer;
  touch-action:manipulation;
}
button:disabled{opacity:.4;cursor:default}
.wrap{max-width:900px;margin:auto;padding:10px}
.row,.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top{justify-content:space-between;padding:8px 0}
.brand,.section-title{color:var(--gold);font-weight:900}
.brand{font-size:21px}
.pill{
  background:#202c46;
  border:1px solid var(--line);
  padding:5px 9px;
  border-radius:25px;
}
.nav{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
  margin:8px 0 12px;
}
.nav button{padding:10px 2px;font-size:clamp(10px,2.5vw,14px)}
.page{display:none}
.page.active{display:block}
.panel{
  background:linear-gradient(145deg,#1d2945,#172139);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px;
  margin-bottom:10px;
}
.hero{text-align:center;padding:20px}
.hero h1{font-size:clamp(20px,5vw,30px);color:var(--gold)}
.section-title{font-size:19px;margin:0 0 9px}
.muted,.small{color:var(--muted)}
.small{font-size:12px}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.card{
  position:relative;
  min-width:0;
  background:#202d49;
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 7px 39px;
}
.card.selected{outline:2px solid var(--gold)}
.portrait{
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
}
.portrait img{
  display:block;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}
.name{font-weight:900;overflow-wrap:anywhere}
.stats{font-size:12px;line-height:1.6;margin:5px 0}
.normal{color:#cbd5e1}
.rare{color:#74b8ff}
.epic{color:#d9a0ff}
.wide{width:100%}
.plus{
  position:absolute;
  bottom:5px;
  right:5px;
  width:28px;
  height:28px;
  padding:0;
  border-radius:8px;
  color:#ffe5a0;
  border-color:#b99550;
  background:#58472d;
  font-size:20px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:#050914ed;
  align-items:center;
  justify-content:center;
  padding:12px;
}
.modal.active{display:flex}
.modal-box{
  width:100%;
  max-width:460px;
  max-height:90dvh;
  overflow:auto;
  background:linear-gradient(#263653,#151f34);
  border:1px solid #7185a8;
  border-radius:16px;
  padding:15px;
}
.slots,.stock{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.slot{
  min-height:65px;
  background:#111b30;
  border:1px solid #465779;
  border-radius:10px;
  padding:8px;
  text-align:center;
}
.slot.empty{border-style:dashed}
.stock{grid-template-columns:repeat(3,1fr);margin:10px 0}
.stock>div{
  background:#111b30;
  border-radius:9px;
  padding:8px 3px;
  text-align:center;
  font-size:12px;
}
.choice{
  display:flex;
  width:100%;
  justify-content:space-between;
  align-items:center;
  text-align:left;
  margin:8px 0;
}

/* ===== 新しいキャラクター図鑑 ===== */
.dex-tabs{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
  margin-bottom:8px;
}
.dex-tabs button{padding:8px 2px;font-size:12px}
.dex-tabs .selected{
  border:2px solid var(--gold);
  color:var(--gold);
  background:#354666;
}
.dex-pages{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:9px 0;
}
.dex-pages span{font-weight:900;color:var(--gold)}
#characterList{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  align-items:stretch;
}
.encyclopedia-card{
  position:relative;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  background:#202d49;
  border:1px solid var(--line);
  border-radius:10px;
  padding:4px 3px 32px;
  overflow:hidden;
}
.encyclopedia-image{
  width:100%;
  display:block;
  flex:0 0 auto;
  margin:0;
  padding:0;
  border:0;
  background:transparent;
}
.encyclopedia-image .portrait{
  height:clamp(130px,19vh,185px);
  width:100%;
  padding:0;
  margin:0;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.encyclopedia-image img{
  display:block;
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  object-position:center bottom;
  transform:none;
}
.encyclopedia-card .name{
  margin-top:3px;
  font-size:clamp(10px,2.6vw,13px);
  line-height:1.25;
  overflow-wrap:anywhere;
}
.encyclopedia-level{
  margin-top:3px;
  color:var(--gold);
  font-weight:800;
  font-size:12px;
  line-height:1.2;
}
.encyclopedia-card .plus{
  bottom:4px;
  right:4px;
  width:25px;
  height:25px;
  font-size:17px;
}
.encyclopedia-locked{opacity:.85}
.encyclopedia-locked .encyclopedia-image{cursor:default}
.encyclopedia-locked .name{color:var(--muted)}
.encyclopedia-detail-image .portrait{height:220px}
.encyclopedia-detail-stats{
  line-height:1.9;
  padding:12px;
  margin:10px 0;
  background:#111b30;
  border-radius:12px;
}

/* ===== ステージマップ ===== */
.stage-map{
  padding:12px;
  border:2px solid #58794e;
  border-radius:16px;
  background:linear-gradient(145deg,#456c43,#31543b 55%,#426a40);
}
.map-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
}
.stage-node{
  min-height:70px;
  padding:5px 2px;
  background:linear-gradient(#e1e9b7,#a9c27b);
  color:#263b26;
  border:2px solid #b4c98b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.stage-node .num{font-size:20px;font-weight:900}
.stage-node .small{color:inherit;font-size:10px}
.stage-node.completed{background:linear-gradient(#c5e9bb,#76b879)}
.stage-node.current{background:linear-gradient(#fff0a8,#e9b94e)}
.stage-node.boss{background:linear-gradient(#f1b2a3,#bd625b);color:#451e25}
.stage-node.locked{background:#788477;color:#344236}
.stage-node.selected{outline:3px solid white}
.stage-info{
  margin-top:10px;
  background:#203c2dcc;
  padding:10px;
  border-radius:10px;
  line-height:1.7;
}
.map-start{
  width:100%;
  margin-top:10px;
  background:linear-gradient(#e6c16a,#a77c32);
  color:#30230e;
  font-weight:900;
}

/* ===== 戦闘画面 ===== */
.battle-side{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
}
.unit{
  position:relative;
  min-width:0;
  background:#263653;
  border:1px solid #5476a4;
  border-radius:10px;
  text-align:center;
  padding:5px 3px;
}
.unit.enemy{background:#513541;border-color:#895767}
.unit.dead{opacity:.35;filter:grayscale(1)}
.unit.active{
  outline:2px solid #ffe17c;
  box-shadow:0 0 12px #f4c76b99;
}
.unit.enemy.active{outline-color:#ff8585}
.unit .portrait{height:clamp(80px,16vh,145px)}
.unit .name{font-size:12px}
.unit .small{font-size:10px}
.unit h3{margin:3px}
.hpbar{
  height:8px;
  background:#101827;
  border-radius:10px;
  overflow:hidden;
  margin:5px 0;
}
.hpbar i{
  display:block;
  height:100%;
  background:#76d6a1;
}
.battle-divider{
  text-align:center;
  font-size:18px;
  color:var(--gold);
  font-weight:900;
  margin:7px;
}
.action-panel{
  margin-top:9px;
  background:#202e4b;
  border:1px solid #536486;
  border-radius:11px;
  padding:10px;
}
.action-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:7px;
}
.action-buttons button{min-height:42px}
.attack{background:#853c49}
.skill{background:#5b4694}
.enemy-preview{
  background:#633b48;
  border:2px solid #bd687b;
  padding:10px;
  border-radius:10px;
  line-height:1.6;
}
.result{text-align:center;line-height:1.7}
.result h2{color:var(--gold)}
.effect{
  position:absolute;
  top:26%;
  left:0;
  width:100%;
  z-index:4;
  font-size:25px;
  font-weight:900;
  color:#ff8585;
  text-shadow:0 2px 5px black;
  pointer-events:none;
  animation:effectPop .85s ease-out forwards;
}
.effect.heal{color:#86f3ad}
.effect.buff{color:#ffe17c}
@keyframes effectPop{
  0%{transform:translateY(15px) scale(.6);opacity:0}
  25%{transform:translateY(-4px) scale(1.2);opacity:1}
  65%{opacity:1}
  100%{transform:translateY(-38px);opacity:0}
}
.error{
  display:none;
  background:#542d36;
  border:1px solid #b65d6a;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
.summon{
  display:none;
  position:fixed;
  inset:0;
  z-index:1100;
  background:radial-gradient(ellipse,#26345b,#080c18);
  align-items:center;
  justify-content:center;
  padding:15px;
}
.summon.active{display:flex}
.summon-box{text-align:center;max-width:520px;width:100%}
.magic{
  position:relative;
  margin:15px auto;
  width:210px;
  height:210px;
  border-radius:50%;
  border:3px solid #7ecbff;
  box-shadow:0 0 20px #398cff,inset 0 0 30px #398cff;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:rotate 6s linear infinite;
}
.magic img{
  position:relative;
  z-index:1;
  width:150px;
  height:150px;
  object-fit:contain;
  animation:counterrotate 6s linear infinite;
}
.summon.epic-mode .magic{
  border-color:#ffe08b;
  box-shadow:0 0 28px #ffc34b,0 0 42px #d58aff;
}
.summon-name{
  font-size:23px;
  font-weight:900;
  color:var(--gold);
}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes counterrotate{to{transform:rotate(-360deg)}}

/* ===== デイリー特典 ===== */
.daily-panel{text-align:center}
.daily-panel h2{color:var(--gold)}
.daily-wheel-wrap{
  position:relative;
  width:min(76vw,290px);
  aspect-ratio:1;
  margin:15px auto;
}
.daily-wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:7px solid var(--gold);
  box-shadow:0 0 22px #f4c76b66;
  transition:transform 4.5s cubic-bezier(.12,.75,.12,1);
}
.daily-wheel-label{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:center;
  color:white;
  font-size:11px;
  font-weight:900;
  text-shadow:0 1px 3px black;
  pointer-events:none;
}
.daily-pointer{
  position:absolute;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  color:#ff7777;
  font-size:36px;
  text-shadow:0 2px 3px black;
}
.daily-center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:54px;
  height:54px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--gold);
  color:#34240a;
  border:4px solid white;
  font-weight:900;
}
.daily-buttons{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:10px;
}
.daily-buttons button{min-width:135px}
.footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:9px;
}

/* ===== スマホ画面最適化 ===== */
@media(max-width:600px){
  html,body{width:100%;overflow-x:hidden}
  .wrap{max-width:100%;padding:5px 6px}
  .top{padding:3px 0;gap:4px}
  .brand{font-size:15px}
  .top .row{gap:4px}
  .pill{padding:3px 6px;font-size:11px}
  .nav{gap:3px;margin:5px 0 7px}
  .nav button{
    padding:9px 1px;
    font-size:10px;
    border-radius:7px;
  }
  .panel{
    padding:7px;
    margin-bottom:6px;
    border-radius:10px;
  }
  .section-title{font-size:15px;margin-bottom:5px}
  .panel p{margin:5px 0}
  .hero{padding:10px 6px}
  .hero h1{font-size:19px;margin:5px 0}
  .grid{gap:5px}
  .card{padding:4px 3px 32px}
  .card .portrait{height:60px}
  .card .name{font-size:11px}
  .card .stats{font-size:10px}
  .card button.wide{
    font-size:10px;
    padding:5px 1px;
  }
  #characterList{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:4px;
  }
  .encyclopedia-card{padding:3px 2px 29px}
  .encyclopedia-image .portrait{
    height:clamp(110px,16vh,155px);
  }
  .encyclopedia-card .name{font-size:11px}
  .encyclopedia-level{font-size:11px}
  .battle-side{gap:4px}
  .unit{padding:3px 2px}
  .unit .portrait{height:clamp(65px,12vh,100px)}
  .unit .name,.unit .small{font-size:10px}
  .hpbar{height:6px;margin:3px 0}
  .battle-divider{margin:4px}
  .action-panel{margin-top:5px;padding:7px}
  .action-buttons button{
    min-height:38px;
    padding:5px;
    font-size:12px;
  }
  .stage-map{padding:6px}
  .map-grid{gap:4px}
  .stage-node{min-height:47px;padding:3px 1px}
  .stage-node .num{font-size:15px}
  .stage-node .small{font-size:9px}
  .stage-info{
    padding:6px;
    margin-top:6px;
    font-size:12px;
  }
  .modal{padding:7px}
  .modal-box{max-height:91dvh;padding:10px}
  .footer{display:none}
}
</style>
</head>

<body>
<div class="wrap">

  <header class="top">
    <div class="brand">✦ 星詠みの旅団</div>
    <div class="row">
      <span class="pill">💎 <b id="gems">0</b></span>
      <span class="pill">🪙 <b id="gold">0</b></span>
      <span class="pill">到達 <b id="stage">1</b></span>
    </div>
  </header>

  <div id="errorBox" class="error"></div>

  <nav class="nav">
    <button data-page="home">ホーム</button>
    <button data-page="gacha">ガチャ</button>
    <button data-page="team">編成・図鑑</button>
    <button data-page="battle">戦闘</button>
    <button data-page="shop">ショップ</button>
  </nav>

  <main>

    <!-- ===== ホーム ===== -->
    <section id="home" class="page active">
      <div class="panel hero">
        <h1>星の導きが、旅の始まり</h1>
        <p class="muted">
          仲間を集め、育て、未知の敵に挑もう。
        </p>
        <div class="row" style="justify-content:center">
          <button data-page="gacha">仲間を召喚する</button>
          <button data-page="team">編成を確認する</button>
          <button data-page="battle">冒険に出る</button>
        </div>
      </div>

      <div class="panel">
        <h2 class="section-title">旅団の状況</h2>
        <div id="homeSummary"></div>
      </div>

      <div class="panel daily-panel">
        <h2 class="section-title">🎁 デイリー特典</h2>
        <p class="small">毎日0時（日本時間）に更新！</p>
        <div class="daily-buttons">
          <button data-action="dailyBonusOpen">
            🎁 ログインボーナス
          </button>
          <button data-action="dailyWheelOpen">
            🎰 ログインルーレット
          </button>
        </div>
        <p id="dailyStatus" class="small"></p>
      </div>
    </section>

    <!-- ===== ガチャ ===== -->
    <section id="gacha" class="page">
      <div class="panel">
        <h2 class="section-title">星詠み召喚</h2>

        <p>
          ノーマル 70% /
          レア 25% /
          エピック 5%
        </p>

        <div class="row">
          <button data-action="summon" data-count="1">
            1回召喚（💎100）
          </button>
          <button data-action="summon" data-count="10">
            10回召喚（💎900）
          </button>
        </div>

        <div id="gachaResult" style="margin-top:12px">
          召喚結果が表示されます。
        </div>
      </div>

      <div class="panel">
        <h2 class="section-title">所持状況</h2>
        <div id="gachaOwned"></div>
      </div>
    </section>

    <!-- ===== 編成・図鑑 ===== -->
    <section id="team" class="page">

      <div class="panel">
        <h2 class="section-title">パーティ編成</h2>
        <p class="muted">
          最大3体まで編成できます。
        </p>
        <div id="partyView" class="grid"></div>
      </div>

      <div class="panel">
        <h2 class="section-title">
          キャラクター図鑑
        </h2>

        <div id="dexControls"></div>

        <div id="characterList" class="grid"></div>
      </div>

    </section>

    <!-- ===== ショップ ===== -->
    <section id="shop" class="page">
      <div class="panel">
        <h2 class="section-title">ショップ</h2>
        <p>ショップは準備中です。</p>
      </div>
    </section>

    <!-- ===== 草原マップ ===== -->
    <section id="battle" class="page">
      <div class="panel">
        <h2 class="section-title">草原マップ</h2>
        <p class="muted">
          クリア済みのステージにも再挑戦できます。
        </p>
        <div id="stageMap"></div>
      </div>

      <div class="panel">
        <h2 class="section-title">冒険準備</h2>
        <div id="battleIntro"></div>
        <button
          id="startBattleButton"
          class="map-start"
          data-action="startBattle">
          挑戦する
        </button>
      </div>
    </section>

    <!-- ===== 戦闘画面 ===== -->
    <section id="battleFight" class="page">
      <div class="panel">

        <div class="row"
          style="justify-content:space-between">
          <h2 class="section-title">戦闘</h2>
          <button data-action="returnMap">
            ステージ選択に戻る
          </button>
        </div>

        <h3 style="color:#ffaaaa">
          ▼ 敵軍 <span id="bossLabel"></span>
        </h3>

        <div id="enemyUnits" class="battle-side"></div>

        <div class="battle-divider">✦ VS ✦</div>

        <h3 style="color:#9acbff">▲ 旅団</h3>

        <div id="allyUnits" class="battle-side"></div>

        <div id="actionArea" class="action-panel"></div>

      </div>
    </section>

  </main>

  <div class="footer">星詠みの旅団</div>
</div>

<!-- ===== 図鑑詳細 ===== -->
<div id="encyclopediaModal" class="modal">
  <div class="modal-box">
    <div id="encyclopediaDetail"></div>
    <button class="wide" data-action="closeEncyclopedia">
      図鑑に戻る
    </button>
  </div>
</div>

<!-- ===== 指輪装備 ===== -->
<div id="characterRingModal" class="modal">
  <div class="modal-box">
    <h2 class="section-title">
      アクセサリー一覧
    </h2>
    <div id="characterRingContent"></div>
    <button
      class="wide"
      data-action="closeCharacterRingModal">
      図鑑に戻る
    </button>
  </div>
</div>

<div id="equipmentModal" class="modal">
  <div class="modal-box">
    <h2 class="section-title">指輪を選択</h2>
    <div
      id="equipmentModalCharacter"

/* ===== 初期セーブデータ ===== */

function fresh(){
  return {
    gems:500,
    gold:300,
    stage:1,
    clearedStage:0,
    stageClearCounts:{},
    owned:{
      swordman:{level:1,dupes:0},
      archer:{level:1,dupes:0},

    },
    party:['swordman','archer','spearman'],

      power:0,
      heart:0,
      skill:0
    },
    equipment:{}
  };
}

/* ===== セーブデータ読み込み ===== */

function loadState(){
  let saved;

  try{
    saved=JSON.parse(localStorage.getItem(KEY));
  }catch(e){}

  if(!saved || typeof saved!=='object'){
    return fresh();
  }

  const s={...fresh(),...saved};

  s.owned=saved.owned||fresh().owned;

  s.party=Array.isArray(saved.party)
    ? saved.party
        .filter(id=>s.owned[id]&&byId(id))
        .slice(0,3)
    : fresh().party;

  s.stageClearCounts=saved.stageClearCounts||{};

  s.ringInventory={
    power:0,
    heart:0,
    skill:0,
    ...saved.ringInventory
  };

  s.equipment=saved.equipment||{};

  s.gems=Math.max(0,Number(s.gems)||0);
  s.gold=Math.max(0,Number(s.gold)||0);

  s.clearedStage=Math.min(
    20,
    Math.max(0,Number(s.clearedStage)||0)
  );

  s.stage=Math.min(
    20,
    Math.max(1,Number(s.stage)||1)
  );

  for(const id of Object.keys(s.owned)){
    const c=byId(id);

    if(!c){
      delete s.owned[id];
      continue;
    }

    const o=s.owned[id];

    if(!o || typeof o!=='object'){
      s.owned[id]={level:1,dupes:0};
    }else{
      o.level=Math.min(
        c.max,
        Math.max(1,Number(o.level)||1)
      );
      o.dupes=Math.max(0,Number(o.dupes)||0);
    }
  }

  return s;
}

/*
  濁点を含む日本語ファイル名にも対応
  画像はすべて images フォルダから読み込む
*/

function imagePath(fileName){
  const name=String(fileName||'');

  const needsNFD=
    /[ガ-ゴザ-ゾダ-ドバ-ボパ-ポヴが-ござ-ぞだ-どば-ぼぱ-ぽ]/.test(name);

  const normalized=needsNFD
    ? name.normalize('NFD')
    : name;

  return 'images/'+encodeURIComponent(normalized);
}

function portrait(id){
  const c=byId(id);

  if(!c){
    return '<div class="portrait">？</div>';
  }

  const path=imagePath(c.imageFile);

  return `
    <div class="portrait">
      <img
        src="${path}"
        alt="${esc(c.name)}"
        onerror="
          this.onerror=null;
          this.style.display='none';
          this.parentElement.append('⚔️');
        "
      >
    </div>
  `;
}

/*
  未所持キャラ専用画像
  images/未所持.png
*/

function unknownPortrait(){
  return `
    <div class="portrait">
      <img
        src="images/${encodeURIComponent('未所持.png')}"
        alt="未所持キャラクター"
        onerror="
          this.onerror=null;
          this.style.display='none';
          this.parentElement.append('🔒');
        "
      >
    </div>
  `;
}

function rarityClass(rarity){
  if(rarity==='エピック')return 'epic';
  if(rarity==='レア')return 'rare';
  return 'normal';
}

/* =====================================
   キャラクター能力値
===================================== */

function getLevelMultiplier(id){
  const c=byId(id);
  if(!c)return 1;

  const level=state.owned[id]?.level||1;

  return Math.pow(1+c.growth,level-1);
}

function getEquipped(id,type){
  const equipment=state.equipment[id]||[];

  return equipment.filter(x=>x===type).length;
}

function getRingAvailable(type){
  let used=0;

  for(const equipment of Object.values(state.equipment)){
    if(Array.isArray(equipment)){
      used+=equipment.filter(x=>x===type).length;
    }
  }

  const inventory=Number(state.ringInventory[type])||0;

  return Math.max(0,inventory-used);
}

function getStats(id){
  const c=byId(id);

  if(!c){
    return {
      hp:0,
      atk:0,
      speed:0,
      skillMultiplier:1
    };
  }

  const m=getLevelMultiplier(id);

  return {
    hp:Math.floor(
      c.hp*m*(1+0.1*getEquipped(id,'heart'))
    ),

    atk:Math.floor(
      c.atk*m*(1+0.1*getEquipped(id,'power'))
    ),

    speed:c.speed,

    skillMultiplier:
      1+0.1*getEquipped(id,'skill')
  };
}

===================================== */

      </div>

        class="wide"
        data-action="toggleParty"
        data-id="${esc(id)}">
        ${inParty?'編成から外す':'編成する'}

    </article>
  `;
}

function toggleParty(id){
  if(!state.owned[id])return;

  if(state.party.includes(id)){
    state.party=state.party.filter(x=>x!==id);

      showError('編成は最大3体です');
      return;

    state.party.push(id);

  save();
  renderAll();
}

function changeDexRarity(rarity){
  const valid=['ノーマル','レア','エピック'];

  if(!valid.includes(rarity))return;

  dexRarity=rarity;
  dexPage=0;

  renderAll();
}

function changeDexPage(direction){
  const characters=CHARACTERS.filter(
    c=>c.rarity===dexRarity
  );

  const pages=Math.max(
    1,
    Math.ceil(characters.length/DEX_PER_PAGE)
  );

  dexPage=Math.max(
    0,
    Math.min(dexPage+direction,pages-1)
  );

  renderAll();
}

/* =====================================
   図鑑の描画
===================================== */

function renderDex(){
  const characters=CHARACTERS.filter(
    c=>c.rarity===dexRarity
  );

  const totalPages=Math.max(
    1,
    Math.ceil(characters.length/DEX_PER_PAGE)
  );

  dexPage=Math.max(
    0,
    Math.min(dexPage,totalPages-1)
  );

  const start=dexPage*DEX_PER_PAGE;

  const displayed=characters.slice(
    start,
    start+DEX_PER_PAGE
  );

  $('characterList').innerHTML=displayed
    .map(c=>encyclopediaCardHTML(c.id))
    .join('');

  $('dexControls').innerHTML=`
    <div class="dex-tabs">

      ${['ノーマル','レア','エピック'].map(r=>`
        <button
          class="${dexRarity===r?'selected':''}"
          data-action="dexRarity"
          data-rarity="${r}">
          ${r}
        </button>
      `).join('')}

    </div>

    <div class="dex-pages">

      <button
        data-action="dexPage"
        data-direction="-1"
        ${dexPage===0?'disabled':''}>
        ◀ 前へ
      </button>

      <span>
        ${dexPage+1} / ${totalPages}
      </span>

      <button
        data-action="dexPage"
        data-direction="1"
        ${dexPage>=totalPages-1?'disabled':''}>
        次へ ▶
      </button>

    </div>
  `;
}

function equip(id,index,type){
  if(!RINGS[type])return;
  if(getRingAvailable(type)<=0)return;

  const c=byId(id);

  if(!c||!state.owned[id])return;

  if(index<0||index>=(c.slot??0))return;

  if(!state.equipment[id]){

  if(state.equipment[id][index])return;

  state.equipment[id][index]=type;

  save();
  renderSlotModal();
  renderRingModal();

  renderSlotModal();
  renderRingModal();
  renderAll();
}

/* =====================================
   キャラクターの入手・レベルアップ
===================================== */

function addCharacter(id){
  const c=byId(id);

  if(!c)return '';

  if(!state.owned[id]){
    state.owned[id]={
      level:1,
      dupes:0
    };

    return '新しい仲間を獲得！';
  }

  const o=state.owned[id];

  o.dupes=(o.dupes||0)+1;

  while(
    o.level<c.max
    &&o.dupes>=o.level
  ){
    o.dupes-=o.level;
    o.level++;
  }

  return '重複獲得！ Lv.'+o.level;
}

   ガチャ抽選
===================================== */

function drawCharacter(){
  const r=Math.random();

  const rarity=
    r<.7
      ? 'ノーマル'
      : r<.95
        ? 'レア'
        : 'エピック';

  const candidates=CHARACTERS.filter(
    c=>c.rarity===rarity
  );

  return random(candidates);
}

/* =====================================
   ガチャ実行
===================================== */

function summon(count){
  const cost=count===10?900:100;

  if(state.gems<cost){
    showError('ジェムが足りません');
    return;
  }

  state.gems-=cost;

  summonQueue=[];

  for(let i=0;i<count;i++){
    const c=drawCharacter();

    if(!c)continue;

    summonQueue.push({
      c,
      message:addCharacter(c.id)
    });
  }

  save();
  renderAll();

  summonIndex=0;

  $('summonOverlay').classList.add('active');

  showSummon();
}

   ガチャ演出
===================================== */

function showSummon(){
  const item=summonQueue[summonIndex];

  if(!item){
    finishSummon();
    return;
  }

  const c=item.c;

  $('summonOverlay').classList.toggle(
    'epic-mode',
    c.rarity==='エピック'
  );

  $('summonVisual').innerHTML=`
    <div class="magic">
      <img
        src="${imagePath(c.imageFile)}"

    <div class="summon-name">

    <p class="${rarityClass(c.rarity)}">
      ${esc(c.rarity)}

/* =====================================
   戦闘システム
===================================== */

let battleSerial=0;

function makeUnit(id,side,options={}){
  const c=byId(id);
  const multiplier=options.multiplier??1;

  const stats=side==='ally'
    ?getStats(id)
    :{
      hp:Math.floor(
        c.hp*multiplier*(options.hpMultiplier||1)
      ),
      atk:Math.floor(c.atk*multiplier),
      speed:Math.max(
        1,Math.floor(c.speed*multiplier)
      ),
      skillMultiplier:1
    };

  if(options.hp)stats.hp=options.hp;
  if(options.speed)stats.speed=options.speed;

  return {
    uid:++battleSerial,
    id,side,
    name:c.name,
    maxHp:stats.hp,
    hp:stats.hp,
    atk:stats.atk,
    speed:stats.speed,
    charge:options.charge??c.charge,
    skillCount:0,
    gauge:0,
    skillMultiplier:stats.skillMultiplier,
    buff:1,
    buffTurns:0,
    permanentBuff:1,
    guard:0,
    evade:0,
    poison:0,
    acting:false,
    effectText:'',
    effectKind:''
  };
}

function startBattle(){
  if(battle?.running)return;

  if(selectedStage>state.clearedStage+1){
    showError('まだ解放されていません');
    return;
  }

  if(!state.party.length){
    showError('編成してください');
    return;
  }

  const allies=state.party.map(
    id=>makeUnit(id,'ally')
  );

  const enemies=STAGE_ENEMIES[selectedStage]
    .map(([id,m,hpMul])=>{
      const options={
        multiplier:m,
        hpMultiplier:hpMul||1
      };

      if(selectedStage===10&&id==='ゴーレム'){
        options.hp=700;
        options.speed=12;
        options.charge=3;
      }

      return makeUnit(id,'enemy',options);
    });

  battle={
    stage:selectedStage,
    allies,
    enemies,
    running:true,
    busy:false,
    current:null,
    awaitingAction:false,
    result:null,
    token:++battleSerial,
    message:'戦闘開始！'
  };

  showPage('battleFight');
  renderBattle();
  advanceTurn();
}

/* =====================================
   ダメージ・回復演出
===================================== */

function showEffect(target,text,kind=''){
  if(!battle||!target)return;

  const units=target.side==='enemy'
    ?battle.enemies
    :battle.allies;

  const parent=target.side==='enemy'
    ?$('enemyUnits')
    :$('allyUnits');

  const index=units.findIndex(
    u=>u.uid===target.uid
  );

  const card=parent?.children[index];

  if(!card)return;

  const rect=card.getBoundingClientRect();

  const popup=document.createElement('div');
  popup.textContent=String(text);

  Object.assign(popup.style,{
    position:'fixed',
    left:(rect.left+rect.width/2)+'px',
    top:(rect.top+rect.height*.3)+'px',
    transform:'translateX(-50%)',
    zIndex:'9999',
    pointerEvents:'none',
    fontSize:'30px',
    fontWeight:'900',
    color:kind==='heal'
      ?'#86f3ad'
      :kind==='buff'
        ?'#ffe17c'
        :'#ff8585',
    textShadow:'0 2px 5px black',
    whiteSpace:'nowrap',
    transition:
      'transform .9s ease-out, opacity .9s ease-out'
  });

  document.body.appendChild(popup);

  requestAnimationFrame(()=>{
    popup.style.transform='translate(-50%,-45px)';
    popup.style.opacity='0';
  });

  setTimeout(()=>popup.remove(),950);
}

/* =====================================
   行動順
===================================== */

function chooseNextUnit(){
  const units=[
    ...alive(battle.allies),
    ...alive(battle.enemies)
  ];

  for(let i=0;i<10000;i++){
    const ready=units.filter(
      u=>u.gauge>=100
    );

    if(ready.length){
      ready.sort((a,b)=>{
        if(a.side!==b.side){
          return a.side==='ally'?-1:1;
        }
        return b.gauge-a.gauge;
      });

      const u=ready[0];
      u.gauge-=100;

      return u;
    }

    for(const u of units){
      u.gauge+=u.speed;
    }
  }

  return units[0]||null;
}

function clearActing(){
  if(!battle)return;

  for(const u of [
    ...battle.allies,
    ...battle.enemies
  ]){
    u.acting=false;
  }
}

function getAttackPower(u){
  let atk=u.atk*u.buff*u.permanentBuff;

  if(
    u.id==='一閃スピアドン'
    &&u.hp<=u.maxHp/2
  ){
    atk*=1.5;
  }

  return Math.max(1,Math.floor(atk));
}

function chooseTarget(u){
  const opponents=u.side==='ally'
    ?battle.enemies
    :battle.allies;

  const targets=alive(opponents);

  if(u.id==='狙撃手アーチャー'){
    return [...targets]
      .sort((a,b)=>a.hp-b.hp)[0]||null;
  }

  return random(targets);
}

/* =====================================
   ダメージ処理
===================================== */

function dealDamage(attacker,target,amount,isSkill=false){
  if(!target||target.hp<=0)return 0;

  if(target.evade>0){
    target.evade--;
    showEffect(target,'回避','buff');
    return 0;
  }

  let damage=Math.max(
    1,Math.floor(amount)
  );

  if(target.guard>0){
    damage=Math.max(
      1,
      Math.floor(damage*(1-target.guard))
    );
    target.guard=0;
  }

  target.hp=Math.max(
    0,target.hp-damage
  );

  showEffect(target,'−'+damage);

  battle.message=
    attacker.name+' → '+target.name+
    '：'+damage+'ダメージ';

  if(
    target.id==='鍛錬剣士'
    &&target.hp>0
    &&attacker.hp>0
  ){
    if(Math.random()<(isSkill?1:.2)){
      const reflected=damage*2;

      attacker.hp=Math.max(
        0,attacker.hp-reflected
      );

      showEffect(attacker,'−'+reflected);

      battle.message+=
        ' / アルティメットカウンター！';
    }
  }

  return damage;
}

function healUnit(target,amount){
  const before=target.hp;

  target.hp=Math.min(
    target.maxHp,
    target.hp+Math.max(1,Math.floor(amount))
  );

  const healed=target.hp-before;

  showEffect(target,'+'+healed,'heal');

  return healed;
}

/* =====================================
   ターン進行
===================================== */

async function advanceTurn(){
  if(!battle||!battle.running||battle.busy)return;

  if(checkBattleEnd())return;

  clearActing();

  const u=chooseNextUnit();
  if(!u)return;

  battle.current=u;
  u.acting=true;

  if(u.poison>0){
    const damage=Math.max(
      1,Math.floor(u.maxHp*.08)
    );

    u.hp=Math.max(0,u.hp-damage);
    u.poison--;

    renderBattle();
    showEffect(u,'−'+damage);

    battle.message=
      u.name+' は毒で '+damage+' ダメージ！';

    await sleep(650);

    if(!battle?.running)return;

    if(u.hp<=0){
      clearActing();

      if(!checkBattleEnd()){
        advanceTurn();
      }

      return;
    }
  }

  if(u.side==='ally'){
    battle.awaitingAction=true;
    battle.message=
      u.name+' の行動を選択してください。';

    renderBattle();
    return;
  }

  battle.awaitingAction=false;

  const c=byId(u.id);
  const ready=u.skillCount>=u.charge;

  battle.message=
    u.name+' の行動予告：'+
    (ready
      ?'スキル「'+c.skill+'」'
      :'通常攻撃');

  renderBattle();

  const token=battle.token;

  await sleep(1100);

  if(
    !battle
    ||!battle.running
    ||battle.token!==token
  )return;

  await enemyAct(u);
}

async function allyAct(useSkill){
  if(
    !battle?.running
    ||!battle.awaitingAction
    ||battle.busy
  )return;

  const u=battle.current;

  if(!u||u.side!=='ally')return;
  if(useSkill&&u.skillCount<u.charge)return;

  battle.busy=true;
  battle.awaitingAction=false;

  await performAction(u,useSkill);

  if(!battle?.running)return;

  battle.busy=false;
  clearActing();

  if(checkBattleEnd())return;

  await sleep(450);

  advanceTurn();
}

async function enemyAct(u){
  if(!battle?.running)return;

  battle.busy=true;

  const c=byId(u.id);
  const useSkill=u.skillCount>=u.charge;

  battle.message=
    u.name+' の'+
    (useSkill
      ?'スキル「'+c.skill+'」'
      :'通常攻撃')+'！';

  renderBattle();

  await sleep(300);

  await performAction(u,useSkill);

  if(!battle?.running)return;

  battle.busy=false;
  clearActing();

  if(checkBattleEnd())return;

  await sleep(500);

  advanceTurn();
}

/* =====================================
   攻撃・スキル
===================================== */

async function performAction(u,useSkill){
  if(!battle?.running)return;

  const c=byId(u.id);

  if(!useSkill){
    const target=chooseTarget(u);

    if(target){
      dealDamage(
        u,target,getAttackPower(u),false
      );
    }

    u.skillCount=Math.min(
      u.charge,u.skillCount+1
    );
  }else{
    u.skillCount=0;

    const power=c.power*u.skillMultiplier;

    const allies=u.side==='ally'
      ?battle.allies
      :battle.enemies;

    const opponents=u.side==='ally'
      ?battle.enemies
      :battle.allies;

    if(c.effect==='damage'){
      const targets=c.target==='all'
        ?alive(opponents)
        :[chooseTarget(u)].filter(Boolean);

      for(const target of targets){
        dealDamage(u,target,power,true);
      }

      if(c.target==='all'){
        battle.message=
          u.name+' の「'+c.skill+
          '」！ 全体攻撃！';
      }
    }

    else if(c.effect==='poison'){
      const target=chooseTarget(u);

      if(target){
        dealDamage(u,target,power,true);

        if(target.hp>0){
          target.poison=3;
        }
      }
    }

    else if(c.effect==='heal'){
      const target=random(alive(allies));

      if(target){
        healUnit(target,power);
      }

      battle.message=
        u.name+' の「'+c.skill+'」！';
    }

    else if(c.effect==='healPercent'){
      for(const target of alive(allies)){
        healUnit(
          target,
          target.maxHp*power/100
        );
      }

      battle.message=
        u.name+' の「'+c.skill+'」！';
    }

    else if(
      c.effect==='evade'
      ||c.effect==='evadeSure'
    ){
      u.evade=1;

      showEffect(u,'回避','buff');

      battle.message=
        u.name+' は回避状態になった！';
    }

    else if(c.effect==='guard'){
      u.guard=Math.min(.95,power/100);

      showEffect(u,'防御','buff');

      battle.message=
        u.name+' は防御態勢を取った！';
    }

    else if(c.effect==='buffAlly'){
      for(const target of alive(allies)){
        target.buff=1+power/100;
        target.buffTurns=1;

        showEffect(target,'強化','buff');
      }

      battle.message=
        u.name+' の「'+c.skill+'」！';
    }

    else if(c.effect==='buffSelf'){
      u.permanentBuff+=power/100;

      showEffect(u,'強化','buff');

      battle.message=
        u.name+' の「'+c.skill+'」！';
    }
  }

  if(u.buffTurns>0){
    u.buffTurns--;

    if(u.buffTurns===0){
      u.buff=1;
    }
  }

  renderBattle();

  await sleep(850);
}

/* =====================================
   勝敗判定
===================================== */

function checkBattleEnd(){
  if(!battle?.running)return true;

  if(!alive(battle.enemies).length){
    finishBattle(true);
    return true;
  }

  if(!alive(battle.allies).length){
    finishBattle(false);
    return true;
  }

  return false;
}

/* =====================================
   キャラクタードロップ
===================================== */

function createStageDrop(stage){
  const candidates=[
    ...new Set(
      STAGE_ENEMIES[stage].map(x=>x[0])
    )
  ];

  const successful=[];

  for(const id of candidates){
    const c=byId(id);

    if(
      c
      &&Math.random()*100<DROP_RATES[c.rarity]
    ){
      successful.push(id);
    }
  }

  if(!successful.length)return null;

  const id=random(successful);

  return {
    id,
    name:byId(id).name,
    message:addCharacter(id)
  };
}

/* =====================================
   ステージ報酬
===================================== */

function grantStageRewards(stage){
  const count=
    Number(state.stageClearCounts[stage])||0;

  const firstClear=count===0;

  const gold=Math.floor(
    STAGE_GOLD[stage]*Math.pow(.8,count)
  );

  state.gold+=gold;

  let gems=0;

  if(firstClear&&Math.random()<.2){
    gems=50;
    state.gems+=gems;
  }

  let ringReward=null;

  if(stage===20&&firstClear){
    state.ringInventory.power=
      (Number(state.ringInventory.power)||0)+1;

    ringReward='power';
  }

  const drop=createStageDrop(stage);

  state.stageClearCounts[stage]=count+1;

  state.clearedStage=Math.max(
    state.clearedStage,stage
  );

  state.stage=Math.min(
    MAX_STAGE,
    state.clearedStage+1
  );

  save();

  return {
    firstClear,
    gold,
    gems,
    ringReward,
    drop
  };
}

/* =====================================
   戦闘終了
===================================== */

function finishBattle(victory){
  if(!battle?.running)return;

  battle.running=false;
  battle.busy=false;
  battle.awaitingAction=false;

  clearActing();

  battle.result={
    victory,
    rewards:victory
      ?grantStageRewards(battle.stage)
      :null
  };

  renderBattle();
}

function renderBattleResult(){
  const {victory,rewards}=battle.result;

  if(!victory){
    $('actionArea').innerHTML=`
      <div class="result">
        <h2>敗北…</h2>
        <p>編成や装備を見直して再挑戦しよう。</p>

        <button data-action="returnMap">
          草原マップへ戻る
        </button>
      </div>
    `;
    return;
  }

  let html=`
    <p>🪙 金貨 +${rewards.gold}</p>
  `;

  if(rewards.gems){
    html+=`
      <p>💎 ジェム +${rewards.gems}</p>
    `;
  }

  if(rewards.ringReward){
    html+=`
      <p>
        🟠 チカラの指輪 ×1<br>
        <span class="small">初回クリア確定報酬</span>
      </p>
    `;
  }

  if(rewards.drop){
    html+=`
      <p>
        🎁 キャラクタードロップ！<br>
        <b>${esc(rewards.drop.name)}</b><br>
        <span class="small">
          ${esc(rewards.drop.message)}
        </span>
      </p>
    `;
  }

  $('actionArea').innerHTML=`
    <div class="result">
      <h2>🎉 ステージクリア！</h2>

      <p>
        ステージ ${battle.stage} 勝利！
      </p>

      ${rewards.firstClear
        ?'<p>✨ 初回クリア！</p>'
        :''}

      ${html}

      <button data-action="returnMap">
        草原マップへ戻る
      </button>
    </div>
  `;
}

function returnMap(){
  if(battle){
    battle.running=false;
    battle.token=-1;
  }

  battle=null;

  selectedStage=Math.min(
    MAX_STAGE,
    Math.max(1,state.clearedStage+1)
  );

  showPage('battle');
}

/* =====================================
   デイリーボーナス・ルーレット
===================================== */

const DAILY_PRIZES=[
  {label:'🪙 100金貨',type:'gold',amount:100,rate:30},
  {label:'🪙 300金貨',type:'gold',amount:300,rate:25},
  {label:'🪙 500金貨',type:'gold',amount:500,rate:15},
  {label:'💎 50ジェム',type:'gems',amount:50,rate:15},
  {label:'💎 100ジェム',type:'gems',amount:100,rate:10},
  {label:'💎 300ジェム',type:'gems',amount:300,rate:5}
];

const DAILY_COLORS=[
  '#bf823c','#d4a84b','#8d6945',
  '#477bc2','#6e5cc1','#b35a9c'
];

function dailyDate(){
  return new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Tokyo',
    year:'numeric',
    month:'2-digit',
    day:'2-digit'
  }).format(new Date());
}

function readDaily(){
  try{
    return JSON.parse(
      localStorage.getItem(DAILY_KEY)
    )||{};
  }catch(e){
    return {};
  }
}

let dailyData=readDaily();
let dailySpinning=false;
let dailyRotation=0;

function saveDaily(){
  localStorage.setItem(
    DAILY_KEY,
    JSON.stringify(dailyData)
  );
}

function dailyAvailable(kind){
  return dailyData[kind]!==dailyDate();
}

function updateDailyStatus(){
  $('dailyStatus').textContent=
    'ボーナス：'+
    (dailyAvailable('bonus')?'受取可能':'受取済み')+
    ' ／ ルーレット：'+
    (dailyAvailable('wheel')?'挑戦可能':'挑戦済み');
}

function openDailyModal(){
  $('dailyModal').classList.add('active');
}

function closeDailyModal(){
  if(dailySpinning)return;

  $('dailyModal').classList.remove('active');
}

function showDailyBonus(){
  $('dailyContent').innerHTML=`
    <h2>🎁 ログインボーナス</h2>

    <p style="font-size:25px">
      💎 50ジェム
    </p>

    <p style="font-size:25px">
      🪙 200金貨
    </p>

    <button
      class="wide"
      data-action="dailyClaim"
      ${dailyAvailable('bonus')?'':'disabled'}>

      ${dailyAvailable('bonus')
        ?'受け取る'
        :'本日は受取済み'}
    </button>
  `;

  openDailyModal();
}

function claimDailyBonus(){
  if(!dailyAvailable('bonus'))return;

  dailyData.bonus=dailyDate();

  saveDaily();

  state.gems+=50;
  state.gold+=200;

  save();
  renderAll();
  updateDailyStatus();

  $('dailyContent').innerHTML=`
    <h2>🎉 受け取り完了！</h2>

    <p>💎 50ジェム</p>
    <p>🪙 200金貨</p>

    <p>明日もログインしよう！</p>
  `;
}

/* =====================================
   ルーレット
===================================== */

function wheelGradient(){
  return 'conic-gradient('+
    DAILY_COLORS.map((color,i)=>
      `${color} ${i*60}deg ${(i+1)*60}deg`
    ).join(',')+
    ')';
}

function showDailyWheel(){
  $('dailyContent').innerHTML=`
    <h2>🎰 ログインルーレット</h2>
    <p>毎日1回無料！</p>

    <div class="daily-wheel-wrap">
      <div class="daily-pointer">▼</div>

      <div
        id="dailyWheel"
        class="daily-wheel"
        style="background:${wheelGradient()}">
      </div>

      <div class="daily-center">✦</div>
    </div>

    <div id="dailyWheelResult">
      ${dailyAvailable('wheel')
        ?'本日の運試し！'
        :'本日は挑戦済み'}
    </div>

    <button
      class="wide"
      id="dailySpinButton"
      data-action="dailySpin"
      ${dailyAvailable('wheel')?'':'disabled'}>

      ${dailyAvailable('wheel')
        ?'無料で回す'
        :'本日は挑戦済み'}
    </button>

    <p class="small">
      100金貨30% / 300金貨25% / 500金貨15%<br>
      50ジェム15% / 100ジェム10% / 300ジェム5%
    </p>
  `;

  const wheel=$('dailyWheel');

  DAILY_PRIZES.forEach((prize,i)=>{
    const angle=(i*60+30)*Math.PI/180;

    const label=document.createElement('div');
    label.className='daily-wheel-label';
    label.textContent=prize.label;

    label.style.left=
      (50+32*Math.sin(angle))+'%';

    label.style.top=
      (50-32*Math.cos(angle))+'%';

    label.style.transform=
      'translate(-50%,-50%)';

    wheel.appendChild(label);
  });

  dailyRotation=0;
  openDailyModal();
}

function chooseDailyPrize(){
  let r=Math.random()*100;

  for(let i=0;i<DAILY_PRIZES.length;i++){
    r-=DAILY_PRIZES[i].rate;

    if(r<0)return i;
  }

  return DAILY_PRIZES.length-1;
}

function spinDailyWheel(){
  if(dailySpinning||!dailyAvailable('wheel'))return;

  const index=chooseDailyPrize();
  const prize=DAILY_PRIZES[index];

  dailySpinning=true;

  dailyData.wheel=dailyDate();
  saveDaily();

  const button=$('dailySpinButton');

  button.disabled=true;
  $('dailyClose').disabled=true;
  $('dailyWheelResult').textContent='抽選中…';

  const target=
    (360-(index*60+30))%360;

  dailyRotation=360*6+target;

  const wheel=$('dailyWheel');

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      wheel.style.transform=
        `rotate(${dailyRotation}deg)`;
    });
  });

  setTimeout(()=>{
    state[prize.type]+=prize.amount;

    save();
    renderAll();
    updateDailyStatus();

    $('dailyWheelResult').innerHTML=`
      <h2>🎉 ${prize.label} 獲得！</h2>
    `;

    dailySpinning=false;
    $('dailyClose').disabled=false;
  },4700);
}

/* =====================================
   ボタン操作
===================================== */

document.addEventListener('click',event=>{
  const button=event.target.closest('button');

  if(!button||button.disabled)return;

  if(button.dataset.page){
    showPage(button.dataset.page);
    return;
  }

  const action=button.dataset.action;
  const id=button.dataset.id;
  const index=Number(button.dataset.index);

  switch(action){

    case 'summon':
      summon(Number(button.dataset.count));
      break;

    case 'nextSummon':
      summonIndex++;
      showSummon();
      break;

    case 'skipSummon':
      finishSummon();
      break;

    case 'toggleParty':
      toggleParty(id);
      break;

    case 'togglePartyFromDetail':
      toggleParty(id);
      openEncyclopedia(id);
      break;

    case 'openEncyclopedia':
      openEncyclopedia(id);
      break;

    case 'closeEncyclopedia':
      closeEncyclopedia();
      break;

    case 'dexRarity':
      changeDexRarity(button.dataset.rarity);
      break;

    case 'dexPage':
      changeDexPage(Number(button.dataset.direction));
      break;

    case 'openRing':
      openRing(id);
      break;

    case 'closeCharacterRingModal':
      $('characterRingModal').classList.remove('active');
      ringTarget=null;
      break;

    case 'openSlot':
      openSlot(id,index);
      break;

    case 'closeEquipmentModal':
      $('equipmentModal').classList.remove('active');
      slotTarget=null;
      if(ringTarget)renderRingModal();
      break;

    case 'equip':
      equip(id,index,button.dataset.type);
      break;

    case 'unequip':
      unequip(id,index);
      break;

    case 'selectStage':
      selectStage(Number(button.dataset.stage));
      break;

    case 'startBattle':
      startBattle();
      break;

    case 'battleAttack':
      allyAct(false);
      break;

    case 'battleSkill':
      allyAct(true);
      break;

    case 'returnMap':
      returnMap();
      break;

    case 'dailyBonusOpen':
      showDailyBonus();
      break;

    case 'dailyClaim':
      claimDailyBonus();
      break;

    case 'dailyWheelOpen':
      showDailyWheel();
      break;

    case 'dailySpin':
      spinDailyWheel();
      break;

    case 'dailyClose':
      closeDailyModal();
      break;
  }
});

/* =====================================
   エラー処理・初期表示
===================================== */

window.addEventListener('error',event=>{
  console.error(event.error||event.message);

  showError(
    'ゲーム内エラー：'+
    (event.message||'不明なエラー')
  );
});

renderAll();
updateDailyStatus();

/* 未受取ならログインボーナスを表示 */
if(dailyAvailable('bonus')){
  showDailyBonus();
}

</script>
</body>
</html>
