<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星詠みの旅団</title>

<style>
:root{
--bg:#101525;
--panel:#1b2540;
--panel2:#263453;
--gold:#f4c76b;
--text:#f4f5fb;
--muted:#aab4ca;
--line:#394866;
--red:#e87979;
--green:#76d6a1;
}

*{box-sizing:border-box}

body{
margin:0;
background:radial-gradient(ellipse at top,#202d4c 0,#101525 55%);
color:var(--text);
font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
min-height:100vh;
}

button{
font:inherit;
color:inherit;
border:1px solid #62708e;
background:linear-gradient(180deg,#354666,#263453);
border-radius:12px;
padding:11px 14px;
cursor:pointer;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

.wrap{
max-width:900px;
margin:auto;
padding:14px;
}

.top{
display:flex;
justify-content:space-between;
gap:12px;
align-items:center;
flex-wrap:wrap;
padding:12px 4px;
}

.brand{
font-weight:900;
color:var(--gold);
font-size:22px;
}

.resources{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.pill{
background:#202c46;
border:1px solid var(--line);
padding:7px 11px;
border-radius:999px;
font-size:14px;
}

.nav{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin:8px 0 16px;
}

.nav button{min-height:48px}

.page{display:none}
.page.active{display:block}

.panel{
background:linear-gradient(145deg,#1d2945,#172139);
border:1px solid var(--line);
border-radius:18px;
padding:16px;
margin-bottom:14px;
box-shadow:0 8px 24px #0003;
}

.hero{
text-align:center;
padding:28px 16px;
}

.hero h1{
color:var(--gold);
font-size:28px;
margin:0 0 8px;
}

.muted{color:var(--muted)}

.section-title{
font-size:20px;
color:var(--gold);
margin:0 0 12px;
}

.row{
display:flex;
gap:9px;
align-items:center;
flex-wrap:wrap;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
gap:10px;
}

.card{
background:#202d49;
border:1px solid var(--line);
border-radius:14px;
padding:11px;
min-width:0;
}

.card.selected{
border:2px solid var(--gold);
padding:10px;
}

.portrait{
height:100px;
display:flex;
align-items:center;
justify-content:center;
font-size:52px;
margin-bottom:6px;
}

.portrait img{
max-height:100%;
max-width:100%;
object-fit:contain;
}

.name{font-weight:800}
.small{font-size:12px;color:var(--muted)}
.stats{font-size:13px;line-height:1.7;margin:6px 0}
.normal{color:#cbd5e1}
.rare{color:#74b8ff}
.epic{color:#d9a0ff}
.wide{width:100%}
.result{line-height:1.8;min-height:40px;margin-top:12px}

.bar{
height:9px;
background:#101827;
border-radius:9px;
overflow:hidden;
margin:5px 0;
}

.bar>i{
display:block;
height:100%;
background:linear-gradient(90deg,#5aa5ff,#9e8cff);
}

.error{
display:none;
background:#542d36;
border:1px solid #b65d6a;
padding:10px;
border-radius:10px;
margin:8px 0;
white-space:pre-wrap;
}

.footer{
text-align:center;
color:var(--muted);
font-size:12px;
padding:14px;
}

/* =========================
   戦闘画面
========================= */

.battle-screen{
display:flex;
flex-direction:column;
gap:14px;
}

.battle-side-title{
font-size:18px;
font-weight:900;
margin-bottom:10px;
}

.enemy-title{color:#ff9999}
.ally-title{color:#8bc8ff}

.battle-side{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(125px,1fr));
gap:10px;
}

.battle-character{
position:relative;
background:linear-gradient(145deg,#263653,#18243b);
border:1px solid var(--line);
border-radius:15px;
padding:10px;
text-align:center;
min-width:0;
overflow:hidden;
}

.battle-character.enemy{
background:linear-gradient(145deg,#49303b,#2a2031);
border-color:#79505d;
}

.battle-character.ally{
background:linear-gradient(145deg,#263b5b,#192640);
border-color:#526f9b;
}

.battle-character.dead{
opacity:.35;
filter:grayscale(1);
}

.battle-image{
height:125px;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:5px;
}

.battle-image img{
width:100%;
height:100%;
object-fit:contain;
}

.battle-name{
font-weight:900;
font-size:15px;
margin-bottom:5px;
}

.battle-hp-text{
font-size:12px;
color:var(--muted);
}

.hpbar{
height:9px;
background:#101827;
border-radius:10px;
overflow:hidden;
margin:5px 0;
}

.hpbar i{
display:block;
height:100%;
background:linear-gradient(90deg,#42c77e,#8de5a9);
transition:width .3s;
}

.gaugebar{
height:6px;
background:#101827;
border-radius:10px;
overflow:hidden;
margin:6px 0;
}

.gaugebar i{
display:block;
height:100%;
background:linear-gradient(90deg,#579dff,#c09aff);
transition:width .3s;
}

.battle-divider{
text-align:center;
color:var(--gold);
font-size:20px;
font-weight:900;
padding:2px;
}

.action-panel{
background:linear-gradient(145deg,#202e4b,#151f34);
border:1px solid #536486;
border-radius:16px;
padding:14px;
}

.action-title{
font-size:17px;
font-weight:900;
color:var(--gold);
margin-bottom:10px;
}

.action-character{
background:#263653;
border:1px solid #536486;
border-radius:12px;
padding:12px;
margin-bottom:8px;
}

.action-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-top:10px;
}

.action-buttons button{
min-height:50px;
}

.attack-button{
background:linear-gradient(180deg,#a34d59,#713443);
border-color:#d17a87;
}

.skill-button{
background:linear-gradient(180deg,#6950a8,#45336e);
border-color:#a58ad8;
}

.enemy-preview{
background:linear-gradient(145deg,#633b48,#342536);
border:2px solid #bd687b;
border-radius:14px;
padding:14px;
animation:previewIn .25s ease-out;
}

.preview-title{
color:#ffb1b1;
font-weight:900;
font-size:17px;
margin-bottom:8px;
}

.preview-detail{
font-size:15px;
line-height:1.9;
}

.preview-wait{
color:#ffd0d0;
font-size:12px;
margin-top:7px;
}

@keyframes previewIn{
from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:translateY(0)}
}

.battle-effect{
font-size:13px;
font-weight:900;
color:#ffe08a;
margin-top:5px;
animation:effectIn .7s ease-out;
}

@keyframes effectIn{
0%{opacity:0;transform:translateY(8px)}
20%{opacity:1;transform:translateY(0)}
100%{opacity:0;transform:translateY(-8px)}
}

.battle-result{
text-align:center;
padding:18px;
background:#202d49;
border:1px solid var(--gold);
border-radius:14px;
}

.battle-result h3{
color:var(--gold);
font-size:23px;
margin:0 0 12px;
}

@media(max-width:520px){
.wrap{padding:10px}
.nav{grid-template-columns:repeat(2,1fr)}
.hero h1{font-size:24px}
.panel{padding:13px}
.battle-image{height:105px}
.battle-side{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>
<div class="wrap">

<header class="top">
<div class="brand">✦ 星詠みの旅団</div>
<div class="resources">
<span class="pill">💎 <b id="gems">0</b></span>
<span class="pill">🪙 <b id="gold">0</b></span>
<span class="pill">到達ステージ <b id="stage">1</b></span>
</div>
</header>

<div id="errorBox" class="error"></div>

<nav class="nav">
<button data-page="home">ホーム</button>
<button data-page="gacha">ガチャ</button>
<button data-page="team">編成・図鑑</button>
<button data-page="battle">戦闘</button>
<button data-page="shop">ショップ</button>
</nav>

<main>

<section id="home" class="page active">
<div class="panel hero">
<h1>星の導きが、旅の始まり</h1>
<p class="muted">仲間を集め、育て、未知の敵に挑もう。</p>
<div class="row" style="justify-content:center">
<button data-page="gacha">仲間を召喚する</button>
<button data-page="team">編成を確認する</button>
<button data-page="battle">冒険に出る</button>
</div>
</div>

<div class="panel">
<h2 class="section-title">旅団の状況</h2>
<div id="homeSummary"></div>
</div>
</section>

<section id="gacha" class="page">
<div class="panel">
<h2 class="section-title">星詠み召喚</h2>
<p>ノーマル 70% / レア 25% / エピック 5%</p>
<div class="row">
<button data-action="summon" data-count="1">1回召喚（💎100）</button>
<button data-action="summon" data-count="10">10回召喚（💎900）</button>
</div>
<div id="gachaResult" class="result muted">召喚結果がここに表示されます。</div>
</div>

<div class="panel">
<h2 class="section-title">所持状況</h2>
<div id="gachaOwned" class="small"></div>
</div>
</section>

<section id="team" class="page">
<div class="panel">
<h2 class="section-title">パーティ編成</h2>
<p class="muted">所持キャラクターを選択して最大3人まで編成できます。</p>
<div id="partyView" class="grid"></div>
</div>

<div class="panel">
<h2 class="section-title">キャラクター図鑑</h2>
<div id="characterList" class="grid"></div>
</div>
</section>

<section id="shop" class="page">
<div class="panel">
<h2 class="section-title">ショップ</h2>
<p>ショップは準備中です。</p>
</div>
</section>

<section id="battle" class="page">

<div class="panel">
<h2 class="section-title">冒険・戦闘</h2>
<div id="battleIntro"></div>
<div class="row" style="margin-top:12px">
<button data-action="startBattle">戦闘開始</button>
</div>
</div>

<div id="battleArea" class="panel" style="display:none">
<div class="battle-screen">

<div>
<div class="battle-side-title enemy-title">▼ 敵軍</div>
<div id="enemyUnits" class="battle-side"></div>
</div>

<div class="battle-divider">VS</div>

<div>
<div class="battle-side-title ally-title">▲ 旅団</div>
<div id="allyUnits" class="battle-side"></div>
</div>

<div id="actionArea" class="action-panel">
<div class="muted">戦闘準備中...</div>
</div>

</div>
</div>

</section>

</main>

<div class="footer">星詠みの旅団</div>
</div>

<script>
'use strict';

const KEY='hoshiyomi_save_v2';

const CHARACTERS=[
{id:'swordman',imageFile:'Swordman.png',name:'剣士',rarity:'ノーマル',hp:100,atk:20,speed:20,charge:3,skill:'強撃',effect:'damage',power:50,target:'one',growth:.07,max:20},
{id:'archer',imageFile:'Archer.png',name:'アーチャー',rarity:'ノーマル',hp:70,atk:10,speed:16,charge:2,skill:'乱射',effect:'damage',power:10,target:'all',growth:.07,max:20},
{id:'axeman',imageFile:'Axeman.png',name:'アックスマン',rarity:'ノーマル',hp:130,atk:30,speed:9,charge:4,skill:'叩き割り',effect:'damage',power:70,target:'one',growth:.06,max:20},
{id:'spearman',imageFile:'Spearman.png',name:'スピアマン',rarity:'ノーマル',hp:100,atk:10,speed:20,charge:6,skill:'致命突き',effect:'damage',power:150,target:'one',growth:.07,max:20},
{id:'goblin',imageFile:'Goblin.png',name:'ゴブリン',rarity:'ノーマル',hp:70,atk:20,speed:25,charge:5,skill:'回避',effect:'evade',power:80,target:'self',growth:.08,max:20},
{id:'miner',imageFile:'Miner.png',name:'鉱夫',rarity:'ノーマル',hp:140,atk:10,speed:14,charge:3,skill:'ガード',effect:'guard',power:70,target:'self',growth:.07,max:20},
{id:'zombie',imageFile:'Zombie.png',name:'ゾンビ',rarity:'ノーマル',hp:50,atk:50,speed:12,charge:3,skill:'噛みつき',effect:'poison',power:50,target:'one',growth:.07,max:20},
{id:'farmer',imageFile:'Farmer.png',name:'農夫',rarity:'ノーマル',hp:110,atk:20,speed:15,charge:3,skill:'ランダム回復',effect:'heal',power:20,target:'ally',growth:.07,max:20},

{id:'魔導士',imageFile:'魔導士.png',name:'魔導士',rarity:'レア',hp:100,atk:30,speed:21,charge:0,skill:'力の魔術',effect:'buffAlly',power:50,target:'ally',growth:.16,max:10},
{id:'将軍',imageFile:'将軍.png',name:'将軍',rarity:'レア',hp:150,atk:40,speed:23,charge:2,skill:'薙ぎ払い',effect:'damage',power:30,target:'all',growth:.16,max:10},
{id:'ゴーレム',imageFile:'ゴーレム.png',name:'ゴーレム',rarity:'レア',hp:210,atk:40,speed:7,charge:8,skill:'大地砕き',effect:'damage',power:100,target:'all',growth:.16,max:10},
{id:'ドワーフ',imageFile:'ドワーフ.png',name:'ドワーフ',rarity:'レア',hp:170,atk:30,speed:15,charge:5,skill:'職人の心得',effect:'buffSelf',power:25,target:'self',growth:.16,max:10},
{id:'エルフ',imageFile:'エルフ.png',name:'エルフ',rarity:'レア',hp:100,atk:10,speed:24,charge:1,skill:'癒しのオーラ',effect:'healPercent',power:15,target:'ally',growth:.16,max:10},
{id:'アサシン',imageFile:'アサシン.png',name:'アサシン',rarity:'レア',hp:70,atk:70,speed:29,charge:2,skill:'回避',effect:'evadeSure',power:100,target:'self',growth:.16,max:10},

{id:'鍛錬剣士',imageFile:'鍛錬剣士.png',name:'果てしなき鍛錬剣士',rarity:'エピック',hp:200,atk:40,speed:22,charge:2,skill:'乱舞',effect:'damage',power:40,target:'all',growth:.30,max:6,passive:'アルティメットカウンター'},
{id:'狙撃手アーチャー',imageFile:'狙撃手アーチャー.png',name:'戦場の狙撃手アーチャー',rarity:'エピック',hp:160,atk:80,speed:19,charge:4,skill:'正射必中',effect:'damage',power:160,target:'one',growth:.30,max:6,passive:'アタックセレクト'},
{id:'一閃スピアドン',imageFile:'一閃スピアドン.png',name:'紫電一閃スピアドン',rarity:'エピック',hp:200,atk:30,speed:24,charge:5,skill:'致命のひと突き',effect:'damage',power:300,target:'one',growth:.30,max:6,passive:'ウィルパワー'}
];

const byId=id=>CHARACTERS.find(c=>c.id===id);

function fresh(){
return {
gems:500,
gold:300,
stage:1,
owned:{
swordman:{level:1,dupes:0},
archer:{level:1,dupes:0},
spearman:{level:1,dupes:0}
},
party:['swordman','archer','spearman']
};
}

function loadState(){
let raw=null;
try{raw=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}

const d=fresh();
if(!raw||typeof raw!=='object')return d;

const s={...d,...raw};
s.gems=Number.isFinite(+s.gems)?Math.max(0,+s.gems):d.gems;
s.gold=Number.isFinite(+s.gold)?Math.max(0,+s.gold):d.gold;
s.stage=Number.isFinite(+s.stage)?Math.max(1,+s.stage):1;

s.owned=raw.owned&&typeof raw.owned==='object'?raw.owned:{};

for(const [id,v] of Object.entries(s.owned)){
if(!byId(id)||!v||typeof v!=='object'){
delete s.owned[id];
continue;
}
v.level=Math.min(byId(id).max,Math.max(1,Number(v.level)||1));
v.dupes=Math.max(0,Number(v.dupes)||0);
}

for(const id of Object.keys(d.owned)){
if(!s.owned[id])s.owned[id]={...d.owned[id]};
}

s.party=Array.isArray(raw.party)
?raw.party.filter((id,i,a)=>byId(id)&&s.owned[id]&&a.indexOf(id)===i).slice(0,3)
:d.party.slice();

if(!s.party.length)s.party=d.party.filter(id=>s.owned[id]);

return s;
}

let state=loadState();
let battle=null;
let busy=false;
let enemyTimer=null;

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(state));
}catch(e){
showError('セーブを保存できませんでした。');
}
renderAll();
}

function showError(msg){
const el=document.getElementById('errorBox');
if(el){
el.textContent=msg;
el.style.display='block';
}
}

window.addEventListener('error',e=>{
showError('ゲーム内でエラーが発生しました: '+e.message);
});

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function imagePath(id){
const c=byId(id);
const file=c?.imageFile||id+'.png';
return './images/'+encodeURIComponent(file);
}

function portrait(id){
const c=byId(id);
return `<div class="portrait"><img src="${imagePath(id)}" alt="${esc(c?.name||id)}" onerror="this.style.display='none'"></div>`;
}

function stats(c,o){
const lv=o?.level||1;
const mul=Math.pow(1+c.growth,lv-1);
return {
hp:Math.round(c.hp*mul),
atk:Math.round(c.atk*mul),
power:Math.round(c.power*mul),
speed:c.speed
};
}

function rarityClass(r){
return r==='エピック'?'epic':r==='レア'?'rare':'normal';
}

function cardHTML(id,selectable=false){
const c=byId(id);
const o=state.owned[id];
if(!c)return '';

const st=stats(c,o);
const selected=state.party.includes(id);

return `
<article class="card ${selectable&&selected?'selected':''}">
${portrait(id)}
<div class="name">${esc(c.name)}</div>
<div class="small ${rarityClass(c.rarity)}">${c.rarity} / Lv.${o?.level||1}</div>
<div class="stats">
HP ${st.hp}　攻撃 ${st.atk}<br>
素早さ ${st.speed}<br>
スキル：${esc(c.skill)}
${c.passive?'<br>特性：'+esc(c.passive):''}
</div>
${selectable?`<button class="wide" data-action="toggleParty" data-id="${esc(id)}">${selected?'編成から外す':'編成に加える'}</button>`:''}
</article>`;
}

function renderAll(){
document.getElementById('gems').textContent=state.gems;
document.getElementById('gold').textContent=state.gold;
document.getElementById('stage').textContent=state.stage;

document.getElementById('homeSummary').innerHTML=
`所持キャラクター：${Object.keys(state.owned).length}体<br>
編成中：${state.party.map(id=>esc(byId(id)?.name||id)).join(' / ')||'なし'}<br>
次の冒険：ステージ ${state.stage}`;

document.getElementById('gachaOwned').textContent=
`${Object.keys(state.owned).length} / ${CHARACTERS.length}体を所持`;

document.getElementById('partyView').innerHTML=
state.party.map(id=>cardHTML(id)).join('')||
'<p class="muted">編成がありません。</p>';

document.getElementById('characterList').innerHTML=
CHARACTERS.map(c=>
state.owned[c.id]
?cardHTML(c.id,true)
:`<article class="card">
<div class="portrait">🔒</div>
<div class="name">？？？</div>
<div class="small">${c.rarity}</div>
<div class="stats">未獲得</div>
</article>`
).join('');

document.getElementById('battleIntro').innerHTML=
`現在のステージ：<b>${state.stage}</b><br>
<span class="muted">編成：${state.party.map(id=>esc(byId(id)?.name||id)).join(' / ')||'なし'}</span>`;
}

function showPage(name){
document.querySelectorAll('.page').forEach(p=>{
p.classList.toggle('active',p.id===name);
});
if(name==='battle')renderBattle();
window.scrollTo(0,0);
}

function summon(count){
const cost=count===10?900:100;

if(state.gems<cost){
document.getElementById('gachaResult').textContent='💎が足りません。';
return;
}

state.gems-=cost;
const results=[];

for(let i=0;i<count;i++){
const roll=Math.random()*100;

const pool=CHARACTERS.filter(c=>
roll<5
?c.rarity==='エピック'
:roll<30
?c.rarity==='レア'
:c.rarity==='ノーマル'
);

const c=pool[Math.floor(Math.random()*pool.length)];

if(!state.owned[c.id]){
state.owned[c.id]={level:1,dupes:0};
results.push(`<span class="${rarityClass(c.rarity)}">${esc(c.name)}（初獲得）</span>`);
}else{
const o=state.owned[c.id];
o.dupes=(o.dupes||0)+1;

if(o.level<c.max&&o.dupes>=o.level){
o.dupes=0;
o.level++;
results.push(`${esc(c.name)}：Lv.${o.level}に成長！`);
}else if(o.level>=c.max){
o.dupes=0;
state.gold+=50;
results.push(`${esc(c.name)}：最大Lvのため🪙50獲得`);
}else{
results.push(`${esc(c.name)}：重複 ${o.dupes}/${o.level}`);
}
}
}

document.getElementById('gachaResult').innerHTML=results.join('<br>');
save();
}

function toggleParty(id){
if(!state.owned[id])return;

const i=state.party.indexOf(id);

if(i>=0){
state.party.splice(i,1);
}else if(state.party.length<3){
state.party.push(id);
}else{
showError('編成できるのは3人までです。');
return;
}

save();
}

function makeUnit(id,side){
const c=byId(id);
const o=state.owned[id]||{level:1};
const st=stats(c,o);

return {
id,
side,
name:c.name,
hp:st.hp,
maxHp:st.hp,
atk:st.atk,
speed:st.speed,
gauge:0,
charge:c.charge,
skillGauge:0,
skillNeed:c.charge===0?0:c.charge*20,
actions:0,
skill:c.skill,
effect:c.effect,
power:st.power,
target:c.target,
passive:c.passive,
guard:false,
evade:0,
poison:0,
buff:1,
alive:true,
counter:false,
imageId:id,
effectText:''
};
}

function makeEnemy(i){
const names=['ウルフ','ゴースト','オーガ'];
const images=['goblin','zombie','ゴーレム'];
const hp=90+state.stage*22+i*35;

return {
id:'enemy'+i,
name:names[i],
imageId:images[i],
side:'enemy',
hp,
maxHp:hp,
atk:12+state.stage*3+i*5,
speed:12+i*3,
gauge:0,
alive:true,
guard:false,
evade:0,
poison:0,
buff:1,
effectText:''
};
}

function alive(arr){
return arr.filter(x=>x.alive&&x.hp>0);
}

function startBattle(){
if(busy)return;

if(enemyTimer){
clearTimeout(enemyTimer);
enemyTimer=null;
}

if(!state.party.length){
showError('先に編成を設定してください。');
return;
}

battle={
turn:0,
over:false,
readyActor:null,
pendingEnemy:null,
allies:state.party.map(id=>makeUnit(id,'ally')),
enemies:[
makeEnemy(0),
makeEnemy(1),
...(state.stage>=3?[makeEnemy(2)]:[])
]
};

busy=false;
showPage('battle');
advanceBattle();
}

function logEffect(unit,text){
unit.effectText=text;
}

function deal(attacker,target,amount){
if(!target||!target.alive)return 0;

if(target.evade>0){
target.evade=0;
logEffect(target,'MISS!');
return 0;
}

let dmg=Math.max(1,Math.round(amount));

if(target.guard){
dmg=Math.max(1,Math.round(dmg*.3));
target.guard=false;
}

target.hp=Math.max(0,target.hp-dmg);
logEffect(target,'-'+dmg);

if(target.hp<=0){
target.alive=false;
logEffect(target,'DOWN');
}

if(attacker&&attacker.side==='ally'&&dmg>0){
attacker.skillGauge=Math.min(
attacker.skillNeed||999999,
(attacker.skillGauge||0)+dmg
);
}

return dmg;
}

function chooseEnemy(){
return alive(battle.enemies).sort((a,b)=>a.hp-b.hp)[0];
}

function chooseAlly(){
return alive(battle.allies).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
}

function prepareEnemyAction(enemy){
const target=chooseAlly();
if(!target)return;

battle.pendingEnemy={
actorId:enemy.id,
targetId:target.id,
actorName:enemy.name,
targetName:target.name,
actionName:'通常攻撃'
};

busy=true;
renderBattle();

enemyTimer=setTimeout(()=>{
enemyTimer=null;

if(!battle||battle.over)return;

const pending=battle.pendingEnemy;
if(!pending){
busy=false;
return;
}

const actor=battle.enemies.find(x=>
x.id===pending.actorId&&x.alive
);

const victim=battle.allies.find(x=>
x.id===pending.targetId&&x.alive
);

battle.pendingEnemy=null;

if(actor&&victim){
enemyAct(actor,victim);
}

for(const e of alive(battle.enemies)){
if(e.poison>0){
e.hp=Math.max(0,e.hp-8);
e.poison--;
logEffect(e,'毒 -8');
if(e.hp===0)e.alive=false;
}
}

busy=false;

if(alive(battle.enemies).length===0){
finishBattle(true);
return;
}

if(alive(battle.allies).length===0){
finishBattle(false);
return;
}

renderBattle();
advanceBattle();

},600);
}

function performAlly(actor,useSkill){
if(useSkill){
if(actor.charge>0&&actor.skillGauge<actor.skillNeed)return;

actor.skillGauge=0;
actor.actions=0;
logEffect(actor,'SKILL!');

if(actor.effect==='damage'){
const targets=actor.target==='all'
?alive(battle.enemies)
:[chooseEnemy()];

targets.forEach(t=>{
if(t)deal(actor,t,actor.power);
});

}else if(actor.effect==='evade'||actor.effect==='evadeSure'){
actor.evade=1;
logEffect(actor,'回避態勢');

}else if(actor.effect==='guard'){
actor.guard=true;
logEffect(actor,'GUARD');

}else if(actor.effect==='poison'){
const t=chooseEnemy();
if(t){
deal(actor,t,actor.power);
t.poison=3;
}
}else if(actor.effect==='heal'||actor.effect==='healPercent'){
const allies=alive(battle.allies);

const t=actor.effect==='heal'
?allies[Math.floor(Math.random()*allies.length)]
:chooseAlly();

if(t){
const amount=actor.effect==='healPercent'
?Math.round(t.maxHp*actor.power/100)
:actor.power;

const actual=Math.min(t.maxHp-t.hp,amount);
t.hp=Math.min(t.maxHp,t.hp+amount);
logEffect(t,'+'+actual+' HP');
}
}else if(actor.effect==='buffSelf'){
actor.buff+=actor.power/100;
logEffect(actor,'攻撃力UP');
}else if(actor.effect==='buffAlly'){
const t=chooseAlly();
if(t){
t.buff+=actor.power/100;
logEffect(t,'攻撃力UP');
}
}

}else{
actor.actions++;
const t=chooseEnemy();

if(t){
deal(actor,t,actor.atk*actor.buff);
}
}

if(actor.passive==='ウィルパワー'){
actor.atk+=Math.max(1,Math.round(actor.atk*.1));
}

if(actor.passive==='アルティメットカウンター'){
actor.counter=true;
}
}

function enemyAct(e,target){
if(!target||!target.alive)return;

const dmg=deal(e,target,e.atk*e.buff);

if(target.counter&&Math.random()<.2){
const reflected=Math.round(dmg*2);
e.hp=Math.max(0,e.hp-reflected);
logEffect(e,'反射 -'+reflected);
if(e.hp===0)e.alive=false;
}
}

function advanceBattle(){
if(!battle||battle.over||busy)return;

let guard=0;

while(!battle.readyActor&&guard++<100){

if(alive(battle.enemies).length===0){
finishBattle(true);
return;
}

if(alive(battle.allies).length===0){
finishBattle(false);
return;
}

const units=[
...alive(battle.allies),
...alive(battle.enemies)
];

units.forEach(u=>u.gauge+=u.speed);

const ready=units
.filter(u=>u.gauge>=100)
.sort((a,b)=>
b.gauge-a.gauge||
(a.side===b.side?0:(a.side==='ally'?-1:1))
);

if(!ready.length)continue;

const actor=ready[0];
actor.gauge-=100;

if(actor.side==='ally'){
battle.readyActor=actor.id;
renderBattle();
return;
}

prepareEnemyAction(actor);
return;
}

renderBattle();
}

function playerAction(id,skill){
if(!battle||battle.over||busy||battle.readyActor!==id)return;

const actor=battle.allies.find(x=>x.id===id&&x.alive);
if(!actor)return;

if(skill&&actor.charge>0&&actor.skillGauge<actor.skillNeed)return;

busy=true;
performAlly(actor,skill);
battle.readyActor=null;

if(alive(battle.enemies).length===0){
busy=false;
finishBattle(true);
return;
}

if(alive(battle.allies).length===0){
busy=false;
finishBattle(false);
return;
}

busy=false;
renderBattle();
advanceBattle();
}

function finishBattle(win){
if(!battle||battle.over)return;

if(enemyTimer){
clearTimeout(enemyTimer);
enemyTimer=null;
}

battle.over=true;
battle.pendingEnemy=null;
busy=false;

if(win){
state.gold+=100;
state.gems+=40;
state.stage++;
}else{
}

save();
renderBattle();
}

function renderBattle(){
const area=document.getElementById('battleArea');

if(!battle){
area.style.display='none';
return;
}

area.style.display='block';

const unitHTML=u=>{
const isEnemy=u.side==='enemy';
const dead=!u.alive||u.hp<=0;
const image=imagePath(u.imageId);

return `
<div class="battle-character ${isEnemy?'enemy':'ally'} ${dead?'dead':''}">
<div class="battle-image">
<img src="${image}" alt="${esc(u.name)}" onerror="this.style.display='none'">
</div>

<div class="battle-name">${esc(u.name)}</div>

<div class="battle-hp-text">HP ${Math.max(0,u.hp)} / ${u.maxHp}</div>

<div class="hpbar">
<i style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></i>
</div>

${!isEnemy?`
<div class="small">素早さ ${u.speed}</div>
<div class="small">行動ゲージ</div>
<div class="gaugebar">
<i style="width:${Math.min(100,u.gauge)}%"></i>
</div>
<div class="small">
スキルゲージ ${u.skillGauge}/${u.skillNeed||'即時'}
</div>
<div class="gaugebar">
<i style="width:${u.skillNeed?Math.min(100,u.skillGauge/u.skillNeed*100):100}%"></i>
</div>
`:`
<div class="small">素早さ ${u.speed}</div>
<div class="gaugebar">
<i style="width:${Math.min(100,u.gauge)}%"></i>
</div>
`}

${u.effectText?`<div class="battle-effect">${esc(u.effectText)}</div>`:''}
</div>
`;
};

document.getElementById('allyUnits').innerHTML=
battle.allies.map(unitHTML).join('');

document.getElementById('enemyUnits').innerHTML=
battle.enemies.map(unitHTML).join('');

const active=battle.allies.find(a=>a.id===battle.readyActor);

let actionContent='';

if(battle.over){
const won=alive(battle.enemies).length===0;

actionContent=`
<div class="battle-result">
<h3>${won?'勝利！':'敗北……'}</h3>
<p>${won?'ステージクリア！報酬を獲得した。':'旅団は敗北した。編成を見直して再挑戦しよう。'}</p>
${won?'<p>🪙100　💎40を獲得！</p>':''}
<button data-action="startBattle">もう一度挑戦</button>
</div>
`;

}else if(battle.pendingEnemy){
const p=battle.pendingEnemy;

actionContent=`
<div class="enemy-preview">
<div class="preview-title">⚠ 敵の行動予告</div>
<div class="preview-detail">
<b>${esc(p.actorName)}</b> が行動する！<br>
行動内容：<b>${esc(p.actionName)}</b><br>
攻撃対象：<b>${esc(p.targetName)}</b>
</div>
<div class="preview-wait">敵が攻撃を準備している……</div>
</div>
`;

}else if(active){
const skillReady=
active.charge===0||
active.skillGauge>=active.skillNeed;

actionContent=`
<div class="action-title">⚔ ${esc(active.name)} の行動</div>

<div class="action-character">
<div class="name">${esc(active.name)}</div>
<div class="small">
通常攻撃：攻撃力 ${active.atk}<br>
スキル：${esc(active.skill)}
</div>

${active.charge>0?`
<div class="small">
スキルゲージ：${active.skillGauge}/${active.skillNeed}
</div>
<div class="gaugebar">
<i style="width:${Math.min(100,active.skillGauge/active.skillNeed*100)}%"></i>
</div>
`:`
<div class="small">スキルはいつでも使用可能</div>
`}
</div>

<div class="action-buttons">
<button class="attack-button" data-action="attack" data-id="${esc(active.id)}">
通常攻撃
</button>

<button class="skill-button" data-action="skill" data-id="${esc(active.id)}" ${!skillReady?'disabled':''}>
${esc(active.skill)}
${!skillReady?'（ゲージ不足）':''}
</button>
</div>
`;

}else{
actionContent='<div class="muted">次の行動順を計算中...</div>';
}

document.getElementById('actionArea').innerHTML=actionContent;

/* 演出は一度表示したら消す */
battle.allies.concat(battle.enemies).forEach(u=>{
u.effectText='';
});
}

function handleClick(e){
const page=e.target.closest('[data-page]');

if(page){
showPage(page.dataset.page);
return;
}

const b=e.target.closest('[data-action]');
if(!b||b.disabled)return;

const a=b.dataset.action;
const id=b.dataset.id;

if(a==='summon'){
summon(Number(b.dataset.count));
}else if(a==='toggleParty'){
toggleParty(id);
}else if(a==='startBattle'){
startBattle();
}else if(a==='attack'){
playerAction(id,false);
}else if(a==='skill'){
playerAction(id,true);
}
}

document.addEventListener('click',handleClick);

renderAll();
</script>
</body>
</html>
