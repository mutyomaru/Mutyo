
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星詠みの旅団</title>
<style>
:root{
  --bg:#101525;--panel:#1b2540;--gold:#f4c76b;
  --text:#f4f5fb;--muted:#aab4ca;--line:#394866;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--text);
  background:radial-gradient(ellipse at top,#202d4c,#101525 60%);
  font-family:system-ui,-apple-system,sans-serif;
}
button{
  font:inherit;color:inherit;border:1px solid #62708e;
  background:linear-gradient(#354666,#263453);
  border-radius:11px;padding:10px 13px;cursor:pointer;
}
button:disabled{opacity:.4}
.wrap{max-width:900px;margin:auto;padding:12px}
.row,.top{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.top{justify-content:space-between;padding:12px 0}
.brand,.section-title{color:var(--gold);font-weight:900}
.brand{font-size:22px}
.pill{background:#202c46;border:1px solid var(--line);padding:7px 10px;border-radius:30px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0 16px}
.page{display:none}.page.active{display:block}
.panel{
  background:linear-gradient(145deg,#1d2945,#172139);
  border:1px solid var(--line);border-radius:17px;
  padding:15px;margin-bottom:13px;
}
.hero{text-align:center;padding:25px}.hero h1{color:var(--gold)}
.section-title{font-size:20px;margin:0 0 12px}
.muted,.small{color:var(--muted)}.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}
.card{
  position:relative;background:#202d49;border:1px solid var(--line);
  border-radius:13px;padding:10px 10px 43px;
}
.card.selected{outline:2px solid var(--gold)}
.portrait{height:100px;display:flex;align-items:center;justify-content:center;font-size:48px}
.portrait img{max-width:100%;max-height:100%;object-fit:contain}
.name{font-weight:900}.stats{font-size:13px;line-height:1.7;margin:6px 0}
.normal{color:#cbd5e1}.rare{color:#74b8ff}.epic{color:#d9a0ff}
.wide{width:100%}
.plus{
  position:absolute;bottom:8px;right:8px;width:32px;height:32px;
  padding:0;border-radius:9px;color:#ffe5a0;border-color:#b99550;
  background:#58472d;font-size:23px;
}
.modal{
  display:none;position:fixed;inset:0;z-index:1000;
  background:#050914e8;align-items:center;justify-content:center;padding:14px;
}
.modal.active{display:flex}
.modal-box{
  width:100%;max-width:460px;max-height:88vh;overflow:auto;
  background:linear-gradient(#263653,#151f34);
  border:1px solid #7185a8;border-radius:18px;padding:16px;
}
.slots,.stock{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot{
  min-height:65px;background:#111b30;border:1px solid #465779;
  border-radius:10px;padding:8px;text-align:center;
}
.slot.empty{border-style:dashed}
.stock{grid-template-columns:repeat(3,1fr);margin:10px 0}
.stock>div{background:#111b30;border-radius:9px;padding:8px 3px;text-align:center;font-size:12px}
.choice{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin:8px 0}
.stage-map{
  padding:15px;border:2px solid #58794e;border-radius:18px;
  background:linear-gradient(145deg,#456c43,#31543b 55%,#426a40);
}
.map-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stage-node{
  min-height:83px;padding:7px 2px;background:linear-gradient(#e1e9b7,#a9c27b);
  color:#263b26;border:2px solid #b4c98b;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.stage-node .num{font-size:22px;font-weight:900}
.stage-node .small{color:inherit;font-size:10px}
.stage-node.completed{background:linear-gradient(#c5e9bb,#76b879)}
.stage-node.current{background:linear-gradient(#fff0a8,#e9b94e)}
.stage-node.boss{background:linear-gradient(#f1b2a3,#bd625b);color:#451e25}
.stage-node.locked{background:#788477;color:#344236}
.stage-node.selected{outline:3px solid white}
.stage-info{margin-top:14px;background:#203c2dcc;padding:12px;border-radius:11px;line-height:1.7}
.map-start{
  width:100%;margin-top:10px;background:linear-gradient(#e6c16a,#a77c32);
  color:#30230e;font-weight:900;
}
.battle-side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.unit{
  position:relative;min-width:0;background:#263653;border:1px solid #5476a4;
  border-radius:13px;text-align:center;padding:9px 5px;
}
.unit.enemy{background:#513541;border-color:#895767}
.unit.dead{opacity:.35;filter:grayscale(1)}
.unit.active{outline:3px solid #ffe17c;box-shadow:0 0 15px #f4c76b99}
.unit.enemy.active{outline-color:#ff8585}
.unit .portrait{height:130px}
.hpbar{
  height:9px;background:#101827;border-radius:10px;
  overflow:hidden;margin:6px 0;
}
.hpbar i{display:block;height:100%;background:#76d6a1}
/* 行動ゲージは表示しない */
.battle-divider{text-align:center;font-size:20px;color:var(--gold);font-weight:900;margin:12px}
.action-panel{
  margin-top:13px;background:#202e4b;border:1px solid #536486;
  border-radius:13px;padding:13px;
}
.action-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.action-buttons button{min-height:50px}
.attack{background:#853c49}.skill{background:#5b4694}
.enemy-preview{background:#633b48;border:2px solid #bd687b;padding:14px;border-radius:12px;line-height:1.8}
.result{text-align:center;line-height:1.8}.result h2{color:var(--gold)}
.effect{
  position:absolute;top:27%;left:0;width:100%;z-index:5;
  font-size:29px;font-weight:900;color:#ff8585;
  text-shadow:0 2px 5px black;pointer-events:none;
  animation:effectPop .85s ease-out forwards;
}
.effect.heal{color:#86f3ad}
.effect.buff{color:#ffe17c}
@keyframes effectPop{
  0%{transform:translateY(15px) scale(.6);opacity:0}
  25%{transform:translateY(-4px) scale(1.2);opacity:1}
  65%{opacity:1}
  100%{transform:translateY(-38px) scale(1);opacity:0}
}
.unit.hit{animation:hitShake .35s ease}
@keyframes hitShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-3px)}
}
.error{display:none;background:#542d36;border:1px solid #b65d6a;padding:10px;border-radius:10px;margin-bottom:10px}
.summon{
  display:none;position:fixed;inset:0;z-index:1100;
  background:radial-gradient(ellipse,#26345b,#080c18);
  align-items:center;justify-content:center;padding:15px;
}
.summon.active{display:flex}
.summon-box{text-align:center;max-width:520px;width:100%}
.magic{
  position:relative;margin:15px auto;width:230px;height:230px;
  border-radius:50%;border:3px solid #7ecbff;
  box-shadow:0 0 20px #398cff,inset 0 0 30px #398cff;
  display:flex;align-items:center;justify-content:center;
  animation:rotate 6s linear infinite;
}
.magic img{
  position:relative;z-index:1;width:160px;height:160px;
  object-fit:contain;animation:counterrotate 6s linear infinite;
}
.summon.epic-mode .magic{border-color:#ffe08b;box-shadow:0 0 28px #ffc34b,0 0 42px #d58aff}
.summon-name{font-size:23px;font-weight:900;color:var(--gold)}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes counterrotate{to{transform:rotate(-360deg)}}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}
@media(max-width:600px){
  .nav{grid-template-columns:repeat(2,1fr)}
  .battle-side{grid-template-columns:repeat(2,minmax(0,1fr))}
  .unit .portrait{height:115px}
  .map-grid{gap:7px}.stage-node{min-height:78px}.wrap{padding:9px}
}
  
/* ===== スマホ画面最適化 ===== */
@media (max-width:600px) {
  html,body {
    width:100%;
    min-height:100%;
    margin:0;
    overflow-x:hidden;
  }
  .wrap {
    width:100%;
    max-width:100%;
    padding:5px 7px;
  }
  .top {
    padding:3px 0;
    gap:4px;
  }
  .brand {font-size:15px}
  .top .row {gap:4px}
  .pill {
    padding:3px 6px;
    font-size:11px;
  }
  .nav {
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:3px;
    margin:5px 0 7px;
  }
  .nav button {
    padding:9px 1px;
    font-size:10px;
    border-radius:7px;
  }
  .panel {
    padding:8px;
    margin-bottom:6px;
    border-radius:10px;
  }
  .section-title {
    font-size:15px;
    margin-bottom:5px;
  }
  .panel p {margin:5px 0}
  .hero {padding:10px 6px}
  .hero h1 {
    font-size:19px;
    margin:5px 0;
  }
  button {padding:7px 8px}
  .grid {
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px;
  }
  .card {
    min-width:0;
    padding:5px 4px 30px;
    border-radius:8px;
  }
  .card .portrait {height:55px}
  .card .name {
    font-size:11px;
    overflow-wrap:anywhere;
  }
  .card .stats {
    font-size:10px;
    line-height:1.4;
  }
  .plus {
    width:25px;
    height:25px;
    font-size:18px;
    bottom:3px;
    right:3px;
  }

  /* 戦闘画面 */
  #battleFight .panel {
    padding:6px;
  }
  #battleFight .battle-side {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px;
  }
  #battleFight .unit {
    padding:4px 2px;
    border-radius:8px;
  }
  #battleFight .unit .portrait {
    height:clamp(45px,12vh,85px);
  }
  #battleFight .unit .name {
    font-size:10px;
    overflow-wrap:anywhere;
  }
  #battleFight .unit .small {
    font-size:10px;
  }
  #battleFight h3 {
    font-size:12px;
    margin:5px 0;
  }
  .hpbar {
    height:6px;
    margin:3px 0;
  }
  .battle-divider {
    margin:4px;
    font-size:14px;
  }
  .action-panel {
    margin-top:6px;
    padding:7px;
  }
  .action-buttons {
    gap:5px;
    margin-top:5px;
  }
  .action-buttons button {
    min-height:38px;
    padding:5px;
    font-size:12px;
  }
  .effect {font-size:21px}

  /* ステージ選択 */
  .stage-map {padding:7px}
  .map-grid {gap:4px}
  .stage-node {
    min-height:48px;
    padding:3px 1px;
  }
  .stage-node .num {font-size:15px}
  .stage-node .small {font-size:9px}
  .stage-info {
    padding:6px;
    margin-top:6px;
    font-size:12px;
  }
  .map-start {margin-top:5px}
  .footer {display:none}

  /* ポップアップ */
  .modal {padding:7px}
  .modal-box {
    max-height:90dvh;
    padding:10px;
  }
}

/* ===== 図鑑のレア度・ページ表示 ===== */
.dex-tabs {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
  margin-bottom:8px;
}

.dex-tabs button {
  padding:8px 2px;
  font-size:12px;
}

.dex-tabs button.selected {
  border:2px solid #f4c76b;
  background:#354666;
  color:#f4c76b;
}

.dex-pages {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.dex-pages span {
  font-weight:bold;
  color:#f4c76b;
}

@media(max-width:600px) {
  #characterList {
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
    gap:5px !important;
  }

  #characterList .card {
    min-width:0;
    padding:4px 3px 29px;
  }

  #characterList .portrait {
    height:65px !important;
  }

  #characterList .name {
    font-size:10px;
    line-height:1.3;
  }

  #characterList .small {
    font-size:9px;
  }

  #characterList .plus {
    width:23px;
    height:23px;
    right:4px;
    bottom:4px;
    font-size:17px;
  }
}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">✦ 星詠みの旅団</div>
    <div class="row">
      <span class="pill">💎 <b id="gems">0</b></span>
      <span class="pill">🪙 <b id="gold">0</b></span>
      <span class="pill">到達 <b id="stage">1</b></span>
    </div>
  </header>
  <div id="errorBox" class="error"></div>
  <nav class="nav">
    <button data-page="home">ホーム</button>
    <button data-page="gacha">ガチャ</button>
    <button data-page="team">編成・図鑑</button>
    <button data-page="battle">戦闘</button>
    <button data-page="shop">ショップ</button>
  </nav>
  <main>
    <section id="home" class="page active">
      <div class="panel hero">
        <h1>星の導きが、旅の始まり</h1>
        <p class="muted">仲間を集め、育て、未知の敵に挑もう。</p>
        <div class="row" style="justify-content:center">
          <button data-page="gacha">仲間を召喚する</button>
          <button data-page="team">編成を確認する</button>
          <button data-page="battle">冒険に出る</button>
        </div>
      </div>
      <div class="panel">
        <h2 class="section-title">旅団の状況</h2>
        <div id="homeSummary"></div>
      </div>
    </section>
    <section id="gacha" class="page">
      <div class="panel">
        <h2 class="section-title">星詠み召喚</h2>
        <p>ノーマル 70% / レア 25% / エピック 5%</p>
        <div class="row">
          <button data-action="summon" data-count="1">1回召喚（💎100）</button>
          <button data-action="summon" data-count="10">10回召喚（💎900）</button>
        </div>
        <div id="gachaResult" style="margin-top:12px">召喚結果が表示されます。</div>
      </div>
      <div class="panel">
        <h2 class="section-title">所持状況</h2>
        <div id="gachaOwned"></div>
      </div>
    </section>
    <section id="team" class="page">
      <div class="panel">
        <h2 class="section-title">パーティ編成</h2>
        <p class="muted">最大3体まで編成できます。</p>
        <div id="partyView" class="grid"></div>
      </div>
      <div class="panel">
        <h2 class="section-title">キャラクター図鑑</h2>
        <p class="muted">右下の「＋」から指輪を装備できます。</p>
        <div id="characterList" class="grid"></div>
      </div>
    </section>
    <section id="shop" class="page">
      <div class="panel">
        <h2 class="section-title">ショップ</h2>
        <p>ショップは準備中です。</p>
      </div>
    </section>
    <section id="battle" class="page">
      <div class="panel">
        <h2 class="section-title">草原マップ</h2>
        <p class="muted">クリア済みのステージにも再挑戦できます。</p>
        <div id="stageMap"></div>
      </div>
      <div class="panel">
        <h2 class="section-title">冒険準備</h2>
        <div id="battleIntro"></div>
        <button id="startBattleButton" class="map-start" data-action="startBattle">挑戦する</button>
      </div>
    </section>
    <section id="battleFight" class="page">
      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <h2 class="section-title">戦闘</h2>
          <button data-action="returnMap">ステージ選択に戻る</button>
        </div>
        <h3 style="color:#ffaaaa">▼ 敵軍 <span id="bossLabel"></span></h3>
        <div id="enemyUnits" class="battle-side"></div>
        <div class="battle-divider">✦ VS ✦</div>
        <h3 style="color:#9acbff">▲ 旅団</h3>
        <div id="allyUnits" class="battle-side"></div>
        <div id="actionArea" class="action-panel"></div>
      </div>
    </section>
  </main>
  <div class="footer">星詠みの旅団</div>
</div>
<div id="characterRingModal" class="modal">
  <div class="modal-box">
    <h2 class="section-title">アクセサリー一覧</h2>
    <div id="characterRingContent"></div>
    <button class="wide" data-action="closeCharacterRingModal">図鑑に戻る</button>
  </div>
</div>
<div id="equipmentModal" class="modal">
  <div class="modal-box">
    <h2 class="section-title">指輪を選択</h2>
    <div id="equipmentModalCharacter" class="small"></div>
    <div id="equipmentModalChoices"></div>
    <button class="wide" data-action="closeEquipmentModal">戻る</button>
  </div>
</div>
<div id="summonOverlay" class="summon">
  <div class="summon-box">
    <h2 class="section-title">星詠み召喚</h2>
    <div id="summonVisual"></div>
    <div id="summonProgress" class="small"></div>
    <div id="summonControls"></div>
  </div>
</div>
<script>

const BOSS_STAGES=[10,20];

  {id:'ゴーレム',imageFile:'ゴーレム.png',name:'ゴーレム',rarity:'レア',

function fresh(){
  return {
    gems:500,gold:300,stage:1,clearedStage:0,
    stageClearCounts:{},
    owned:{
      swordman:{level:1,dupes:0},
      archer:{level:1,dupes:0},
      spearman:{level:1,dupes:0}
    },
    party:['swordman','archer','spearman'],
    ringInventory:{power:0,heart:0,skill:0},
    equipment:{}
  };
}
function loadState(){
  let saved;
  try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!saved||typeof saved!=='object')return fresh();
  const s={...fresh(),...saved};
  s.owned=saved.owned||fresh().owned;
  s.party=Array.isArray(saved.party)?saved.party.filter(id=>s.owned[id]&&byId(id)).slice(0,3):fresh().party;
  s.stageClearCounts=saved.stageClearCounts||{};
  s.ringInventory={power:0,heart:0,skill:0,...saved.ringInventory};
  s.equipment=saved.equipment||{};
  s.gems=Math.max(0,Number(s.gems)||0);
  s.gold=Math.max(0,Number(s.gold)||0);
  s.clearedStage=Math.min(20,Math.max(0,Number(s.clearedStage)||0));
  s.stage=Math.min(20,Math.max(1,Number(s.stage)||1));
  for(const id of Object.keys(s.owned)){
    const c=byId(id);
    if(!c){delete s.owned[id];continue}
    const o=s.owned[id];
    if(!o||typeof o!=='object')s.owned[id]={level:1,dupes:0};
    else{
      o.level=Math.min(c.max,Math.max(1,Number(o.level)||1));
      o.dupes=Math.max(0,Number(o.dupes)||0);
    }
  }
  return s;
}

const fileName = c.imageFile;

  /[ガ-ゴザ-ゾダ-ドバ-ボパ-ポヴが-ござ-ぞだ-どば-ぼぱ-ぽ]/.test(fileName)

function rarityClass(r){
  return r==='エピック'?'epic':r==='レア'?'rare':'normal';
}
function getLevelMultiplier(id){
  const c=byId(id);
  return Math.pow(1+c.growth,(state.owned[id]?.level||1)-1);
}
function getEquipped(id,type){
  return (state.equipment[id]||[]).filter(x=>x===type).length;
}
function getRingAvailable(type){
  let used=0;
  for(const a of Object.values(state.equipment)){
    if(Array.isArray(a))used+=a.filter(x=>x===type).length;
  }
  return Math.max(0,(Number(state.ringInventory[type])||0)-used);
}
function getStats(id){
  const c=byId(id),m=getLevelMultiplier(id);
  return {
    hp:Math.floor(c.hp*m*(1+.1*getEquipped(id,'heart'))),
    atk:Math.floor(c.atk*m*(1+.1*getEquipped(id,'power'))),
    speed:c.speed,
    skillMultiplier:1+.1*getEquipped(id,'skill')
  };
}

function addCharacter(id){
  const c=byId(id);
  if(!c)return '';
  if(!state.owned[id]){
    state.owned[id]={level:1,dupes:0};
    return '新しい仲間を獲得！';
  }
  const o=state.owned[id];
  o.dupes=(o.dupes||0)+1;
  while(o.level<c.max&&o.dupes>=o.level){
    o.dupes-=o.level;
    o.level++;
  }
  return '重複獲得！ Lv.'+o.level;
}
function drawCharacter(){
  const r=Math.random();
  const rarity=r<.7?'ノーマル':r<.95?'レア':'エピック';

}
function summon(count){
  const cost=count===10?900:100;
  if(state.gems<cost){showError('ジェムが足りません');return}
  state.gems-=cost;
  summonQueue=[];
  for(let i=0;i<count;i++){
    const c=drawCharacter();
    summonQueue.push({c,message:addCharacter(c.id)});
  }
  save();renderAll();
  summonIndex=0;
  $('summonOverlay').classList.add('active');
  showSummon();
}
function showSummon(){
  const item=summonQueue[summonIndex];
  if(!item){finishSummon();return}
  const c=item.c;
  $('summonOverlay').classList.toggle('epic-mode',c.rarity==='エピック');
  $('summonVisual').innerHTML=`
    <div class="magic"><img src="images/${encodeURIComponent(c.imageFile)}" alt="${esc(c.name)}"></div>
    <div class="summon-name">${esc(c.name)}</div>
    <p class="${rarityClass(c.rarity)}">${c.rarity}</p>
    <p>${esc(item.message)}</p>`;
  $('summonProgress').textContent=(summonIndex+1)+' / '+summonQueue.length;
  $('summonControls').innerHTML=`

    <button data-action="skipSummon">スキップ</button>`;
}
function finishSummon(){
  $('gachaResult').innerHTML=summonQueue.map(x=>
    `<div class="row" style="margin:8px 0">
      <div style="width:75px">${portrait(x.c.id)}</div>

  ).join('');

}

let battleSerial=0;

function makeUnit(id,side,options={}){
  const c=byId(id);
  const multiplier=options.multiplier??1;
  const st=side==='ally'?getStats(id):{
    hp:Math.floor(c.hp*multiplier*(options.hpMultiplier||1)),
    atk:Math.floor(c.atk*multiplier),
    speed:Math.max(1,Math.floor(c.speed*multiplier)),
    skillMultiplier:1
  };
  if(options.hp)st.hp=options.hp;
  if(options.speed)st.speed=options.speed;
  return {
    uid:++battleSerial,id,side,name:c.name,
    maxHp:st.hp,hp:st.hp,atk:st.atk,speed:st.speed,
    charge:options.charge??c.charge,
    skillCount:0,gauge:0,
    skillMultiplier:st.skillMultiplier,
    buff:1,buffTurns:0,permanentBuff:1,
    guard:0,evade:0,poison:0,acting:false,
    effectText:'',effectKind:''
  };
}
function startBattle(){
  if(battle?.running)return;
  if(selectedStage>state.clearedStage+1){
    showError('まだ解放されていません');return;
  }
  if(!state.party.length){showError('編成してください');return}
  const allies=state.party.map(id=>makeUnit(id,'ally'));
  const enemies=STAGE_ENEMIES[selectedStage].map(([id,m,hpMul])=>{
    const opt={multiplier:m,hpMultiplier:hpMul||1};
    if(selectedStage===10&&id==='ゴーレム'){
      opt.hp=700;opt.speed=12;opt.charge=3;
    }
    return makeUnit(id,'enemy',opt);
  });
  battle={
    stage:selectedStage,allies,enemies,running:true,busy:false,
    current:null,awaitingAction:false,result:null,
    token:++battleSerial,message:'戦闘開始！'
  };
  showPage('battleFight');
  renderBattle();
  advanceTurn();
}
function unitCard(u){
  const c=byId(u.id);
  const hpRate=Math.max(0,100*u.hp/u.maxHp);
  return `<div class="unit ${u.side==='enemy'?'enemy':''}
    ${u.hp<=0?'dead':''} ${u.acting?'active':''}">
    ${u.acting?`<div style="color:#ffe17c;font-weight:900">
      ${u.side==='enemy'?'▼ 敵の行動':'▶ 行動中'}</div>`:''}
    ${portrait(u.id)}
    ${u.effectText?`<div class="effect ${u.effectKind}">${esc(u.effectText)}</div>`:''}
    <div class="name ${rarityClass(c.rarity)}">${esc(u.name)}</div>
    <div class="small">HP ${Math.max(0,u.hp)} / ${u.maxHp}</div>
    <div class="hpbar"><i style="width:${hpRate}%"></i></div>
    <div class="small">スキル ${Math.min(u.skillCount,u.charge)} / ${u.charge}</div>
    ${u.guard>0?'<div class="small">🛡️ 防御中</div>':''}
    ${u.evade>0?'<div class="small">💨 回避中</div>':''}
  </div>`;
}
function renderBattle(){
  if(!battle)return;
  $('bossLabel').textContent=BOSS_STAGES.includes(battle.stage)?'👑 BOSS':'STAGE '+battle.stage;
  $('enemyUnits').innerHTML=battle.enemies.map(unitCard).join('');
  $('allyUnits').innerHTML=battle.allies.map(unitCard).join('');
  if(battle.result){renderBattleResult();return}
  const u=battle.current;
  if(battle.awaitingAction&&u?.side==='ally'){
    const c=byId(u.id),ready=u.skillCount>=u.charge;
    $('actionArea').innerHTML=`
      <b>${esc(u.name)} の行動</b>
      <p class="small">${esc(battle.message)}</p>
      <div class="action-buttons">
        <button class="attack" data-action="battleAttack">⚔️ 通常攻撃</button>
        <button class="skill" data-action="battleSkill" ${ready?'':'disabled'}>
          ✨ ${esc(c.skill)} ${ready?'':'（溜め中）'}
        </button>
      </div>`;
  }else{
    $('actionArea').innerHTML=`
      <div class="${u?.side==='enemy'?'enemy-preview':''}">
        ${esc(battle.message||'次の行動を待っています…')}
      </div>`;
  }
}
function showEffect(target,text,kind=''){
  target.effectText=String(text);
  target.effectKind=kind;
  renderBattle();
  const uid=target.uid,token=battle?.token;
  setTimeout(()=>{
    if(!battle||battle.token!==token)return;
    const unit=[...battle.allies,...battle.enemies].find(u=>u.uid===uid);
    if(unit&&unit.effectText===String(text)){
      unit.effectText='';unit.effectKind='';
      renderBattle();
    }
  },850);
}
function chooseNextUnit(){
  const units=[...alive(battle.allies),...alive(battle.enemies)];
  for(let i=0;i<10000;i++){
    const ready=units.filter(u=>u.gauge>=100);
    if(ready.length){
      ready.sort((a,b)=>{
        if(a.side!==b.side)return a.side==='ally'?-1:1;
        return b.gauge-a.gauge;
      });
      const u=ready[0];
      u.gauge-=100;
      return u;
    }
    for(const u of units)u.gauge+=u.speed;
  }
  return units[0]||null;
}
function clearActing(){
  if(!battle)return;
  for(const u of [...battle.allies,...battle.enemies])u.acting=false;
}
function getAttackPower(u){
  let atk=u.atk*u.buff*u.permanentBuff;
  if(u.id==='一閃スピアドン'&&u.hp<=u.maxHp/2)atk*=1.5;
  return Math.max(1,Math.floor(atk));
}
function chooseTarget(u){
  const opponents=u.side==='ally'?battle.enemies:battle.allies;
  const targets=alive(opponents);
  if(u.id==='狙撃手アーチャー'){
    return [...targets].sort((a,b)=>a.hp-b.hp)[0]||null;
  }
  return random(targets);
}
function dealDamage(attacker,target,amount,isSkill=false){
  if(!target||target.hp<=0)return 0;
  if(target.evade>0){
    target.evade--;
    showEffect(target,'回避','buff');
    return 0;
  }
  let damage=Math.max(1,Math.floor(amount));
  if(target.guard>0){
    damage=Math.max(1,Math.floor(damage*(1-target.guard)));
    target.guard=0;
  }
  target.hp=Math.max(0,target.hp-damage);
  showEffect(target,'−'+damage);
  battle.message=attacker.name+' → '+target.name+'：'+damage+'ダメージ';
  if(target.id==='鍛錬剣士'&&target.hp>0&&attacker.hp>0){
    if(Math.random()<(isSkill?1:.2)){
      const reflected=damage*2;
      attacker.hp=Math.max(0,attacker.hp-reflected);
      showEffect(attacker,'−'+reflected);
      battle.message+=' / アルティメットカウンター！';
    }
  }
  return damage;
}
function healUnit(target,amount){
  const before=target.hp;
  target.hp=Math.min(target.maxHp,target.hp+Math.max(1,Math.floor(amount)));
  const healed=target.hp-before;
  showEffect(target,'+'+healed,'heal');
  return healed;
}
async function advanceTurn(){
  if(!battle||!battle.running||battle.busy)return;
  if(checkBattleEnd())return;
  clearActing();
  const u=chooseNextUnit();
  if(!u)return;
  battle.current=u;u.acting=true;
  if(u.poison>0){
    const d=Math.max(1,Math.floor(u.maxHp*.08));
    u.hp=Math.max(0,u.hp-d);u.poison--;
    showEffect(u,'−'+d);
    battle.message=u.name+' は毒で '+d+' ダメージ！';
    await sleep(650);
    if(!battle?.running)return;
    if(u.hp<=0){
      clearActing();
      if(!checkBattleEnd())advanceTurn();
      return;
    }
  }
  if(u.side==='ally'){
    battle.awaitingAction=true;
    battle.message=u.name+' の行動を選択してください。';
    renderBattle();
    return;
  }
  battle.awaitingAction=false;
  const c=byId(u.id);
  const ready=u.skillCount>=u.charge;
  battle.message=u.name+' の行動予告：'+
    (ready?'スキル「'+c.skill+'」':'通常攻撃');
  renderBattle();
  const token=battle.token;
  await sleep(1100);
  if(!battle||!battle.running||battle.token!==token)return;
  await enemyAct(u);
}
async function allyAct(useSkill){
  if(!battle?.running||!battle.awaitingAction||battle.busy)return;
  const u=battle.current;
  if(!u||u.side!=='ally')return;
  if(useSkill&&u.skillCount<u.charge)return;
  battle.busy=true;battle.awaitingAction=false;
  await performAction(u,useSkill);
  if(!battle?.running)return;
  battle.busy=false;clearActing();
  if(checkBattleEnd())return;
  await sleep(450);
  advanceTurn();
}
async function enemyAct(u){
  if(!battle?.running)return;
  battle.busy=true;
  const c=byId(u.id);
  const useSkill=u.skillCount>=u.charge;
  battle.message=u.name+' の'+
    (useSkill?'スキル「'+c.skill+'」':'通常攻撃')+'！';
  renderBattle();
  await sleep(300);
  await performAction(u,useSkill);
  if(!battle?.running)return;
  battle.busy=false;clearActing();
  if(checkBattleEnd())return;
  await sleep(500);
  advanceTurn();
}
async function performAction(u,useSkill){
  if(!battle?.running)return;
  const c=byId(u.id);
  if(!useSkill){
    const target=chooseTarget(u);
    if(target)dealDamage(u,target,getAttackPower(u),false);
    u.skillCount=Math.min(u.charge,u.skillCount+1);
  }else{
    u.skillCount=0;
    const power=c.power*u.skillMultiplier;
    const allies=u.side==='ally'?battle.allies:battle.enemies;
    const opponents=u.side==='ally'?battle.enemies:battle.allies;
    if(c.effect==='damage'){
      const targets=c.target==='all'?alive(opponents):[chooseTarget(u)].filter(Boolean);
      for(const target of targets)dealDamage(u,target,power,true);
      if(c.target==='all')battle.message=u.name+' の「'+c.skill+'」！ 全体攻撃！';
    }else if(c.effect==='poison'){
      const target=chooseTarget(u);
      if(target){
        dealDamage(u,target,power,true);
        if(target.hp>0)target.poison=3;
      }
    }else if(c.effect==='heal'){
      const target=random(alive(allies));
      if(target)healUnit(target,power);
      battle.message=u.name+' の「'+c.skill+'」！';
    }else if(c.effect==='healPercent'){
      for(const target of alive(allies)){
        healUnit(target,target.maxHp*power/100);
      }
      battle.message=u.name+' の「'+c.skill+'」！';
    }else if(c.effect==='evade'||c.effect==='evadeSure'){
      u.evade=1;
      showEffect(u,'回避','buff');
      battle.message=u.name+' は回避状態になった！';
    }else if(c.effect==='guard'){
      u.guard=Math.min(.95,power/100);
      showEffect(u,'防御','buff');
      battle.message=u.name+' は防御態勢を取った！';
    }else if(c.effect==='buffAlly'){
      for(const target of alive(allies)){
        target.buff=1+power/100;
        target.buffTurns=1;
        showEffect(target,'強化','buff');
      }
      battle.message=u.name+' の「'+c.skill+'」！';
    }else if(c.effect==='buffSelf'){
      u.permanentBuff+=power/100;
      showEffect(u,'強化','buff');
      battle.message=u.name+' の「'+c.skill+'」！';
    }
  }
  if(u.buffTurns>0){
    u.buffTurns--;
    if(u.buffTurns===0)u.buff=1;
  }
  renderBattle();
  await sleep(850);
}
function checkBattleEnd(){
  if(!battle?.running)return true;
  if(!alive(battle.enemies).length){finishBattle(true);return true}
  if(!alive(battle.allies).length){finishBattle(false);return true}
  return false;
}

/* ===== 報酬 ===== */

function createStageDrop(stage){
  const candidates=[...new Set(STAGE_ENEMIES[stage].map(x=>x[0]))];
  const successful=[];
  for(const id of candidates){
    const c=byId(id);
    if(c&&Math.random()*100<DROP_RATES[c.rarity])successful.push(id);
  }
  if(!successful.length)return null;
  const id=random(successful);
  return {id,name:byId(id).name,message:addCharacter(id)};
}
function grantStageRewards(stage){
  const count=Number(state.stageClearCounts[stage])||0;
  const firstClear=count===0;
  const gold=Math.floor(STAGE_GOLD[stage]*Math.pow(.8,count));
  state.gold+=gold;
  let gems=0;
  if(firstClear&&Math.random()<.2){
    gems=50;state.gems+=gems;
  }
  let ringReward=null;
  if(stage===20&&firstClear){
    state.ringInventory.power=(Number(state.ringInventory.power)||0)+1;
    ringReward='power';
  }
  const drop=createStageDrop(stage);
  state.stageClearCounts[stage]=count+1;
  state.clearedStage=Math.max(state.clearedStage,stage);
  state.stage=Math.min(20,state.clearedStage+1);
  save();
  return {firstClear,gold,gems,ringReward,drop};
}
function finishBattle(victory){
  if(!battle?.running)return;
  battle.running=false;
  battle.busy=false;
  battle.awaitingAction=false;
  clearActing();
  battle.result={
    victory,
    rewards:victory?grantStageRewards(battle.stage):null
  };
  renderBattle();
}
function renderBattleResult(){
  const {victory,rewards}=battle.result;
  if(!victory){
    $('actionArea').innerHTML=`<div class="result">
      <h2>敗北…</h2>
      <p>編成や装備を見直して再挑戦しよう。</p>
      <button data-action="returnMap">草原マップへ戻る</button>
    </div>`;
    return;
  }
  let html=`<p>🪙 金貨 +${rewards.gold}</p>`;
  if(rewards.gems)html+=`<p>💎 ジェム +${rewards.gems}</p>`;
  if(rewards.ringReward){
    html+=`<p>🟠 チカラの指輪 ×1<br>
      <span class="small">初回クリア確定報酬</span></p>`;
  }
  if(rewards.drop){
    html+=`<p>🎁 キャラクタードロップ！<br>
      <b>${esc(rewards.drop.name)}</b><br>
      <span class="small">${esc(rewards.drop.message)}</span></p>`;
  }
  $('actionArea').innerHTML=`<div class="result">
    <h2>🎉 ステージクリア！</h2>
    <p>ステージ ${battle.stage} 勝利！</p>
    ${rewards.firstClear?'<p>✨ 初回クリア！</p>':''}
    ${html}
    <button data-action="returnMap">草原マップへ戻る</button>
  </div>`;
}
function returnMap(){
  if(battle){battle.running=false;battle.token=-1}
  battle=null;
  selectedStage=Math.min(20,Math.max(1,state.clearedStage+1));
  showPage('battle');
}
function selectStage(stage){
  if(!Number.isInteger(stage)||stage<1||stage>20)return;
  if(stage>state.clearedStage+1)return;
  selectedStage=stage;renderAll();
}

// 描画し直してもダメージ演出を維持する
const originalRenderBattle = renderBattle;

renderBattle = function(){
  if(!battle)return;

  const effects = [];

  for(const side of ['enemy','ally']){
    const parent = $(side === 'enemy'
      ? 'enemyUnits'
      : 'allyUnits');

    if(!parent)continue;

    for(const card of parent.children){
      const effect = card.querySelector('.effect');

      if(effect){
        const index = Array.prototype.indexOf.call(
          parent.children,card
        );

        effects.push({
          side,
          index,
          text:effect.textContent,
          kind:effect.classList.contains('heal')
            ? 'heal'
            : effect.classList.contains('buff')
              ? 'buff'
              : '',
          remaining:Math.max(
            0,
            900 - (
              performance.now() -
              Number(effect.dataset.started || performance.now())
            )
          )
        });
      }
    }
  }

  originalRenderBattle();

  for(const item of effects){
    if(item.remaining <= 0)continue;

    const parent = $(item.side === 'enemy'
      ? 'enemyUnits'
      : 'allyUnits');

    const card = parent?.children[item.index];
    if(!card)continue;

    const effect = card.querySelector('.effect');

    if(effect){
      effect.textContent = item.text;
      effect.className = 'effect ' + item.kind;
      effect.style.animationDuration = item.remaining + 'ms';
      effect.dataset.started = String(
        performance.now() - (900 - item.remaining)
      );
    }
  }

  // HPバー以外のゲージを削除
  document.querySelectorAll(
    '#battleFight .gaugebar,' +
    '#battleFight .action-gauge,' +
    '#battleFight .turn-gauge,' +
    '#battleFight .speed-gauge'
  ).forEach(el => el.remove());
};

// ダメージ演出は数字だけを1回表示

showEffect = function(target, text, kind = '') {
  if (!battle || !target) return;

  // 戦闘データにも演出内容を保存
  target.effectText = String(text);
  target.effectKind = kind;

  const token = battle.token;
  const uid = target.uid;

  // HP表示を更新
  renderBattle();

  // キャラの表示位置を取得
  const units = target.side === 'enemy'
    ? battle.enemies
    : battle.allies;

  const parent = target.side === 'enemy'
    ? $('enemyUnits')
    : $('allyUnits');

  const index = units.findIndex(u => u.uid === uid);
  const card = parent?.children[index];

  if (!card) return;

  // ダメージ演出を戦闘カードの外側に表示
  // 再描画で消されないようにする
  const rect = card.getBoundingClientRect();

  const popup = document.createElement('div');
  popup.textContent = String(text);

  Object.assign(popup.style, {
    position: 'fixed',
    left: (rect.left + rect.width / 2) + 'px',
    top: (rect.top + rect.height * 0.3) + 'px',
    transform: 'translateX(-50%)',
    zIndex: '9999',
    pointerEvents: 'none',
    fontSize: '32px',
    fontWeight: '900',
    color: kind === 'heal'
      ? '#86f3ad'
      : kind === 'buff'
        ? '#ffe17c'
        : '#ff8585',
    textShadow: '0 2px 5px black',
    whiteSpace: 'nowrap',
    transition: 'transform 0.9s ease-out, opacity 0.9s ease-out'
  });

  document.body.appendChild(popup);

  requestAnimationFrame(() => {
    popup.style.transform = 'translate(-50%, -45px)';
    popup.style.opacity = '0';
  });

  setTimeout(() => popup.remove(), 950);

  // キャラカード内の古い演出を消す
  target.effectText = '';
  target.effectKind = '';

  setTimeout(() => {
    if (!battle || battle.token !== token) return;
    const unit = [...battle.allies, ...battle.enemies]
      .find(u => u.uid === uid);

    if (unit && unit.effectText === String(text)) {
      unit.effectText = '';
      unit.effectKind = '';
    }
  }, 950);
};

  $('encyclopediaDetail').innerHTML = `
    <h2 class="section-title ${rarityClass(c.rarity)}">
      ${esc(c.name)}
    </h2>
    <div class="encyclopedia-detail-image">
      ${portrait(id)}
    </div>
    <div style="text-align:center">
      <b>${esc(c.rarity)}</b><br>
      Lv.${o.level}/${c.max}
    </div>
    <div class="encyclopedia-detail-stats">
      ❤️ HP：${s.hp}<br>
      ⚔️ 攻撃力：${s.atk}<br>
      💨 素早さ：${s.speed}<br>
      ✨ スキル：${esc(c.skill)}<br>
      ⏳ スキル溜め：${c.charge}<br>
      📈 成長率：${Math.round(c.growth * 100)}%<br>
      💍 装備スロット：${c.slot ?? 0}枠
      ${c.passive
        ? `<br>🌟 パッシブ：${esc(c.passive)}`
        : ''}
    </div>
    <button class="wide"
      data-action="togglePartyFromDetail"
      data-id="${esc(id)}">
      ${inParty ? '編成から外す' : '編成する'}
    </button>
  `;

  $('encyclopediaModal').classList.add('active');
}

// 新しいボタン操作
document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;

  const action = button.dataset.action;

  if (action === 'openEncyclopedia') {
    openEncyclopedia(button.dataset.id);
  }

  if (action === 'closeEncyclopedia') {
    $('encyclopediaModal').classList.remove('active');
  }

  if (action === 'togglePartyFromDetail') {
    toggleParty(button.dataset.id);
    openEncyclopedia(button.dataset.id);
  }
});

// 初回表示を更新
renderAll();
/* ===== 図鑑変更ここまで ===== */


/* ===== 毎日ログイン報酬・ルーレット ===== */
const DAILY_KEY='hoshiyomi_daily_v1';
const DAILY_PRIZES=[
  {label:'🪙 100金貨',type:'gold',amount:100,rate:30},
  {label:'🪙 300金貨',type:'gold',amount:300,rate:25},
  {label:'🪙 500金貨',type:'gold',amount:500,rate:15},
  {label:'💎 50ジェム',type:'gems',amount:50,rate:15},
  {label:'💎 100ジェム',type:'gems',amount:100,rate:10},
  {label:'💎 300ジェム',type:'gems',amount:300,rate:5}
];
const DAILY_COLORS=[
  '#bf823c','#d4a84b','#8d6945',
  '#477bc2','#6e5cc1','#b35a9c'
];

function dailyDate(){
  return new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Tokyo',
    year:'numeric',month:'2-digit',day:'2-digit'
  }).format(new Date());
}
function readDaily(){
  try{
    return JSON.parse(localStorage.getItem(DAILY_KEY))||{};
  }catch(e){return {}}
}
let dailyData=readDaily();
let dailySpinning=false;
let dailyRotation=0;
function saveDaily(){
  localStorage.setItem(DAILY_KEY,JSON.stringify(dailyData));
}
function dailyAvailable(kind){
  return dailyData[kind]!==dailyDate();
}

const dailyCSS=document.createElement('style');
dailyCSS.textContent=`
.daily-panel{text-align:center}
.daily-panel h2{color:#f4c76b}
.daily-wheel-wrap{
  position:relative;width:min(76vw,310px);
  aspect-ratio:1;margin:20px auto;
}
.daily-wheel{
  width:100%;height:100%;border-radius:50%;
  border:7px solid #f4c76b;
  box-shadow:0 0 22px #f4c76b66;
  transition:transform 4.5s cubic-bezier(.12,.75,.12,1);
}
.daily-wheel-label{
  position:absolute;left:50%;top:50%;
  transform-origin:center;
  color:white;font-size:12px;font-weight:900;
  text-shadow:0 1px 3px black;
  pointer-events:none;
}
.daily-pointer{
  position:absolute;top:-15px;left:50%;
  transform:translateX(-50%);
  z-index:5;color:#ff7777;font-size:36px;
  text-shadow:0 2px 3px black;
}
.daily-center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;
  display:grid;place-items:center;
  background:#f4c76b;color:#34240a;
  border:4px solid white;font-weight:900;
}
.daily-buttons{
  display:flex;gap:10px;justify-content:center;
  flex-wrap:wrap;margin-top:12px;
}
.daily-buttons button{min-width:145px}
`;
document.head.appendChild(dailyCSS);

// ホーム画面にボタンを追加
const dailyHome=document.createElement('div');
dailyHome.className='panel daily-panel';
dailyHome.innerHTML=`
  <h2>🎁 デイリー特典</h2>
  <p>毎日0時（日本時間）に更新！</p>
  <div class="daily-buttons">
    <button data-action="dailyBonusOpen">🎁 ログインボーナス</button>
    <button data-action="dailyWheelOpen">🎰 ログインルーレット</button>
  </div>
  <p id="dailyStatus" class="small"></p>
`;
$('home').appendChild(dailyHome);

// ポップアップ
const dailyModal=document.createElement('div');
dailyModal.className='modal';
dailyModal.id='dailyModal';
dailyModal.innerHTML=`
  <div class="modal-box daily-panel">
    <div id="dailyContent"></div>
    <button class="wide" id="dailyClose"
      data-action="dailyClose">閉じる</button>
  </div>
`;
document.body.appendChild(dailyModal);

function updateDailyStatus(){
  $('dailyStatus').textContent=
    'ボーナス：'+(dailyAvailable('bonus')?'受取可能':'受取済み')+
    ' ／ ルーレット：'+(dailyAvailable('wheel')?'挑戦可能':'挑戦済み');
}
function openDailyModal(){
  $('dailyModal').classList.add('active');
}
function closeDailyModal(){
  if(dailySpinning)return;
  $('dailyModal').classList.remove('active');
}
function showDailyBonus(){
  $('dailyContent').innerHTML=`
    <h2>🎁 ログインボーナス</h2>
    <p style="font-size:25px">💎 50ジェム</p>
    <p style="font-size:25px">🪙 200金貨</p>
    <button class="wide" data-action="dailyClaim"
      ${dailyAvailable('bonus')?'':'disabled'}>
      ${dailyAvailable('bonus')?'受け取る':'本日は受取済み'}
    </button>
  `;
  openDailyModal();
}
function claimDailyBonus(){
  if(!dailyAvailable('bonus'))return;
  dailyData.bonus=dailyDate();
  saveDaily();
  state.gems+=50;
  state.gold+=200;
  save();
  renderAll();
  updateDailyStatus();
  $('dailyContent').innerHTML=`
    <h2>🎉 受け取り完了！</h2>
    <p>💎 50ジェム</p>
    <p>🪙 200金貨</p>
    <p>明日もログインしよう！</p>
  `;
}

// ルーレットの円を描画
function wheelGradient(){
  return 'conic-gradient('+
    DAILY_COLORS.map((color,i)=>
      `${color} ${i*60}deg ${(i+1)*60}deg`
    ).join(',')+')';
}
function showDailyWheel(){
  $('dailyContent').innerHTML=`
    <h2>🎰 ログインルーレット</h2>
    <p>毎日1回無料！</p>
    <div class="daily-wheel-wrap">
      <div class="daily-pointer">▼</div>
      <div id="dailyWheel" class="daily-wheel"
        style="background:${wheelGradient()}"></div>
      <div class="daily-center">✦</div>
    </div>
    <div id="dailyWheelResult">
      ${dailyAvailable('wheel')?'本日の運試し！':'本日は挑戦済み'}
    </div>
    <button class="wide" id="dailySpinButton"
      data-action="dailySpin"
      ${dailyAvailable('wheel')?'':'disabled'}>
      ${dailyAvailable('wheel')?'無料で回す':'本日は挑戦済み'}
    </button>
    <p class="small">
      100金貨30% / 300金貨25% / 500金貨15%<br>
      50ジェム15% / 100ジェム10% / 300ジェム5%
    </p>
  `;
  
const wheel=$('dailyWheel');
DAILY_PRIZES.forEach((prize,i)=>{
  const a=(i*60+30)*Math.PI/180;
  const label=document.createElement('div');
  label.className='daily-wheel-label';
  label.textContent=prize.label;
  label.style.left=(50+32*Math.sin(a))+'%';
  label.style.top=(50-32*Math.cos(a))+'%';
  label.style.transform='translate(-50%,-50%)';
  wheel.appendChild(label);
});

  dailyRotation=0;
  openDailyModal();
}
function chooseDailyPrize(){
  let r=Math.random()*100;
  for(let i=0;i<DAILY_PRIZES.length;i++){
    r-=DAILY_PRIZES[i].rate;
    if(r<0)return i;
  }
  return DAILY_PRIZES.length-1;
}
function spinDailyWheel(){
  if(dailySpinning||!dailyAvailable('wheel'))return;
  const index=chooseDailyPrize();
  const prize=DAILY_PRIZES[index];
  dailySpinning=true;
  dailyData.wheel=dailyDate();
  saveDaily();
  const button=$('dailySpinButton');
  button.disabled=true;
  $('dailyClose').disabled=true;
  $('dailyWheelResult').textContent='抽選中…';

  // 当選した区画の中央が上の矢印に来る
  const target=(360-(index*60+30))%360;
  dailyRotation=360*6+target;
  const wheel=$('dailyWheel');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      wheel.style.transform=`rotate(${dailyRotation}deg)`;
    });
  });

  setTimeout(()=>{
    state[prize.type]+=prize.amount;
    save();
    renderAll();
    updateDailyStatus();
    $('dailyWheelResult').innerHTML=
      `<h2>🎉 ${prize.label} 獲得！</h2>`;
    dailySpinning=false;
    $('dailyClose').disabled=false;
  },4700);
}

// ボタン操作
document.addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button||button.disabled)return;
  switch(button.dataset.action){
    case 'dailyBonusOpen':showDailyBonus();break;
    case 'dailyClaim':claimDailyBonus();break;
    case 'dailyWheelOpen':showDailyWheel();break;
    case 'dailySpin':spinDailyWheel();break;
    case 'dailyClose':closeDailyModal();break;
  }
});

// 初回起動時に未受取なら表示
updateDailyStatus();
if(dailyAvailable('bonus')){
  showDailyBonus();
}
/* ===== デイリー機能ここまで ===== */

</script>
</body>
</html>
