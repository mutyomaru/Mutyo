<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星詠みの旅団</title>

<style>
:root{
  --bg:#101525;
  --panel:#1b2540;
  --panel2:#263453;
  --gold:#f4c76b;
  --text:#f4f5fb;
  --muted:#aab4ca;
  --line:#394866;
  --red:#e87979;
  --green:#76d6a1;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top,#202d4c 0,#101525 55%);
  color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  min-height:100vh;
}
button{
  font:inherit;
  color:inherit;
  border:1px solid #62708e;
  background:linear-gradient(180deg,#354666,#263453);
  border-radius:12px;
  padding:11px 14px;
  cursor:pointer;
}
button:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:900px;margin:auto;padding:14px}
.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  padding:12px 4px;
}
.brand{font-weight:900;color:var(--gold);font-size:22px}
.resources{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  background:#202c46;
  border:1px solid var(--line);
  padding:7px 11px;
  border-radius:999px;
  font-size:14px;
}
.nav{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:8px 0 16px;
}
.nav button{min-height:48px}
.page{display:none}
.page.active{display:block}
.panel{
  background:linear-gradient(145deg,#1d2945,#172139);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 8px 24px #0003;
}
.hero{text-align:center;padding:28px 16px}
.hero h1{color:var(--gold);font-size:28px;margin:0 0 8px}
.muted{color:var(--muted)}
.section-title{font-size:20px;color:var(--gold);margin:0 0 12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:10px;
}
.card{
  background:#202d49;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px;
  min-width:0;
}
.card.selected{border:2px solid var(--gold);padding:10px}
.portrait{
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  margin-bottom:6px;
}
.portrait img{max-height:100%;max-width:100%;object-fit:contain}
.name{font-weight:800}
.small{font-size:12px;color:var(--muted)}
.stats{font-size:13px;line-height:1.7;margin:6px 0}
.normal{color:#cbd5e1}
.rare{color:#74b8ff}
.epic{color:#d9a0ff}
.wide{width:100%}
.result{line-height:1.8;min-height:40px;margin-top:12px}
.error{
  display:none;
  background:#542d36;
  border:1px solid #b65d6a;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
  white-space:pre-wrap;
}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:14px}

/* 草原ステージマップ */

.stage-map{
  position:relative;
  overflow:hidden;
  padding:16px;
  border:2px solid #58794e;
  border-radius:18px;
  background:
    radial-gradient(ellipse at 15% 20%,#729d58 0,transparent 28%),
    radial-gradient(ellipse at 85% 75%,#668d4b 0,transparent 32%),
    linear-gradient(145deg,#456c43,#31543b 55%,#426a40);
}
.stage-map:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:radial-gradient(#d5e9a0 1px,transparent 1px);
  background-size:22px 22px;
}
.map-heading{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}
.map-heading h3{
  color:#fff3bd;
  margin:0;
  font-size:19px;
  text-shadow:0 2px 4px #172b18;
}
.map-progress{
  color:#fff;
  background:#203c2dcc;
  border:1px solid #a4c27c;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
}
.map-grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.stage-node{
  position:relative;
  min-width:0;
  min-height:91px;
  padding:8px 4px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  border-radius:14px;
  border:2px solid #b4c98b;
  background:linear-gradient(180deg,#e1e9b7,#a9c27b);
  color:#263b26;
  box-shadow:0 4px 0 #345534,0 5px 9px #152a1b88;
  text-align:center;
}
.stage-node .stage-number{
  font-size:23px;
  font-weight:1000;
  line-height:1.1;
}
.stage-node .stage-label{
  font-size:11px;
  font-weight:900;
}
.stage-node .stage-status{
  font-size:10px;
  font-weight:800;
}
.stage-node.completed{
  background:linear-gradient(180deg,#c5e9bb,#76b879);
  border-color:#e2f6c9;
}
.stage-node.current{
  background:linear-gradient(180deg,#fff0a8,#e9b94e);
  border-color:#fff0a8;
  box-shadow:0 0 0 3px #f4c76b66,0 4px 0 #87632b;
}
.stage-node.selected{
  outline:3px solid #fff;
  outline-offset:2px;
  transform:translateY(-2px);
}
.stage-node.boss{
  background:linear-gradient(180deg,#f1b2a3,#bd625b);
  color:#451e25;
  border-color:#ffd0bd;
}
.stage-node.boss.completed{
  background:linear-gradient(180deg,#e8b5a5,#b86d62);
}
.stage-node.boss.current{
  box-shadow:0 0 0 3px #ffb0a266,0 4px 0 #713b37;
}
.stage-node.locked{
  background:linear-gradient(180deg,#9ba58d,#697568);
  border-color:#a6b19c;
  color:#344236;
  box-shadow:0 4px 0 #354337;
}
.stage-node.unimplemented{
  background:linear-gradient(180deg,#737c72,#4d574e);
  border-color:#899387;
  color:#d1d7ce;
  box-shadow:0 4px 0 #343c35;
  opacity:.65;
}
.stage-node:disabled{cursor:not-allowed}
.map-legend{
  position:relative;
  z-index:1;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:16px;
  font-size:11px;
  color:#fff;
  text-shadow:0 1px 3px #172b18;
}
.map-legend span{display:flex;align-items:center;gap:4px}
.legend-dot{
  display:inline-block;
  width:11px;
  height:11px;
  border-radius:4px;
  border:1px solid #fff8;
}
.legend-normal{background:#c9d99c}
.legend-clear{background:#83c987}
.legend-boss{background:#d77d70}
.legend-locked{background:#788477}
.selected-stage-info{
  margin-top:13px;
  padding:12px;
  background:#203c2dcc;
  border:1px solid #a4c27c;
  border-radius:12px;
  color:#fff;
  position:relative;
  z-index:1;
}
.selected-stage-info strong{color:#ffe69a}
.map-start-button{
  width:100%;
  margin-top:10px;
  background:linear-gradient(180deg,#e6c16a,#a77c32);
  border-color:#ffe4a1;
  color:#30230e;
  font-weight:1000;
}
.enemy-formation-info{
  margin-top:8px;
  font-size:12px;
  line-height:1.7;
  color:#e3eddb;
}

/* 戦闘画面 */

.battle-screen{
  display:flex;
  flex-direction:column;
  gap:15px;
}
.battle-side-heading{
  font-size:19px;
  font-weight:900;
  margin:0 0 10px;
}
.enemy-heading{color:#ffaaaa}
.ally-heading{color:#9acbff}
.battle-side{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.battle-character{
  position:relative;
  min-width:0;
  overflow:hidden;
  text-align:center;
  padding:10px 8px 12px;
  border-radius:16px;
  border:1px solid var(--line);
  background:linear-gradient(155deg,#263653,#17233b);
}
.battle-character.enemy{
  background:linear-gradient(155deg,#513541,#2b2030);
  border-color:#895767;
}
.battle-character.ally{
  background:linear-gradient(155deg,#294264,#192943);
  border-color:#5476a4;
}
.battle-character.dead{
  opacity:.35;
  filter:grayscale(1);
}
.battle-character.turn-active{
  border:3px solid #ffe17c;
  padding:8px 6px 10px;
  box-shadow:
    0 0 0 3px #f4c76b55,
    0 0 20px #f4c76b99,
    inset 0 0 16px #f4c76b22;
  animation:turnPulse 1.2s ease-in-out infinite alternate;
}
.battle-character.enemy.turn-active{
  border-color:#ff8585;
  box-shadow:
    0 0 0 3px #ff858555,
    0 0 20px #ff858599,
    inset 0 0 16px #ff858522;
}
.turn-badge{
  position:absolute;
  z-index:7;
  top:5px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  padding:4px 10px;
  border-radius:20px;
  background:linear-gradient(180deg,#ffe99c,#e9b94e);
  color:#35250a;
  font-size:12px;
  font-weight:1000;
  box-shadow:0 2px 7px #0008;
}
.enemy .turn-badge{
  background:linear-gradient(180deg,#ffc1c1,#e87979);
  color:#501b25;
}
@keyframes turnPulse{
  from{filter:brightness(1)}
  to{filter:brightness(1.35)}
}
.battle-image{
  width:100%;
  height:165px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 6px;
}
.battle-image img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 5px 5px #0006);
}
.battle-name{
  font-size:16px;
  font-weight:900;
  margin:4px 0 6px;
  min-height:24px;
}
.battle-hp-text{
  font-size:12px;
  color:#d8dfed;
}
.hpbar{
  height:10px;
  background:#101827;
  border-radius:10px;
  overflow:hidden;
  margin:6px 0;
}
.hpbar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#35bd75,#9be5a9);
  transition:width .35s;
}
.gaugebar{
  height:7px;
  background:#101827;
  border-radius:10px;
  overflow:hidden;
  margin:4px 0 7px;
}
.gaugebar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#579dff,#c09aff);
  transition:width .25s;
}
.battle-divider{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--gold);
  font-size:19px;
  font-weight:900;
  justify-content:center;
}
.battle-divider:before,
.battle-divider:after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(90deg,transparent,#9b8150,transparent);
}
.action-panel{
  background:linear-gradient(145deg,#202e4b,#151f34);
  border:1px solid #536486;
  border-radius:16px;
  padding:14px;
  min-height:95px;
}
.action-title{
  font-size:18px;
  font-weight:900;
  color:var(--gold);
  margin-bottom:10px;
}
.action-character{
  background:#263653;
  border:1px solid #536486;
  border-radius:12px;
  padding:12px;
}
.action-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:11px;
}
.action-buttons button{min-height:52px;font-weight:800}
.attack-button{
  background:linear-gradient(180deg,#a34d59,#713443);
  border-color:#d17a87;
}
.skill-button{
  background:linear-gradient(180deg,#6950a8,#45336e);
  border-color:#a58ad8;
}
.enemy-preview{
  background:linear-gradient(145deg,#633b48,#342536);
  border:2px solid #bd687b;
  border-radius:14px;
  padding:15px;
  animation:previewIn .25s ease-out;
}
.preview-title{
  color:#ffb1b1;
  font-weight:900;
  font-size:18px;
  margin-bottom:8px;
}
.preview-detail{font-size:15px;line-height:1.9}
.preview-wait{
  color:#ffd0d0;
  font-size:12px;
  margin-top:8px;
}
.battle-result{
  text-align:center;
  padding:18px;
  background:#202d49;
  border:1px solid var(--gold);
  border-radius:14px;
}
.battle-result h3{
  color:var(--gold);
  font-size:25px;
  margin:0 0 12px;
}

/* ダメージ・回復などの演出 */

.effect-pop{
  position:absolute;
  z-index:5;
  top:38%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  font-size:34px;
  font-weight:1000;
  white-space:nowrap;
  text-shadow:0 3px 6px #000,0 0 10px #000,0 0 16px #000;
  animation:effectFloat 1.2s ease-out forwards;
}
.effect-damage{
  color:#ff7777;
  -webkit-text-stroke:1px #571d29;
}
.effect-heal{
  color:#79f0a8;
  -webkit-text-stroke:1px #14552e;
}
.effect-buff{
  color:#ffe27d;
  -webkit-text-stroke:1px #604b14;
}
.effect-guard{
  color:#8dcaff;
  -webkit-text-stroke:1px #17436a;
}
.effect-evade{
  color:#d0aaff;
  -webkit-text-stroke:1px #44276b;
}
.effect-miss{
  color:#d7e4ff;
  -webkit-text-stroke:1px #283d60;
}
@keyframes effectFloat{
  0%{opacity:0;transform:translate(-50%,0) scale(.65)}
  15%{opacity:1;transform:translate(-50%,-12px) scale(1.15)}
  35%{opacity:1;transform:translate(-50%,-20px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-58px) scale(.95)}
}
.hit-animation{animation:hitShake .35s ease-in-out}
@keyframes hitShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-5px)}
  40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}
@keyframes previewIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:600px){
  .wrap{padding:10px}
  .nav{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:24px}
  .panel{padding:13px}
  .battle-side{grid-template-columns:repeat(2,minmax(0,1fr))}
  .battle-image{height:145px}
  .effect-pop{font-size:31px}
  .map-grid{gap:9px}
  .stage-node{min-height:82px}
}
@media(max-width:360px){
  .battle-side{grid-template-columns:1fr 1fr}
  .battle-image{height:120px}
  .battle-name{font-size:14px}
  .effect-pop{font-size:28px}
  .stage-node .stage-number{font-size:20px}
  .stage-node .stage-label{font-size:10px}
}
</style>
</head>

<body>
<div class="wrap">

<header class="top">
  <div class="brand">✦ 星詠みの旅団</div>
  <div class="resources">
    <span class="pill">💎 <b id="gems">0</b></span>
    <span class="pill">🪙 <b id="gold">0</b></span>
    <span class="pill">到達ステージ <b id="stage">1</b></span>
  </div>
</header>

<div id="errorBox" class="error"></div>

<nav class="nav">
  <button data-page="home">ホーム</button>
  <button data-page="gacha">ガチャ</button>
  <button data-page="team">編成・図鑑</button>
  <button data-page="battle">戦闘</button>
  <button data-page="shop">ショップ</button>
</nav>

<main>

<section id="home" class="page active">
  <div class="panel hero">
    <h1>星の導きが、旅の始まり</h1>
    <p class="muted">仲間を集め、育て、未知の敵に挑もう。</p>
    <div class="row" style="justify-content:center">
      <button data-page="gacha">仲間を召喚する</button>
      <button data-page="team">編成を確認する</button>
      <button data-page="battle">冒険に出る</button>
    </div>
  </div>
  <div class="panel">
    <h2 class="section-title">旅団の状況</h2>
    <div id="homeSummary"></div>
  </div>
</section>

<section id="gacha" class="page">
  <div class="panel">
    <h2 class="section-title">星詠み召喚</h2>
    <p>ノーマル 70% / レア 25% / エピック 5%</p>
    <div class="row">
      <button data-action="summon" data-count="1">1回召喚（💎100）</button>
      <button data-action="summon" data-count="10">10回召喚（💎900）</button>
    </div>
    <div id="gachaResult" class="result muted">召喚結果がここに表示されます。</div>
  </div>
  <div class="panel">
    <h2 class="section-title">所持状況</h2>
    <div id="gachaOwned" class="small"></div>
  </div>
</section>

<section id="team" class="page">
  <div class="panel">
    <h2 class="section-title">パーティ編成</h2>
    <p class="muted">所持キャラクターを選択して最大3人まで編成できます。</p>
    <div id="partyView" class="grid"></div>
  </div>
  <div class="panel">
    <h2 class="section-title">キャラクター図鑑</h2>
    <div id="characterList" class="grid"></div>
  </div>
</section>

<section id="shop" class="page">
  <div class="panel">
    <h2 class="section-title">ショップ</h2>
    <p>ショップは準備中です。</p>
  </div>
</section>

<section id="battle" class="page">
  <div class="panel">
    <h2 class="section-title">草原マップ</h2>
    <p class="muted">
      ステージを選択して冒険に出よう。クリア済みのステージにも再挑戦できる。
    </p>
    <div id="stageMap"></div>
  </div>

  <div class="panel">
    <h2 class="section-title">冒険準備</h2>
    <div id="battleIntro"></div>
    <div class="row" style="margin-top:12px">
      <button id="startBattleButton" class="map-start-button" data-action="startBattle">
        選択したステージに挑戦
      </button>
    </div>
  </div>

  <div id="battleArea" class="panel" style="display:none">
    <div class="battle-screen">
      <div>
        <div class="battle-side-heading enemy-heading" id="enemyHeading">▼ 敵軍</div>
        <div id="enemyUnits" class="battle-side"></div>
      </div>

      <div class="battle-divider">✦ VS ✦</div>

      <div>
        <div class="battle-side-heading ally-heading">▲ 旅団</div>
        <div id="allyUnits" class="battle-side"></div>
      </div>

      <div id="actionArea" class="action-panel">
        <div class="muted">戦闘準備中...</div>
      </div>
    </div>
  </div>
</section>

</main>

<div class="footer">星詠みの旅団</div>
</div>

<script>
'use strict';

const KEY='hoshiyomi_save_v2';

const MAX_STAGE=20;
const IMPLEMENTED_STAGE=10;
const BOSS_STAGES=[10,20];

const CHARACTERS=[
{id:'swordman',imageFile:'Swordman.png',name:'剣士',rarity:'ノーマル',hp:100,atk:20,speed:20,charge:3,skill:'強撃',effect:'damage',power:50,target:'one',growth:.07,max:20},
{id:'archer',imageFile:'Archer.png',name:'アーチャー',rarity:'ノーマル',hp:70,atk:10,speed:16,charge:2,skill:'乱射',effect:'damage',power:10,target:'all',growth:.07,max:20},
{id:'axeman',imageFile:'Axeman.png',name:'アックスマン',rarity:'ノーマル',hp:130,atk:30,speed:9,charge:4,skill:'叩き割り',effect:'damage',power:70,target:'one',growth:.06,max:20},
{id:'spearman',imageFile:'Spearman.png',name:'スピアマン',rarity:'ノーマル',hp:100,atk:10,speed:20,charge:6,skill:'致命突き',effect:'damage',power:150,target:'one',growth:.07,max:20},
{id:'goblin',imageFile:'Goblin.png',name:'ゴブリン',rarity:'ノーマル',hp:70,atk:20,speed:25,charge:5,skill:'回避',effect:'evade',power:80,target:'self',growth:.08,max:20},

const byId=id=>CHARACTERS.find(c=>c.id===id);

function isBossStage(stage){
  return BOSS_STAGES.includes(Number(stage));
}

/*
  敵編成データ

  type:'level'
  → 指定レベルまで通常成長させる。

  type:'multiplier'
  → レベル1の基本ステータスに倍率をかける。
     50%なら0.5、75%なら0.75、100%なら1.0。

  hpMultiplier
  → HPだけに別の倍率をかける。
*/
const STAGE_ENEMIES={
  1:[
    {id:'goblin',type:'multiplier',multiplier:.50}
  ],
  2:[
    {id:'goblin',type:'multiplier',multiplier:.50},
    {id:'goblin',type:'multiplier',multiplier:.50}
  ],
  3:[
    {id:'zombie',type:'level',level:1},
    {id:'goblin',type:'multiplier',multiplier:.50}
  ],
  4:[
    {id:'swordman',type:'level',level:1}
  ],
  5:[
    {id:'swordman',type:'multiplier',multiplier:.75},
    {id:'spearman',type:'multiplier',multiplier:.75}
  ],
  6:[
    {id:'miner',type:'multiplier',multiplier:.75},
    {id:'miner',type:'multiplier',multiplier:.75}
  ],
  7:[
    {id:'axeman',type:'multiplier',multiplier:1.00}
  ],
  8:[
    {id:'farmer',type:'multiplier',multiplier:1.00},
    {id:'miner',type:'multiplier',multiplier:.75}
  ],
  9:[
    {id:'swordman',type:'multiplier',multiplier:.75},
    {id:'archer',type:'multiplier',multiplier:.75},
    {id:'spearman',type:'multiplier',multiplier:.75}
  ],
  10:[
    {id:'ゴーレム',type:'level',level:1,hpMultiplier:2.00}
  ]
};

function fresh(){
  return {
    gems:500,
    gold:300,
    stage:1,
    clearedStage:0,
    owned:{
      swordman:{level:1,dupes:0},
      archer:{level:1,dupes:0},
      spearman:{level:1,dupes:0}
    },
    party:['swordman','archer','spearman']
  };
}

function loadState(){
  let raw=null;

  try{
    raw=JSON.parse(localStorage.getItem(KEY)||'null');
  }catch(e){}

  const d=fresh();
  if(!raw||typeof raw!=='object')return d;

  const s={...d,...raw};

  s.gems=Number.isFinite(+s.gems)?Math.max(0,+s.gems):d.gems;
  s.gold=Number.isFinite(+s.gold)?Math.max(0,+s.gold):d.gold;

  s.stage=Number.isFinite(+s.stage)
    ?Math.min(IMPLEMENTED_STAGE,Math.max(1,Math.floor(+s.stage)))
    :1;

  const oldCleared=s.stage-1;

  s.clearedStage=Number.isFinite(+raw.clearedStage)
    ?Math.min(IMPLEMENTED_STAGE,Math.max(oldCleared,Math.floor(+raw.clearedStage)))
    :oldCleared;

  s.stage=Math.min(IMPLEMENTED_STAGE,s.clearedStage+1);

  s.owned=raw.owned&&typeof raw.owned==='object'?raw.owned:{};

  for(const [id,v] of Object.entries(s.owned)){
    if(!byId(id)||!v||typeof v!=='object'){
      delete s.owned[id];
      continue;
    }

    v.level=Math.min(byId(id).max,Math.max(1,Number(v.level)||1));
    v.dupes=Math.max(0,Number(v.dupes)||0);
  }

  for(const id of Object.keys(d.owned)){
    if(!s.owned[id])s.owned[id]={...d.owned[id]};
  }

  s.party=Array.isArray(raw.party)
    ?raw.party.filter((id,i,a)=>byId(id)&&s.owned[id]&&a.indexOf(id)===i).slice(0,3)
    :d.party.slice();

  if(!s.party.length){
    s.party=d.party.filter(id=>s.owned[id]);
  }

  return s;
}

let state=loadState();
let battle=null;
let busy=false;
let enemyTimer=null;

let selectedStage=Math.min(
  IMPLEMENTED_STAGE,
  state.clearedStage+1
);

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){
    showError('セーブを保存できませんでした。ブラウザの保存容量・設定を確認してください。');
  }

  renderAll();
}

function showError(msg){
  const el=document.getElementById('errorBox');

  if(el){
    el.textContent=msg;
    el.style.display='block';
  }
}

window.addEventListener('error',e=>{
  showError('ゲーム内でエラーが発生しました: '+e.message);
});

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function imagePath(id){
  const c=byId(id);
  const file=c?.imageFile||id+'.png';

  return './images/'+encodeURIComponent(file);
}

function portrait(id){
  const c=byId(id);

  return `
    <div class="portrait">
      <img src="${imagePath(id)}"
        alt="${esc(c?.name||id)}"
        onerror="this.style.display='none'">
    </div>
  `;
}

function stats(c,o){
  const lv=o?.level||1;
  const mul=Math.pow(1+c.growth,lv-1);

  return {
    hp:Math.round(c.hp*mul),
    atk:Math.round(c.atk*mul),
    power:Math.round(c.power*mul),
    speed:c.speed
  };
}

function rarityClass(r){
  return r==='エピック'
    ?'epic'
    :r==='レア'
      ?'rare'
      :'normal';
}

function cardHTML(id,selectable=false){
  const c=byId(id);
  const o=state.owned[id];

  if(!c)return '';

  const st=stats(c,o);
  const selected=state.party.includes(id);

  return `
    <article class="card ${selectable&&selected?'selected':''}">
      ${portrait(id)}

      <div class="name">${esc(c.name)}</div>

      <div class="small ${rarityClass(c.rarity)}">
        ${c.rarity} / Lv.${o?.level||1}
      </div>

      <div class="stats">
        HP ${st.hp}　攻撃 ${st.atk}<br>
        素早さ ${st.speed}<br>
        スキル：${esc(c.skill)}
        ${c.passive?'<br>特性：'+esc(c.passive):''}
      </div>

      ${selectable?`
        <button class="wide"
          data-action="toggleParty"
          data-id="${esc(id)}">
          ${selected?'編成から外す':'編成に加える'}
        </button>
      `:''}
    </article>
  `;
}

/* ステージの敵編成を説明する */
function getFormationText(stage){
  const formation=STAGE_ENEMIES[stage];

  if(!formation)return '未実装';

  return formation.map(enemy=>{
    const c=byId(enemy.id);
    if(!c)return '不明な敵';

    if(enemy.type==='level'){
      return `${c.name} Lv.${enemy.level||1}`;
    }

    return `${c.name} ${Math.round(enemy.multiplier*100)}%`;
  }).join(' / ');
}

/* ステージマップ */
function renderStageMap(){
  const map=document.getElementById('stageMap');
  if(!map)return;

  const unlocked=Math.min(
    IMPLEMENTED_STAGE,
    state.clearedStage+1
  );

  const cleared=Math.min(
    IMPLEMENTED_STAGE,
    state.clearedStage
  );

  let nodes='';

  for(let i=1;i<=MAX_STAGE;i++){
    const boss=isBossStage(i);
    const implemented=i<=IMPLEMENTED_STAGE;
    const isCleared=i<=cleared;
    const isUnlocked=implemented&&i<=unlocked;
    const isCurrent=implemented&&i===unlocked;
    const isSelected=i===selectedStage;

    let classes='stage-node';

    if(boss)classes+=' boss';
    if(isCleared)classes+=' completed';
    if(isCurrent)classes+=' current';
    if(isSelected)classes+=' selected';
    if(!implemented)classes+=' unimplemented';
    else if(!isUnlocked)classes+=' locked';

    let status='🔒 未解放';

    if(!implemented){
      status='未実装';
    }else if(isCleared){
      status='✓ クリア済み';
    }else if(isCurrent){
      status='挑戦可能';
    }

    nodes+=`
      <button
        class="${classes}"
        data-action="selectStage"
        data-stage="${i}"
        ${!isUnlocked?'disabled':''}
        aria-label="ステージ${i}${boss?' ボス':''}"
      >
        <span class="stage-number">${boss?'👑 ':''}${i}</span>
        <span class="stage-label">${boss?'BOSS STAGE':'STAGE'}</span>
        <span class="stage-status">${status}</span>
      </button>
    `;
  }

  const bossText=isBossStage(selectedStage)
    ?' <strong>👑 ボスステージ</strong>'
    :'';

  const replayText=selectedStage<=cleared
    ?'クリア済みステージへの再挑戦'
    :'新しいステージへの挑戦';

  const formationText=getFormationText(selectedStage);

  map.innerHTML=`
    <div class="stage-map">

      <div class="map-heading">
        <h3>🌿 緑風の草原</h3>
        <div class="map-progress">
          クリア ${cleared} / ${IMPLEMENTED_STAGE}
        </div>
      </div>

      <div class="map-grid">
        ${nodes}
      </div>

      <div class="map-legend">
        <span><i class="legend-dot legend-normal"></i>通常</span>
        <span><i class="legend-dot legend-clear"></i>クリア済み</span>
        <span><i class="legend-dot legend-boss"></i>ボス</span>
        <span><i class="legend-dot legend-locked"></i>未解放・未実装</span>
      </div>

      <div class="selected-stage-info">
        選択中：<strong>ステージ ${selectedStage}</strong>${bossText}<br>
        <span class="small">${replayText}</span>
        <div class="enemy-formation-info">
          敵編成：${esc(formationText)}
        </div>
      </div>

      <button
        class="map-start-button"
        data-action="startBattle"
        ${!state.party.length?'disabled':''}
      >
        ステージ ${selectedStage} に挑戦する
      </button>

    </div>
  `;
}

function showPage(name){
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.toggle('active',p.id===name);
  });

  if(name==='battle'){
    renderStageMap();
    renderBattle();
  }

  window.scrollTo(0,0);
}

function selectStage(stage){
  stage=Number(stage);

  const unlocked=Math.min(
    IMPLEMENTED_STAGE,
    state.clearedStage+1
  );

  if(!Number.isInteger(stage)||stage<1||stage>unlocked)return;

  if(battle&&!battle.over){
    showError('戦闘中はステージを変更できません。');
    return;
  }

  selectedStage=stage;
  renderAll();
}

function summon(count){
  const cost=count===10?900:100;

  if(state.gems<cost){
    document.getElementById('gachaResult').textContent='💎が足りません。';
    return;
  }

  state.gems-=cost;
  const results=[];

  for(let i=0;i<count;i++){
    const roll=Math.random()*100;

    const pool=CHARACTERS.filter(c=>
      roll<5
        ?c.rarity==='エピック'
        :roll<30
          ?c.rarity==='レア'
          :c.rarity==='ノーマル'
    );

    const c=pool[Math.floor(Math.random()*pool.length)];

    if(!state.owned[c.id]){
      state.owned[c.id]={level:1,dupes:0};

      results.push(
        `<span class="${rarityClass(c.rarity)}">${esc(c.name)}（初獲得）</span>`
      );

    }else{
      const o=state.owned[c.id];

      o.dupes=(o.dupes||0)+1;

      if(o.level<c.max&&o.dupes>=o.level){
        o.dupes=0;
        o.level++;

        results.push(`${esc(c.name)}：Lv.${o.level}に成長！`);

      }else if(o.level>=c.max){
        o.dupes=0;
        state.gold+=50;

        results.push(`${esc(c.name)}：最大Lvのため🪙50獲得`);

      }else{
        results.push(`${esc(c.name)}：重複 ${o.dupes}/${o.level}`);
      }
    }
  }

  document.getElementById('gachaResult').innerHTML=
    results.join('<br>');

  save();
}

function toggleParty(id){
  if(!state.owned[id])return;

  const i=state.party.indexOf(id);

  if(i>=0){
    state.party.splice(i,1);

  }else if(state.party.length<3){
    state.party.push(id);

  }else{
    showError('編成できるのは3人までです。');
    return;
  }

  save();
}

/*
  敵キャラクター生成

  レベル指定の場合：
  stats()で通常の成長率を適用。

  倍率指定の場合：
  レベル1の基本ステータスに倍率を適用。
  HP・攻撃力・スキル威力が対象。
  素早さは既存仕様どおりレベルで成長しないため、
  倍率による変化もさせない。

  hpMultiplierがある場合：
  HPだけに追加倍率を適用。
*/
function makeEnemy(i,stage){
  const formation=STAGE_ENEMIES[stage];

  if(!formation||!formation[i])return null;

  const setting=formation[i];
  const c=byId(setting.id);

  if(!c)return null;

  let st;
  let strengthLabel;

  if(setting.type==='level'){
    const level=Math.min(
      c.max,
      Math.max(1,setting.level||1)
    );

    st=stats(c,{level});
    strengthLabel=`Lv.${level}`;

  }else{
    const multiplier=setting.multiplier;

    const base=stats(c,{level:1});

    st={
      hp:Math.round(base.hp*multiplier),
      atk:Math.round(base.atk*multiplier),
      power:Math.round(base.power*multiplier),
      speed:base.speed
    };

    strengthLabel=`${Math.round(multiplier*100)}%`;
  }

  if(setting.hpMultiplier){
    st.hp=Math.round(st.hp*setting.hpMultiplier);
    strengthLabel+=` / HP ${Math.round(setting.hpMultiplier*100)}%`;
  }

  return {
    id:'enemy'+i,
    name:c.name,
    imageId:c.id,
    characterId:c.id,
    side:'enemy',

    hp:st.hp,
    maxHp:st.hp,
    atk:st.atk,
    speed:st.speed,

    gauge:0,
    alive:true,
    guard:false,
    evade:0,
    poison:0,
    buff:1,

    effectText:'',
    effectKind:'',
    effectVersion:0,
    hit:false,

    strengthLabel
  };
}

function alive(arr){
  return arr.filter(x=>x.alive&&x.hp>0);
}

function chooseRandomEnemy(){
  const enemies=alive(battle.enemies);

  if(!enemies.length)return null;

  return enemies[Math.floor(Math.random()*enemies.length)];
}

function chooseRandomAlly(){
  const allies=alive(battle.allies);

  if(!allies.length)return null;

  return allies[Math.floor(Math.random()*allies.length)];
}

function chooseEnemy(){
  return alive(battle.enemies)
    .sort((a,b)=>a.hp-b.hp)[0]||null;
}

function chooseAlly(){
  return alive(battle.allies)
    .sort((a,b)=>a.hp-b.hp)[0]||null;
}

function chooseAttackTarget(actor){
  if(actor&&actor.id==='狙撃手アーチャー'){
    return chooseEnemy();
  }

  return chooseRandomEnemy();
}

/* 演出はここで再描画しない */
function showUnitEffect(unit,text,kind='damage'){
  if(!unit)return;

  unit.effectVersion=(unit.effectVersion||0)+1;

  const thisVersion=unit.effectVersion;

  unit.effectText=text;
  unit.effectKind=kind;
  unit.hit=kind==='damage'||kind==='miss';

  const currentBattle=battle;
  const unitId=String(unit.id);

  setTimeout(()=>{
    if(!currentBattle||battle!==currentBattle)return;
    if(unit.effectVersion!==thisVersion)return;

    unit.effectText='';
    unit.effectKind='';
    unit.hit=false;

    document.querySelectorAll('.battle-character').forEach(el=>{
      if(el.dataset.unitId!==unitId)return;

      const effect=el.querySelector('.effect-pop');

      if(effect)effect.remove();

      el.classList.remove('hit-animation');
    });
  },1250);
}

function startBattle(){
  if(busy)return;

  if(enemyTimer){
    clearTimeout(enemyTimer);
    enemyTimer=null;
  }

  if(!state.party.length){
    showError('先に編成を設定してください。');
    return;
  }

  const unlocked=Math.min(
    IMPLEMENTED_STAGE,
    state.clearedStage+1
  );

  if(selectedStage>unlocked){
    showError('そのステージはまだ解放されていません。');
    return;
  }

  if(selectedStage>IMPLEMENTED_STAGE||!STAGE_ENEMIES[selectedStage]){
    showError('このステージはまだ実装されていません。');
    return;
  }

  const formation=STAGE_ENEMIES[selectedStage];

  battle={
    stage:selectedStage,
    isBoss:isBossStage(selectedStage),
    turn:0,
    over:false,
    readyActor:null,
    pendingEnemy:null,

    allies:state.party.map(id=>makeUnit(id,'ally')),

    enemies:formation
      .map((setting,index)=>makeEnemy(index,selectedStage))
      .filter(Boolean)
  };

  busy=false;

  showPage('battle');
  renderBattle();
  advanceBattle();
}

function chooseEnemyAttackTarget(enemy){
  if(
    enemy&&
    (
      enemy.characterId==='狙撃手アーチャー'||
      enemy.id==='狙撃手アーチャー'
    )
  ){
    return chooseAlly();
  }

  return chooseRandomAlly();
}

/* 敵の行動を予告してから実行 */
function prepareEnemyAction(enemy){
  const target=chooseEnemyAttackTarget(enemy);

  if(!target)return;

  battle.pendingEnemy={
    actorId:enemy.id,
    targetId:target.id,
    actorName:enemy.name,
    targetName:target.name,
    actionName:'通常攻撃'
  };

  busy=true;
  renderBattle();

  const currentBattle=battle;

  enemyTimer=setTimeout(()=>{
    enemyTimer=null;

    if(!battle||battle!==currentBattle||battle.over){
      busy=false;
      return;
    }

    const pending=battle.pendingEnemy;

    if(!pending){
      busy=false;
      return;
    }

    const actor=battle.enemies.find(x=>
      x.id===pending.actorId&&x.alive
    );

    const victim=battle.allies.find(x=>
      x.id===pending.targetId&&x.alive
    );

    battle.pendingEnemy=null;

    if(actor&&victim){
      enemyAct(actor,victim);
    }

    for(const e of alive(battle.enemies)){
      if(e.poison>0){
        e.hp=Math.max(0,e.hp-8);
        e.poison--;

        showUnitEffect(e,'毒 -8','damage');

        if(e.hp===0)e.alive=false;
      }
    }

    busy=false;

    if(alive(battle.enemies).length===0){
      finishBattle(true);
      return;
    }

    if(alive(battle.allies).length===0){
      finishBattle(false);
      return;
    }

    renderBattle();
    advanceBattle();

  },1100);
}

/* 味方の行動 */
function performAlly(actor,useSkill){
  const c=byId(actor.id);

  if(!c)return;

  if(useSkill){
    if(actor.charge>0&&actor.actions<actor.charge)return;

    actor.actions=0;

    showUnitEffect(actor,'SKILL!','buff');

    if(actor.effect==='damage'){
      const targets=actor.target==='all'
        ?alive(battle.enemies)
        :[chooseAttackTarget(actor)];

      targets.forEach(t=>{
        if(t)deal(actor,t,actor.power);
      });

    }else if(actor.effect==='evade'||actor.effect==='evadeSure'){
      actor.evade=1;
      showUnitEffect(actor,'回避態勢','evade');

    }else if(actor.effect==='guard'){
      actor.guard=true;
      showUnitEffect(actor,'GUARD','guard');

    }else if(actor.effect==='poison'){
      const t=chooseAttackTarget(actor);

      if(t){
        deal(actor,t,actor.power);
        t.poison=3;
      }

    }else if(actor.effect==='heal'||actor.effect==='healPercent'){
      const allies=alive(battle.allies);

      const t=actor.effect==='heal'
        ?allies[Math.floor(Math.random()*allies.length)]
        :chooseAlly();

      if(t){
        const amount=actor.effect==='healPercent'
          ?Math.round(t.maxHp*actor.power/100)
          :actor.power;

        const actual=Math.min(t.maxHp-t.hp,amount);

        t.hp=Math.min(t.maxHp,t.hp+amount);

        showUnitEffect(t,'+'+actual,'heal');
      }

    }else if(actor.effect==='buffSelf'){
      actor.buff+=actor.power/100;

      showUnitEffect(actor,'攻撃力UP','buff');

    }else if(actor.effect==='buffAlly'){
      const t=chooseAlly();

      if(t){
        t.buff+=actor.power/100;

        showUnitEffect(t,'攻撃力UP','buff');
      }
    }

  }else{
    actor.actions++;

    const t=chooseAttackTarget(actor);

    if(t){
      deal(actor,t,actor.atk*actor.buff);
    }
  }

  if(actor.passive==='ウィルパワー'){
    actor.atk+=Math.max(1,Math.round(actor.atk*.1));

    showUnitEffect(actor,'攻撃力上昇','buff');
  }

  if(actor.passive==='アルティメットカウンター'){
    actor.counter=true;
  }
}

/* ダメージ処理 */
function deal(attacker,target,amount){
  if(!target||!target.alive)return 0;

  if(target.evade>0){
    target.evade=0;

    showUnitEffect(target,'MISS!','miss');

    return 0;
  }

  let dmg=Math.max(1,Math.round(amount));

  if(target.guard){
    dmg=Math.max(1,Math.round(dmg*.3));
    target.guard=false;
  }

  target.hp=Math.max(0,target.hp-dmg);

  showUnitEffect(target,'-'+dmg,'damage');

  if(target.hp<=0){
    target.alive=false;
  }

  return dmg;
}

function enemyAct(e,target){
  if(!target||!target.alive)return;

  const dmg=deal(e,target,e.atk*e.buff);

  if(target.passive==='アルティメットカウンター'&&Math.random()<.2){
    const reflected=Math.round(dmg*2);

    e.hp=Math.max(0,e.hp-reflected);

    showUnitEffect(e,'反射 -'+reflected,'damage');

    if(e.hp===0)e.alive=false;
  }
}

function advanceBattle(){
  if(!battle||battle.over||busy)return;

  let guard=0;

  while(!battle.readyActor&&guard++<100){

    if(alive(battle.enemies).length===0){
      finishBattle(true);
      return;
    }

    if(alive(battle.allies).length===0){
      finishBattle(false);
      return;
    }

    const units=[
      ...alive(battle.allies),
      ...alive(battle.enemies)
    ];

    units.forEach(u=>u.gauge+=u.speed);

    const ready=units
      .filter(u=>u.gauge>=100)
      .sort((a,b)=>
        b.gauge-a.gauge||
        (a.side===b.side?0:(a.side==='ally'?-1:1))
      );

    if(!ready.length)continue;

    const actor=ready[0];

    actor.gauge-=100;

    if(actor.side==='ally'){
      battle.readyActor=actor.id;

      renderBattle();

      return;
    }

    prepareEnemyAction(actor);

    return;
  }

  renderBattle();
}

function playerAction(id,skill){
  if(!battle||battle.over||busy||battle.readyActor!==id)return;

  const actor=battle.allies.find(x=>x.id===id&&x.alive);

  if(!actor)return;

  if(skill&&actor.charge>0&&actor.actions<actor.charge)return;

  busy=true;

  performAlly(actor,skill);

  battle.readyActor=null;

  if(alive(battle.enemies).length===0){
    busy=false;
    finishBattle(true);
    return;
  }

  if(alive(battle.allies).length===0){
    busy=false;
    finishBattle(false);
    return;
  }

  busy=false;

  renderBattle();
  advanceBattle();
}

function finishBattle(win){
  if(!battle||battle.over)return;

  if(enemyTimer){
    clearTimeout(enemyTimer);
    enemyTimer=null;
  }

  battle.over=true;
  battle.pendingEnemy=null;
  battle.resultWin=win;

  busy=false;

  if(win){
    const cleared=battle.stage;

    state.clearedStage=Math.max(
      state.clearedStage,
      cleared
    );

    state.stage=Math.min(
      IMPLEMENTED_STAGE,
      state.clearedStage+1
    );

    state.gold+=100;
    state.gems+=40;

    selectedStage=Math.min(
      IMPLEMENTED_STAGE,
      state.clearedStage+1
    );
  }

  save();
  renderBattle();
}

function renderBattle(){
  const area=document.getElementById('battleArea');

  if(!battle){
    area.style.display='none';
    return;
  }

  area.style.display='block';

  const activeId=battle.readyActor||
    (battle.pendingEnemy?battle.pendingEnemy.actorId:null);

  const unitHTML=u=>{
    const isEnemy=u.side==='enemy';
    const dead=!u.alive||u.hp<=0;
    const image=imagePath(u.imageId);
    const isActive=u.id===activeId;

    let badge='';

    if(isActive){
      badge=isEnemy
        ?'<div class="turn-badge">敵の行動予告</div>'
        :'<div class="turn-badge">★ 行動権あり ★</div>';
    }

    return `
      <div
        class="battle-character
          ${isEnemy?'enemy':'ally'}
          ${dead?'dead':''}
          ${u.hit?'hit-animation':''}
          ${isActive?'turn-active':''}"
        data-unit-id="${esc(u.id)}"
      >
        ${badge}

        <div class="battle-image">
          <img src="${image}"
            alt="${esc(u.name)}"
            onerror="this.style.display='none'">
        </div>

        ${u.effectText?`
          <div class="effect-pop effect-${esc(u.effectKind)}">
            ${esc(u.effectText)}
          </div>
        `:''}

        <div class="battle-name">${esc(u.name)}</div>

        ${isEnemy&&u.strengthLabel?`
          <div class="small">強化：${esc(u.strengthLabel)}</div>
        `:''}

        <div class="battle-hp-text">
          HP ${Math.max(0,u.hp)} / ${u.maxHp}
        </div>

        <div class="hpbar">
          <i style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></i>
        </div>

        ${!isEnemy?`
          <div class="small">
            通常攻撃回数：${u.actions}/${u.charge||'—'}
          </div>
          ${u.charge===0?'<div class="small">スキル使用可能</div>':''}
        `:''}
      </div>
    `;
  };

  document.getElementById('allyUnits').innerHTML=
    battle.allies.map(unitHTML).join('');

  document.getElementById('enemyUnits').innerHTML=
    battle.enemies.map(unitHTML).join('');

  const enemyHeading=document.getElementById('enemyHeading');

  enemyHeading.textContent=battle.isBoss
    ?'▼ 敵軍　👑 BOSS BATTLE'
    :'▼ 敵軍';

  const active=battle.allies.find(a=>a.id===battle.readyActor);

  let actionContent='';

  if(battle.over){
    actionContent=`
      <div class="battle-result">
        <h3>${battle.resultWin?'勝利！':'敗北……'}</h3>

        <p>
          ${battle.resultWin
            ?`ステージ ${battle.stage} クリア！報酬を獲得した。`
            :'旅団は敗北した。編成を見直して再挑戦しよう。'}
        </p>

        ${battle.resultWin?'<p>🪙100　💎40を獲得！</p>':''}

        ${battle.resultWin&&battle.isBoss
          ?'<p style="color:#ffcf83;font-weight:900">👑 ボスステージ突破！</p>'
          :''
        }

        <button data-action="returnMap">
          ステージ一覧に戻る
        </button>

        <button data-action="startBattle">
          もう一度挑戦
        </button>
      </div>
    `;

  }else if(battle.pendingEnemy){
    const p=battle.pendingEnemy;

    actionContent=`
      <div class="enemy-preview">
        <div class="preview-title">⚠ 敵の行動予告</div>

        <div class="preview-detail">
          <b>${esc(p.actorName)}</b> が行動する！<br>
          行動内容：<b>${esc(p.actionName)}</b><br>
          攻撃対象：<b>${esc(p.targetName)}</b>
        </div>

        <div class="preview-wait">
          敵が攻撃を準備している……（約1.1秒）
        </div>
      </div>
    `;

  }else if(active){
    const skillReady=
      active.charge===0||
      active.actions>=active.charge;

    actionContent=`
      <div class="action-title">
        ★ ${esc(active.name)} が行動権を獲得！
      </div>

      <div class="action-character">
        <div class="name">${esc(active.name)}</div>

        <div class="small">
          攻撃力：${active.atk}<br>
          スキル：${esc(active.skill)}
        </div>

        ${active.charge>0?`
          <div class="small">
            スキル準備：${active.actions}/${active.charge} 回
          </div>

          <div class="gaugebar">
            <i style="width:${Math.min(100,active.actions/active.charge*100)}%"></i>
          </div>
        `:`
          <div class="small">スキルはいつでも使用可能</div>
        `}
      </div>

      <div class="action-buttons">
        <button class="attack-button"
          data-action="attack"
          data-id="${esc(active.id)}">
          通常攻撃
        </button>

        <button class="skill-button"
          data-action="skill"
          data-id="${esc(active.id)}"
          ${!skillReady?'disabled':''}>
          ${esc(active.skill)}
          ${!skillReady
            ?'（あと'+(active.charge-active.actions)+'回）'
            :''
          }
        </button>
      </div>
    `;

  }else{
    actionContent='<div class="muted">次の行動順を計算中...</div>';
  }

  document.getElementById('actionArea').innerHTML=actionContent;
}

function handleClick(e){
  const page=e.target.closest('[data-page]');

  if(page){
    showPage(page.dataset.page);
    return;
  }

  const b=e.target.closest('[data-action]');

  if(!b||b.disabled)return;

  const a=b.dataset.action;
  const id=b.dataset.id;

  if(a==='summon'){
    summon(Number(b.dataset.count));

  }else if(a==='toggleParty'){
    toggleParty(id);

  }else if(a==='selectStage'){
    selectStage(Number(b.dataset.stage));

  }else if(a==='startBattle'){
    startBattle();

  }else if(a==='returnMap'){
    if(battle&&!battle.over)return;

    showPage('battle');

    document.getElementById('battleArea').style.display='none';

  }else if(a==='attack'){
    playerAction(id,false);

  }else if(a==='skill'){
    playerAction(id,true);
  }
}

document.addEventListener('click',handleClick);

renderAll();
</script>
