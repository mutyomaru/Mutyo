
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星詠みの旅団</title>
<style>
:root{
  --bg:#101525;--panel:#1b2540;--panel2:#263453;
  --gold:#f4c76b;--text:#f4f5fb;--muted:#aab4ca;
  --line:#394866;--red:#e87979;--green:#76d6a1
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at top,#202d4c 0,#101525 55%);
  color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  min-height:100vh
}
button{
  font:inherit;color:inherit;border:1px solid #62708e;
  background:linear-gradient(180deg,#354666,#263453);
  border-radius:12px;padding:11px 14px;cursor:pointer
}
button:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:900px;margin:auto;padding:14px}
.top{
  display:flex;justify-content:space-between;gap:12px;
  align-items:center;flex-wrap:wrap;padding:12px 4px
}
.brand{font-weight:900;color:var(--gold);font-size:22px}
.resources{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  background:#202c46;border:1px solid var(--line);
  padding:7px 11px;border-radius:999px;font-size:14px
}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 16px}
.nav button{min-height:48px}
.page{display:none}
.page.active{display:block}
.panel{
  background:linear-gradient(145deg,#1d2945,#172139);
  border:1px solid var(--line);border-radius:18px;
  padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #0003
}
.hero{text-align:center;padding:28px 16px}
.hero h1{color:var(--gold);font-size:28px;margin:0 0 8px}
.muted{color:var(--muted)}
.section-title{font-size:20px;color:var(--gold);margin:0 0 12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.card{background:#202d49;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.card.selected{border:2px solid var(--gold);padding:10px}
.portrait{height:100px;display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:6px}
.portrait img{max-height:100%;max-width:100%;object-fit:contain}
.name{font-weight:800}
.small{font-size:12px;color:var(--muted)}
.stats{font-size:13px;line-height:1.7;margin:6px 0}
.normal{color:#cbd5e1}
.rare{color:#74b8ff}
.epic{color:#d9a0ff}
.wide{width:100%}
.result{line-height:1.8;min-height:40px;margin-top:12px}
.bar{height:9px;background:#101827;border-radius:9px;overflow:hidden;margin:5px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5aa5ff,#9e8cff)}
.error{
  display:none;background:#542d36;border:1px solid #b65d6a;
  padding:10px;border-radius:10px;margin:8px 0;white-space:pre-wrap
}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:14px}

/* ===== 戦闘画面 ===== */
#battleArea{
  padding:12px;
  overflow:hidden
}
.battle-field{
  display:flex;
  flex-direction:column;
  gap:12px
}
.battle-side-title{
  text-align:center;
  font-size:14px;
  font-weight:900;
  letter-spacing:3px;
  margin:4px 0 8px
}
.enemy-title{color:#ff9b9b}
.ally-title{color:#8fcaff}
.battle-units{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px
}
.battle-unit{
  position:relative;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:5px;
  background:linear-gradient(180deg,#263653,#19243b);
  border:1px solid #465777;
  border-radius:14px;
  overflow:hidden;
  transition:opacity .2s,filter .2s
}
.battle-unit.dead{
  opacity:.35;
  filter:grayscale(1)
}
.battle-unit .portrait{
  width:100%;
  height:clamp(105px,29vw,190px);
  margin:0 0 5px;
  position:relative;
  z-index:1
}
.battle-unit .portrait img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 5px 8px #0008)
}
.hpbar{
  width:100%;
  height:11px;
  background:#0b1220;
  border:1px solid #52617b;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  z-index:2
}
.hpbar i{
  display:block;
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#39bd79,#8ae8a7);
  border-radius:20px;
  transition:width .35s
}
.battle-unit.enemy-unit .hpbar i{
  background:linear-gradient(90deg,#d94e5b,#ff9a9a)
}
.battle-vs{
  text-align:center;
  font-weight:1000;
  font-size:18px;
  color:var(--gold);
  letter-spacing:5px;
  padding:2px 0
}
.battle-divider{
  height:1px;
  background:linear-gradient(90deg,transparent,#526486,transparent);
  margin:3px 0
}
#actionArea{
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid var(--line)
}
.action-heading{
  text-align:center;
  color:var(--gold);
  font-weight:900;
  margin-bottom:10px
}
.action-card{
  background:#202d49;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  margin:8px 0
}
.action-card .row button{flex:1;min-width:110px}
.battle-fx{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(20px,6vw,34px);
  font-weight:1000;
  pointer-events:none;
  text-shadow:0 3px 5px #000,0 0 12px currentColor;
  animation:fxFloat .95s ease-out forwards;
  white-space:nowrap
}
.battle-fx.damage{color:#ff555e}
.battle-fx.heal{color:#65ff9b}
.battle-fx.buff{color:#d6a0ff}
.battle-fx.evade{color:#8deaff}
.battle-fx.guard{color:#9dbbff}
.battle-unit.fx-damage{animation:unitShake .32s}
.battle-unit.fx-heal{box-shadow:inset 0 0 22px #39ff8b88}
.battle-unit.fx-buff{box-shadow:inset 0 0 24px #bd70ff99}
.battle-unit.fx-evade{box-shadow:inset 0 0 20px #65eaff88}
.battle-unit.fx-guard{box-shadow:inset 0 0 20px #699dff88}
.battle-result{
  text-align:center;
  padding:14px 8px;
  font-weight:900;
  color:var(--gold)
}
@keyframes fxFloat{
  0%{opacity:0;transform:translateY(18px) scale(.65)}
  18%{opacity:1;transform:translateY(0) scale(1.2)}
  75%{opacity:1;transform:translateY(-22px) scale(1)}
  100%{opacity:0;transform:translateY(-45px) scale(.9)}
}
@keyframes unitShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

@media(max-width:520px){
  .wrap{padding:8px}
  .top{gap:7px}
  .brand{font-size:19px}
  .resources{gap:5px}
  .pill{font-size:12px;padding:6px 8px}
  .nav{grid-template-columns:repeat(2,1fr);gap:6px}
  .nav button{min-height:43px;padding:8px}
  .hero h1{font-size:24px}
  .panel{padding:11px;border-radius:15px}
  #battleArea{padding:8px}
  .battle-units{gap:5px}
  .battle-unit{padding:3px;border-radius:11px}
  .battle-unit .portrait{height:clamp(105px,34vw,155px)}
  .hpbar{height:9px}
  .battle-side-title{margin:3px 0 6px}
  .battle-field{gap:8px}
  .action-card{padding:9px}
  .action-card .row{gap:6px}
  .action-card .row button{font-size:13px;padding:10px 5px}
}
</style>
</head>

<body>
<div class="wrap">

<header class="top">
  <div class="brand">✦ 星詠みの旅団</div>
  <div class="resources">
    <span class="pill">💎 <b id="gems">0</b></span>
    <span class="pill">🪙 <b id="gold">0</b></span>
    <span class="pill">到達ステージ <b id="stage">1</b></span>
  </div>
</header>

<div id="errorBox" class="error"></div>

<nav class="nav">
  <button data-page="home">ホーム</button>
  <button data-page="gacha">ガチャ</button>
  <button data-page="team">編成・図鑑</button>
  <button data-page="battle">戦闘</button>
  <button data-page="shop">ショップ</button>
</nav>

<main>

<section id="home" class="page active">
  <div class="panel hero">
    <h1>星の導きが、旅の始まり</h1>
    <p class="muted">仲間を集め、育て、未知の敵に挑もう。</p>
    <div class="row" style="justify-content:center">
      <button data-page="gacha">仲間を召喚する</button>
      <button data-page="team">編成を確認する</button>
      <button data-page="battle">冒険に出る</button>
    </div>
  </div>
  <div class="panel">
    <h2 class="section-title">旅団の状況</h2>
    <div id="homeSummary"></div>
  </div>
</section>

<section id="gacha" class="page">
  <div class="panel">
    <h2 class="section-title">星詠み召喚</h2>
    <p>ノーマル 70% / レア 25% / エピック 5%</p>
    <div class="row">
      <button data-action="summon" data-count="1">1回召喚（💎100）</button>
      <button data-action="summon" data-count="10">10回召喚（💎900）</button>
    </div>
    <div id="gachaResult" class="result muted">召喚結果がここに表示されます。</div>
  </div>
  <div class="panel">
    <h2 class="section-title">所持状況</h2>
    <div id="gachaOwned" class="small"></div>
  </div>
</section>

<section id="team" class="page">
  <div class="panel">
    <h2 class="section-title">パーティ編成</h2>
    <p class="muted">所持キャラクターを選択して最大3人まで編成できます。</p>
    <div id="partyView" class="grid"></div>
  </div>
  <div class="panel">
    <h2 class="section-title">キャラクター図鑑</h2>
    <div id="characterList" class="grid"></div>
  </div>
</section>

<section id="shop" class="page">
  <div class="panel">
    <h2 class="section-title">ショップ</h2>
    <p>ショップは準備中です。</p>
  </div>
</section>

<section id="battle" class="page">
  <div class="panel">
    <h2 class="section-title">冒険・戦闘</h2>
    <div id="battleIntro"></div>
    <div class="row">
      <button data-action="startBattle">戦闘開始</button>
    </div>
  </div>

  <div id="battleArea" class="panel" style="display:none">
    <div class="battle-field">
      <div>
        <div class="battle-side-title enemy-title">ENEMY</div>
        <div id="enemyUnits" class="battle-units"></div>
      </div>

      <div class="battle-vs">VS</div>
      <div class="battle-divider"></div>

      <div>
        <div class="battle-side-title ally-title">YOUR PARTY</div>
        <div id="allyUnits" class="battle-units"></div>
      </div>
    </div>

    <div id="actionArea"></div>
  </div>
</section>

</main>

<div class="footer">星詠みの旅団</div>
</div>

<script>
'use strict';

const KEY='hoshiyomi_save_v2';

const CHARACTERS=[
{id:'swordman',imageFile:'Swordman.png',name:'剣士',rarity:'ノーマル',hp:100,atk:20,speed:20,charge:3,skill:'強撃',effect:'damage',power:50,target:'one',growth:.07,max:20},
{id:'archer',imageFile:'Archer.png',name:'アーチャー',rarity:'ノーマル',hp:70,atk:10,speed:16,charge:2,skill:'乱射',effect:'damage',power:10,target:'all',growth:.07,max:20},
{id:'axeman',imageFile:'Axeman.png',name:'アックスマン',rarity:'ノーマル',hp:130,atk:30,speed:9,charge:4,skill:'叩き割り',effect:'damage',power:70,target:'one',growth:.06,max:20},
{id:'spearman',imageFile:'Spearman.png',name:'スピアマン',rarity:'ノーマル',hp:100,atk:10,speed:20,charge:6,skill:'致命突き',effect:'damage',power:150,target:'one',growth:.07,max:20},
{id:'goblin',imageFile:'Goblin.png',name:'ゴブリン',rarity:'ノーマル',hp:70,atk:20,speed:25,charge:5,skill:'回避',effect:'evade',power:80,target:'self',growth:.08,max:20},
{id:'miner',imageFile:'Miner.png',name:'鉱夫',rarity:'ノーマル',hp:140,atk:10,speed:14,charge:3,skill:'ガード',effect:'guard',power:70,target:'self',growth:.07,max:20},
{id:'zombie',imageFile:'Zombie.png',name:'ゾンビ',rarity:'ノーマル',hp:50,atk:50,speed:12,charge:3,skill:'噛みつき',effect:'poison',power:50,target:'one',growth:.07,max:20},
{id:'farmer',imageFile:'Farmer.png',name:'農夫',rarity:'ノーマル',hp:110,atk:20,speed:15,charge:3,skill:'ランダム回復',effect:'heal',power:20,target:'ally',growth:.07,max:20},

{id:'魔導士',imageFile:'魔導士.png',name:'魔導士',rarity:'レア',hp:100,atk:30,speed:21,charge:0,skill:'力の魔術',effect:'buffAlly',power:50,target:'ally',growth:.16,max:10},
{id:'将軍',imageFile:'将軍.png',name:'将軍',rarity:'レア',hp:150,atk:40,speed:23,charge:2,skill:'薙ぎ払い',effect:'damage',power:30,target:'all',growth:.16,max:10},
{id:'ゴーレム',imageFile:'ゴーレム.png',name:'ゴーレム',rarity:'レア',hp:210,atk:40,speed:7,charge:8,skill:'大地砕き',effect:'damage',power:100,target:'all',growth:.16,max:10},
{id:'ドワーフ',imageFile:'ドワーフ.png',name:'ドワーフ',rarity:'レア',hp:170,atk:30,speed:15,charge:5,skill:'職人の心得',effect:'buffSelf',power:25,target:'self',growth:.16,max:10},
{id:'エルフ',imageFile:'エルフ.png',name:'エルフ',rarity:'レア',hp:100,atk:10,speed:24,charge:1,skill:'癒しのオーラ',effect:'healPercent',power:15,target:'ally',growth:.16,max:10},
{id:'アサシン',imageFile:'アサシン.png',name:'アサシン',rarity:'レア',hp:70,atk:70,speed:29,charge:2,skill:'回避',effect:'evadeSure',power:100,target:'self',growth:.16,max:10},

{id:'鍛錬剣士',imageFile:'鍛錬剣士.png',name:'果てしなき鍛錬剣士',rarity:'エピック',hp:200,atk:40,speed:22,charge:2,skill:'乱舞',effect:'damage',power:40,target:'all',growth:.30,max:6,passive:'アルティメットカウンター'},
{id:'狙撃手アーチャー',imageFile:'狙撃手アーチャー.png',name:'戦場の狙撃手アーチャー',rarity:'エピック',hp:160,atk:80,speed:19,charge:4,skill:'正射必中',effect:'damage',power:160,target:'one',growth:.30,max:6,passive:'アタックセレクト'},
{id:'一閃スピアドン',imageFile:'一閃スピアドン.png',name:'紫電一閃スピアドン',rarity:'エピック',hp:200,atk:30,speed:24,charge:5,skill:'致命のひと突き',effect:'damage',power:300,target:'one',growth:.30,max:6,passive:'ウィルパワー'}
];

const byId=id=>CHARACTERS.find(c=>c.id===id);

function fresh(){
  return {
    gems:500,gold:300,stage:1,
    owned:{
      swordman:{level:1,dupes:0},
      archer:{level:1,dupes:0},
      spearman:{level:1,dupes:0}
    },
    party:['swordman','archer','spearman']
  };
}

function loadState(){
  let raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}

  const d=fresh();
  if(!raw||typeof raw!=='object')return d;

  const s={...d,...raw};
  s.gems=Number.isFinite(+s.gems)?Math.max(0,+s.gems):d.gems;
  s.gold=Number.isFinite(+s.gold)?Math.max(0,+s.gold):d.gold;
  s.stage=Number.isFinite(+s.stage)?Math.max(1,+s.stage):1;
  s.owned=raw.owned&&typeof raw.owned==='object'?raw.owned:{};

  for(const [id,v] of Object.entries(s.owned)){
    if(!byId(id)||!v||typeof v!=='object'){
      delete s.owned[id];continue;
    }
    v.level=Math.min(byId(id).max,Math.max(1,Number(v.level)||1));
    v.dupes=Math.max(0,Number(v.dupes)||0);
  }

  for(const id of Object.keys(d.owned)){
    if(!s.owned[id])s.owned[id]={...d.owned[id]};
  }

  s.party=Array.isArray(raw.party)
    ?raw.party.filter((id,i,a)=>byId(id)&&s.owned[id]&&a.indexOf(id)===i).slice(0,3)
    :d.party.slice();

  if(!s.party.length)s.party=d.party.filter(id=>s.owned[id]);
  return s;
}

let state=loadState();
let battle=null;
let busy=false;

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){
    showError('セーブを保存できませんでした。ブラウザの保存容量・設定を確認してください。');
  }
  renderAll();
}

function showError(msg){
  const el=document.getElementById('errorBox');
  if(el){el.textContent=msg;el.style.display='block'}
}

window.addEventListener('error',e=>{
  showError('ゲーム内でエラーが発生しました: '+e.message);
});

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function imagePath(id){
  const c=byId(id);
  const file=c?.imageFile||id+'.png';
  return './images/'+encodeURIComponent(file);
}

function portrait(id){
  const c=byId(id);
  return `<div class="portrait"><img src="${imagePath(id)}" alt="${esc(c?.name||id)}" onerror="this.style.display='none'"></div>`;
}

function stats(c,o){
  const lv=o?.level||1;
  const mul=Math.pow(1+c.growth,lv-1);
  return {
    hp:Math.round(c.hp*mul),
    atk:Math.round(c.atk*mul),
    power:Math.round(c.power*mul),
    speed:c.speed
  };
}

function rarityClass(r){
  return r==='エピック'?'epic':r==='レア'?'rare':'normal';
}

function cardHTML(id,selectable=false){
  const c=byId(id);
  const o=state.owned[id];
  if(!c)return '';

  const st=stats(c,o);
  const selected=state.party.includes(id);

  return `
    <article class="card ${selectable&&selected?'selected':''}">
      ${portrait(id)}
      <div class="name">${esc(c.name)}</div>
      <div class="small ${rarityClass(c.rarity)}">${c.rarity} / Lv.${o?.level||1}</div>
      <div class="stats">
        HP ${st.hp}　攻撃 ${st.atk}<br>
        素早さ ${st.speed}<br>
        スキル：${esc(c.skill)}
        ${c.passive?'<br>特性：'+esc(c.passive):''}
      </div>
      ${selectable?`<button class="wide" data-action="toggleParty" data-id="${esc(id)}">${selected?'編成から外す':'編成に加える'}</button>`:''}
    </article>
  `;
}

function renderAll(){
  document.getElementById('gems').textContent=state.gems;
  document.getElementById('gold').textContent=state.gold;
  document.getElementById('stage').textContent=state.stage;

  document.getElementById('homeSummary').innerHTML=
    `所持キャラクター：${Object.keys(state.owned).length}体<br>
    編成中：${state.party.map(id=>esc(byId(id)?.name||id)).join(' / ')||'なし'}<br>
    次の冒険：ステージ ${state.stage}`;

  document.getElementById('gachaOwned').textContent=
    `${Object.keys(state.owned).length} / ${CHARACTERS.length}体を所持`;

  document.getElementById('partyView').innerHTML=
    state.party.map(id=>cardHTML(id)).join('')||
    '<p class="muted">編成がありません。</p>';

  document.getElementById('characterList').innerHTML=
    CHARACTERS.map(c=>
      state.owned[c.id]
        ?cardHTML(c.id,true)
        :`<article class="card">
            <div class="portrait">🔒</div>
            <div class="name">？？？</div>
            <div class="small">${c.rarity}</div>
            <div class="stats">未獲得</div>
          </article>`
    ).join('');

  document.getElementById('battleIntro').innerHTML=
    `現在のステージ：<b>${state.stage}</b><br>
    <span class="muted">編成：${state.party.map(id=>esc(byId(id)?.name||id)).join(' / ')||'なし'}</span>`;
}

function showPage(name){
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.toggle('active',p.id===name);
  });
  if(name==='battle')renderBattle();
  window.scrollTo(0,0);
}

function summon(count){
  const cost=count===10?900:100;

  if(state.gems<cost){
    document.getElementById('gachaResult').textContent='💎が足りません。';
    return;
  }

  state.gems-=cost;
  const results=[];

  for(let i=0;i<count;i++){
    const roll=Math.random()*100;

    const pool=CHARACTERS.filter(c=>
      roll<5?c.rarity==='エピック':
      roll<30?c.rarity==='レア':
      c.rarity==='ノーマル'
    );

    const c=pool[Math.floor(Math.random()*pool.length)];

    if(!state.owned[c.id]){
      state.owned[c.id]={level:1,dupes:0};
      results.push(`<span class="${rarityClass(c.rarity)}">${esc(c.name)}（初獲得）</span>`);
    }else{
      const o=state.owned[c.id];
      o.dupes=(o.dupes||0)+1;

      if(o.level<c.max&&o.dupes>=o.level){
        o.dupes=0;o.level++;
        results.push(`${esc(c.name)}：Lv.${o.level}に成長！`);
      }else if(o.level>=c.max){
        o.dupes=0;state.gold+=50;
        results.push(`${esc(c.name)}：最大Lvのため🪙50獲得`);
      }else{
        results.push(`${esc(c.name)}：重複 ${o.dupes}/${o.level}`);
      }
    }
  }

  document.getElementById('gachaResult').innerHTML=results.join('<br>');
  save();
}

function toggleParty(id){
  if(!state.owned[id])return;

  const i=state.party.indexOf(id);
  if(i>=0)state.party.splice(i,1);
  else if(state.party.length<3)state.party.push(id);
  else{
    showError('編成できるのは3人までです。');
    return;
  }
  save();
}

function makeUnit(id,side){
  const c=byId(id);
  const o=state.owned[id]||{level:1};
  const st=stats(c,o);

  return {
    id,uid:side+'-'+id,side,name:c.name,
    hp:st.hp,maxHp:st.hp,atk:st.atk,speed:st.speed,
    gauge:0,charge:c.charge,actions:0,
    skill:c.skill,effect:c.effect,power:st.power,
    target:c.target,passive:c.passive,
    guard:false,evade:0,poison:0,buff:1,
    alive:true,fx:null
  };
}

/* 敵も既存キャラクター画像から選ぶ */
function makeEnemy(i){
  const enemyIds=['goblin','zombie','axeman','miner','将軍','ゴーレム','アサシン'];
  const id=enemyIds[(state.stage-1+i)%enemyIds.length];
  const c=byId(id);
  const base=stats(c,{level:1});
  const scale=1+(state.stage-1)*.12+i*.08;
  const hp=Math.round(base.hp*scale);

  return {
    id,uid:'enemy-'+i,side:'enemy',
    name:c.name,
    hp,maxHp:hp,
    atk:Math.round(base.atk*scale),
    speed:base.speed,
    gauge:0,alive:true,
    guard:false,evade:0,poison:0,buff:1,
    fx:null
  };
}

function alive(arr){
  return arr.filter(x=>x.alive&&x.hp>0);
}

function showBattleEffect(unit,text,type){
  if(!battle||!unit)return;

  unit.fx={text,type,stamp:Date.now()};
  const uid=unit.uid;

  setTimeout(()=>{
    if(!battle)return;
    const current=[...battle.allies,...battle.enemies].find(u=>u.uid===uid);
    if(current&&current.fx&&current.fx.stamp===unit.fx?.stamp){
      current.fx=null;
      renderBattle();
    }
  },950);

  renderBattle();
}

function chooseEnemy(){
  return alive(battle.enemies).sort((a,b)=>a.hp-b.hp)[0];
}

function chooseAlly(){
  return alive(battle.allies).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
}

function startBattle(){
  if(busy)return;

  if(!state.party.length){
    showError('先に編成を3人以内で設定してください。');
    return;
  }

  battle={
    turn:0,
    over:false,
    readyActor:null,
    allies:state.party.map(id=>makeUnit(id,'ally')),
    enemies:[
      makeEnemy(0),
      makeEnemy(1),
      ...(state.stage>=3?[makeEnemy(2)]:[])
    ]
  };

  busy=false;
  showPage('battle');
  advanceBattle();
}

/* ダメージ処理 */
function deal(attacker,target,amount){
  if(!target||!target.alive)return 0;

  if(target.evade>0){
    target.evade=0;
    showBattleEffect(target,'回避！','evade');
    return 0;
  }

  let dmg=Math.max(1,Math.round(amount));

  if(target.guard){
    dmg=Math.max(1,Math.round(dmg*.3));
    target.guard=false;
    showBattleEffect(target,'防御！','guard');
  }

  target.hp=Math.max(0,target.hp-dmg);
  showBattleEffect(target,'-'+dmg,'damage');

  if(target.hp<=0)target.alive=false;
  return dmg;
}

function performAlly(actor,useSkill){
  const c=byId(actor.id);
  if(!c)return;

  if(useSkill){
    if(actor.charge>0&&actor.actions<actor.charge)return;

    actor.actions=0;

    if(actor.effect==='damage'){
      const targets=actor.target==='all'
        ?alive(battle.enemies)
        :[chooseEnemy()];

      targets.forEach(t=>{
        if(t)deal(actor,t,actor.power);
      });

    }else if(actor.effect==='evade'||actor.effect==='evadeSure'){
      actor.evade=1;
      showBattleEffect(actor,'回避準備','evade');

    }else if(actor.effect==='guard'){
      actor.guard=true;
      showBattleEffect(actor,'防御UP','guard');

    }else if(actor.effect==='poison'){
      const t=chooseEnemy();
      if(t){
        deal(actor,t,actor.power);
        t.poison=3;
      }

    }else if(actor.effect==='heal'||actor.effect==='healPercent'){
      const allies=alive(battle.allies);

      const t=actor.effect==='heal'
        ?allies[Math.floor(Math.random()*allies.length)]
        :chooseAlly();

      if(t){
        const amount=actor.effect==='healPercent'
          ?Math.round(t.maxHp*actor.power/100)
          :actor.power;

        const actual=Math.min(amount,t.maxHp-t.hp);
        t.hp=Math.min(t.maxHp,t.hp+amount);

        if(actual>0)showBattleEffect(t,'+'+actual,'heal');
      }

    }else if(actor.effect==='buffSelf'){
      actor.buff+=actor.power/100;
      showBattleEffect(actor,'攻撃力UP','buff');

    }else if(actor.effect==='buffAlly'){
      const t=chooseAlly();
      if(t){
        t.buff+=actor.power/100;
        showBattleEffect(t,'攻撃力UP','buff');
      }
    }

  }else{
    actor.actions++;
    const t=chooseEnemy();
    if(t)deal(actor,t,actor.atk*actor.buff);
  }

  if(actor.passive==='ウィルパワー'){
    actor.atk+=Math.max(1,Math.round(actor.atk*.1));
    showBattleEffect(actor,'攻撃力UP','buff');
  }

  if(actor.passive==='アルティメットカウンター'){
    actor.counter=true;
  }
}

function enemyAct(e){
  const t=chooseAlly();
  if(!t)return;

  const dmg=deal(e,t,e.atk*e.buff);

  if(t.passive==='アルティメットカウンター'&&Math.random()<.2){
    const reflected=Math.round(dmg*2);
    e.hp=Math.max(0,e.hp-reflected);
    showBattleEffect(e,'-'+reflected,'damage');
    if(e.hp===0)e.alive=false;
  }
}

function advanceBattle(){
  if(!battle||battle.over||busy)return;

  let guard=0;

  while(!battle.readyActor&&guard++<100){
    if(alive(battle.enemies).length===0){
      finishBattle(true);return;
    }
    if(alive(battle.allies).length===0){
      finishBattle(false);return;
    }

    const units=[...alive(battle.allies),...alive(battle.enemies)];
    units.forEach(u=>u.gauge+=u.speed);

    const ready=units
      .filter(u=>u.gauge>=100)
      .sort((a,b)=>
        b.gauge-a.gauge||
        (a.side===b.side?0:(a.side==='ally'?-1:1))
      );

    if(!ready.length)continue;

    const actor=ready[0];
    actor.gauge-=100;

    if(actor.side==='ally'){
      battle.readyActor=actor.id;
      renderBattle();
      return;
    }

    enemyAct(actor);

    for(const e of alive(battle.enemies)){
      if(e.poison>0){
        e.hp=Math.max(0,e.hp-8);
        e.poison--;
        showBattleEffect(e,'-8','damage');
        if(e.hp===0)e.alive=false;
      }
    }
  }

  renderBattle();
}

function playerAction(id,skill){
  if(!battle||battle.over||busy||battle.readyActor!==id)return;

  const actor=battle.allies.find(x=>x.id===id&&x.alive);
  if(!actor)return;

  if(skill&&actor.charge>0&&actor.actions<actor.charge)return;

  busy=true;
  performAlly(actor,skill);
  battle.readyActor=null;

  if(alive(battle.enemies).length===0){
    finishBattle(true);
    busy=false;
    return;
  }

  if(alive(battle.allies).length===0){
    finishBattle(false);
    busy=false;
    return;
  }

  busy=false;
  advanceBattle();
}

function finishBattle(win){
  battle.over=true;

  if(win){
    state.gold+=100;
    state.gems+=40;
    state.stage++;
  }

  save();
  renderBattle();
}

function renderBattle(){
  const area=document.getElementById('battleArea');

  if(!battle){
    area.style.display='none';
    document.getElementById('battleIntro').textContent=
      `ステージ${state.stage}に挑戦できます。`;
    return;
  }

  area.style.display='block';

  const unitHTML=u=>{
    const fx=u.fx;
    const fxClass=fx?'fx-'+fx.type:'';
    const deadClass=(!u.alive||u.hp<=0)?'dead':'';
    const hpPercent=Math.max(0,Math.min(100,u.hp/u.maxHp*100));

    return `
      <div class="battle-unit ${u.side==='enemy'?'enemy-unit':''} ${deadClass} ${fxClass}">
        <div class="portrait">
          <img src="${imagePath(u.id)}"
               alt="${esc(u.name)}"
               onerror="this.style.display='none'">
        </div>
        <div class="hpbar">
          <i style="width:${hpPercent}%"></i>
        </div>
        ${fx?`<div class="battle-fx ${fx.type}">${esc(fx.text)}</div>`:''}
      </div>
    `;
  };

  document.getElementById('allyUnits').innerHTML=
    battle.allies.map(unitHTML).join('');

  document.getElementById('enemyUnits').innerHTML=
    battle.enemies.map(unitHTML).join('');

  const active=battle.allies.find(a=>a.id===battle.readyActor);

  const actions=active?`
    <div class="action-heading">✦ ${esc(active.name)} の行動 ✦</div>
    <div class="action-card">
      <div class="small">
        通常行動回数：${active.actions}/${active.charge||'—'}
      </div>
      <div class="row" style="margin-top:9px">
        <button data-action="attack" data-id="${esc(active.id)}">
          通常攻撃
        </button>
        <button data-action="skill" data-id="${esc(active.id)}"
          ${(active.charge>0&&active.actions<active.charge)?'disabled':''}>
          ${esc(active.skill)}
          ${active.charge>0?'（'+Math.max(0,active.charge-active.actions)+'回）':''}
        </button>
      </div>
    </div>
  `:'';

  document.getElementById('actionArea').innerHTML=
    battle.over
      ?`<div class="battle-result">
          ${alive(battle.enemies).length===0?'✦ 戦闘勝利！ ✦':'戦闘終了'}
          <div style="margin-top:12px">
            <button data-action="startBattle">もう一度挑戦</button>
          </div>
        </div>`
      :(active?actions:'<div class="muted" style="text-align:center;padding:12px">行動順を計算中...</div>');
}

function handleClick(e){
  const page=e.target.closest('[data-page]');

  if(page){
    showPage(page.dataset.page);
    return;
  }

  const b=e.target.closest('[data-action]');
  if(!b||b.disabled)return;

  const a=b.dataset.action;
  const id=b.dataset.id;

  if(a==='summon'){
    summon(Number(b.dataset.count));
  }else if(a==='toggleParty'){
    toggleParty(id);
  }else if(a==='startBattle'){
    startBattle();
  }else if(a==='attack'){
    playerAction(id,false);
  }else if(a==='skill'){
    playerAction(id,true);
  }
}

document.addEventListener('click',handleClick);

renderAll();
</script>
</body>
