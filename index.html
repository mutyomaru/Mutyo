<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星詠みの旅団</title>
<style>
:root{--bg:#101525;--panel:#1b2540;--gold:#f4c76b;--text:#f4f5fb;--muted:#aab4ca;--line:#394866}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;color:var(--text);background:radial-gradient(ellipse at top,#202d4c,#101525 60%);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
button{font:inherit;color:inherit;border:1px solid #62708e;background:linear-gradient(#354666,#263453);border-radius:11px;padding:10px 12px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
.wrap{max-width:900px;margin:auto;padding:10px}.row,.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;padding:8px 0}
.brand,.section-title{color:var(--gold);font-weight:900}.brand{font-size:21px}.pill{background:#202c46;border:1px solid var(--line);padding:5px 9px;border-radius:25px}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:8px 0 12px}.nav button{padding:10px 2px;font-size:clamp(10px,2.5vw,14px)}
.page{display:none}.page.active{display:block}.panel{background:linear-gradient(145deg,#1d2945,#172139);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}
.hero{text-align:center;padding:20px}.hero h1{font-size:clamp(20px,5vw,30px);color:var(--gold)}.section-title{font-size:19px;margin:0 0 9px}.muted,.small{color:var(--muted)}.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{position:relative;min-width:0;background:#202d49;border:1px solid var(--line);border-radius:12px;padding:8px 7px 39px}.card.selected{outline:2px solid var(--gold)}
.portrait{height:100px;display:flex;align-items:center;justify-content:center;font-size:42px}.portrait img{display:block;max-width:100%;max-height:100%;object-fit:contain}.name{font-weight:900;overflow-wrap:anywhere}.stats{font-size:12px;line-height:1.6;margin:5px 0}
.normal{color:#cbd5e1}.rare{color:#74b8ff}.epic{color:#d9a0ff}.wide{width:100%}
.plus{position:absolute;bottom:5px;right:5px;width:28px;height:28px;padding:0;border-radius:8px;color:#ffe5a0;border-color:#b99550;background:#58472d;font-size:20px}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:#050914ed;align-items:center;justify-content:center;padding:12px}.modal.active{display:flex}
.modal-box{width:100%;max-width:460px;max-height:90dvh;overflow:auto;background:linear-gradient(#263653,#151f34);border:1px solid #7185a8;border-radius:16px;padding:15px}
.slots,.stock{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.slot{min-height:65px;background:#111b30;border:1px solid #465779;border-radius:10px;padding:8px;text-align:center}.slot.empty{border-style:dashed}
.stock{grid-template-columns:repeat(3,1fr);margin:10px 0}.stock>div{background:#111b30;border-radius:9px;padding:8px 3px;text-align:center;font-size:12px}.choice{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin:8px 0}
/* 図鑑：各レア度9体、画像を最優先にした一貫したCSS */
.dex-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:8px}.dex-tabs button{padding:8px 2px;font-size:12px}.dex-tabs .selected{border:2px solid var(--gold);color:var(--gold);background:#354666}
.dex-pages{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 0}.dex-pages span{font-weight:900;color:var(--gold)}
#characterList{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:stretch}
.encyclopedia-card{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;background:#202d49;border:1px solid var(--line);border-radius:10px;padding:4px 3px 32px;overflow:hidden}
.encyclopedia-image{width:100%;display:block;flex:0 0 auto;margin:0;padding:0;border:0;background:transparent}
.encyclopedia-image .portrait{height:clamp(130px,19vh,185px);width:100%;padding:0;margin:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.encyclopedia-image img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center bottom;transform:none}
.encyclopedia-card .name{margin-top:3px;font-size:clamp(10px,2.6vw,13px);line-height:1.25;overflow-wrap:anywhere}
.encyclopedia-level{margin-top:3px;color:var(--gold);font-weight:800;font-size:12px;line-height:1.2}
.encyclopedia-card .plus{bottom:4px;right:4px;width:25px;height:25px;font-size:17px}
.encyclopedia-locked{opacity:1}.encyclopedia-locked .encyclopedia-image{cursor:default}.encyclopedia-locked .name{color:var(--muted)}
.encyclopedia-detail-image .portrait{height:220px}.encyclopedia-detail-stats{line-height:1.9;padding:12px;margin:10px 0;background:#111b30;border-radius:12px}
/* ステージ */
.stage-map{padding:12px;border:2px solid #58794e;border-radius:16px;background:linear-gradient(145deg,#456c43,#31543b 55%,#426a40)}
.map-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stage-node{min-height:70px;padding:5px 2px;background:linear-gradient(#e1e9b7,#a9c27b);color:#263b26;border:2px solid #b4c98b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.stage-node .num{font-size:20px;font-weight:900}.stage-node .small{color:inherit;font-size:10px}
.stage-node.completed{background:linear-gradient(#c5e9bb,#76b879)}.stage-node.current{background:linear-gradient(#fff0a8,#e9b94e)}.stage-node.boss{background:linear-gradient(#f1b2a3,#bd625b);color:#451e25}.stage-node.locked{background:#788477;color:#344236}.stage-node.selected{outline:3px solid white}
.stage-info{margin-top:10px;background:#203c2dcc;padding:10px;border-radius:10px;line-height:1.7}.map-start{width:100%;margin-top:10px;background:linear-gradient(#e6c16a,#a77c32);color:#30230e;font-weight:900}
/* 戦闘 */
.battle-side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.unit{position:relative;min-width:0;background:#263653;border:1px solid #5476a4;border-radius:10px;text-align:center;padding:5px 3px}.unit.enemy{background:#513541;border-color:#895767}.unit.dead{opacity:.35;filter:grayscale(1)}.unit.active{outline:2px solid #ffe17c;box-shadow:0 0 12px #f4c76b99}.unit.enemy.active{outline-color:#ff8585}
.unit .portrait{height:clamp(80px,16vh,145px)}.unit .name{font-size:12px}.unit .small{font-size:10px}.unit h3{margin:3px}
.hpbar{height:8px;background:#101827;border-radius:10px;overflow:hidden;margin:5px 0}.hpbar i{display:block;height:100%;background:#76d6a1}
.battle-divider{text-align:center;font-size:18px;color:var(--gold);font-weight:900;margin:7px}.action-panel{margin-top:9px;background:#202e4b;border:1px solid #536486;border-radius:11px;padding:10px}.action-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}.action-buttons button{min-height:42px}.attack{background:#853c49}.skill{background:#5b4694}
.enemy-preview{background:#633b48;border:2px solid #bd687b;padding:10px;border-radius:10px;line-height:1.6}.result{text-align:center;line-height:1.7}.result h2{color:var(--gold)}
.effect{position:absolute;top:26%;left:0;width:100%;z-index:4;font-size:25px;font-weight:900;color:#ff8585;text-shadow:0 2px 5px black;pointer-events:none;animation:effectPop .85s ease-out forwards}.effect.heal{color:#86f3ad}.effect.buff{color:#ffe17c}
@keyframes effectPop{0%{transform:translateY(15px) scale(.6);opacity:0}25%{transform:translateY(-4px) scale(1.2);opacity:1}65%{opacity:1}100%{transform:translateY(-38px);opacity:0}}
.error{display:none;background:#542d36;border:1px solid #b65d6a;padding:10px;border-radius:10px;margin-bottom:10px}
.summon{display:none;position:fixed;inset:0;z-index:1100;background:radial-gradient(ellipse,#26345b,#080c18);align-items:center;justify-content:center;padding:15px}.summon.active{display:flex}.summon-box{text-align:center;max-width:520px;width:100%}
.magic{position:relative;margin:15px auto;width:210px;height:210px;border-radius:50%;border:3px solid #7ecbff;box-shadow:0 0 20px #398cff,inset 0 0 30px #398cff;display:flex;align-items:center;justify-content:center;animation:rotate 6s linear infinite}.magic img{position:relative;z-index:1;width:150px;height:150px;object-fit:contain;animation:counterrotate 6s linear infinite}.summon.epic-mode .magic{border-color:#ffe08b;box-shadow:0 0 28px #ffc34b,0 0 42px #d58aff}.summon-name{font-size:23px;font-weight:900;color:var(--gold)}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes counterrotate{to{transform:rotate(-360deg)}}
/* デイリー */
.daily-panel{text-align:center}.daily-panel h2{color:var(--gold)}.daily-wheel-wrap{position:relative;width:min(76vw,290px);aspect-ratio:1;margin:15px auto}.daily-wheel{width:100%;height:100%;border-radius:50%;border:7px solid var(--gold);box-shadow:0 0 22px #f4c76b66;transition:transform 4.5s cubic-bezier(.12,.75,.12,1)}.daily-wheel-label{position:absolute;left:50%;top:50%;transform-origin:center;color:white;font-size:11px;font-weight:900;text-shadow:0 1px 3px black;pointer-events:none}.daily-pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);z-index:5;color:#ff7777;font-size:36px;text-shadow:0 2px 3px black}.daily-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#34240a;border:4px solid white;font-weight:900}.daily-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.daily-buttons button{min-width:135px}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:9px}
@media(max-width:600px){
 html,body{width:100%;overflow-x:hidden}.wrap{max-width:100%;padding:5px 6px}.top{padding:3px 0;gap:4px}.brand{font-size:15px}.top .row{gap:4px}.pill{padding:3px 6px;font-size:11px}.nav{gap:3px;margin:5px 0 7px}.nav button{padding:9px 1px;font-size:10px;border-radius:7px}.panel{padding:7px;margin-bottom:6px;border-radius:10px}.section-title{font-size:15px;margin-bottom:5px}.panel p{margin:5px 0}.hero{padding:10px 6px}.hero h1{font-size:19px;margin:5px 0}.grid{gap:5px}.card{padding:4px 3px 32px}.card .portrait{height:60px}.card .name{font-size:11px}.card .stats{font-size:10px}.card button.wide{font-size:10px;padding:5px 1px}
 #characterList{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.encyclopedia-card{padding:3px 2px 29px}.encyclopedia-image .portrait{height:clamp(110px,16vh,155px)}.encyclopedia-card .name{font-size:11px}.encyclopedia-level{font-size:11px}
 .battle-side{gap:4px}.unit{padding:3px 2px}.unit .portrait{height:clamp(65px,12vh,100px)}.unit .name,.unit .small{font-size:10px}.hpbar{height:6px;margin:3px 0}.battle-divider{margin:4px}.action-panel{margin-top:5px;padding:7px}.action-buttons button{min-height:38px;padding:5px;font-size:12px}
 .stage-map{padding:6px}.map-grid{gap:4px}.stage-node{min-height:47px;padding:3px 1px}.stage-node .num{font-size:15px}.stage-node .small{font-size:9px}.stage-info{padding:6px;margin-top:6px;font-size:12px}.modal{padding:7px}.modal-box{max-height:91dvh;padding:10px}.footer{display:none}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">✦ 星詠みの旅団</div><div class="row"><span class="pill">💎 <b id="gems">0</b></span><span class="pill">🪙 <b id="gold">0</b></span><span class="pill">到達 <b id="stage">1</b></span></div></header>
<div id="errorBox" class="error"></div>
<nav class="nav"><button data-page="home">ホーム</button><button data-page="gacha">ガチャ</button><button data-page="team">編成・図鑑</button><button data-page="battle">戦闘</button><button data-page="shop">ショップ</button></nav>
<main>
<section id="home" class="page active"><div class="panel hero"><h1>星の導きが、旅の始まり</h1><p class="muted">仲間を集め、育て、未知の敵に挑もう。</p><div class="row" style="justify-content:center"><button data-page="gacha">仲間を召喚する</button><button data-page="team">編成を確認する</button><button data-page="battle">冒険に出る</button></div></div><div class="panel"><h2 class="section-title">旅団の状況</h2><div id="homeSummary"></div></div><div class="panel daily-panel"><h2 class="section-title">🎁 デイリー特典</h2><p class="small">毎日0時（日本時間）に更新！</p><div class="daily-buttons"><button data-action="dailyBonusOpen">🎁 ログインボーナス</button><button data-action="dailyWheelOpen">🎰 ログインルーレット</button></div><p id="dailyStatus" class="small"></p></div></section>
<section id="gacha" class="page"><div class="panel"><h2 class="section-title">星詠み召喚</h2><p>ノーマル 70% / レア 25% / エピック 5%</p><div class="row"><button data-action="summon" data-count="1">1回召喚（💎100）</button><button data-action="summon" data-count="10">10回召喚（💎900）</button></div><div id="gachaResult" style="margin-top:12px">召喚結果が表示されます。</div></div><div class="panel"><h2 class="section-title">所持状況</h2><div id="gachaOwned"></div></div></section>
<section id="team" class="page"><div class="panel"><h2 class="section-title">パーティ編成</h2><p class="muted">最大3体まで編成できます。</p><div id="partyView" class="grid"></div></div><div class="panel"><h2 class="section-title">キャラクター図鑑</h2><div id="dexControls"></div><div id="characterList"></div></div></section>
<section id="shop" class="page"><div class="panel"><h2 class="section-title">ショップ</h2><p>ショップは準備中です。</p></div></section>
<section id="battle" class="page"><div class="panel"><h2 class="section-title">草原マップ</h2><p class="muted">クリア済みのステージにも再挑戦できます。</p><div id="stageMap"></div></div><div class="panel"><h2 class="section-title">冒険準備</h2><div id="battleIntro"></div><button id="startBattleButton" class="map-start" data-action="startBattle">挑戦する</button></div></section>
<section id="battleFight" class="page"><div class="panel"><div class="row" style="justify-content:space-between"><h2 class="section-title">戦闘</h2><button data-action="returnMap">ステージ選択に戻る</button></div><h3 style="color:#ffaaaa;margin:5px 0">▼ 敵軍 <span id="bossLabel"></span></h3><div id="enemyUnits" class="battle-side"></div><div class="battle-divider">✦ VS ✦</div><h3 style="color:#9acbff;margin:5px 0">▲ 旅団</h3><div id="allyUnits" class="battle-side"></div><div id="actionArea" class="action-panel"></div></div></section>
</main><div class="footer">星詠みの旅団</div></div>
<div id="characterRingModal" class="modal"><div class="modal-box"><h2 class="section-title">アクセサリー一覧</h2><div id="characterRingContent"></div><button class="wide" data-action="closeCharacterRingModal">図鑑に戻る</button></div></div>
<div id="equipmentModal" class="modal"><div class="modal-box"><h2 class="section-title">指輪を選択</h2><div id="equipmentModalCharacter" class="small"></div><div id="equipmentModalChoices"></div><button class="wide" data-action="closeEquipmentModal">戻る</button></div></div>
<div id="encyclopediaModal" class="modal"><div class="modal-box"><div id="encyclopediaDetail"></div><button class="wide" data-action="closeEncyclopedia">図鑑に戻る</button></div></div>
<div id="dailyModal" class="modal"><div class="modal-box daily-panel"><div id="dailyContent"></div><button class="wide" id="dailyClose" data-action="dailyClose">閉じる</button></div></div>
<div id="summonOverlay" class="summon"><div class="summon-box"><h2 class="section-title">星詠み召喚</h2><div id="summonVisual"></div><div id="summonProgress" class="small"></div><div id="summonControls"></div></div></div>
<script>

const KEY='hoshiyomi_save_v2';

const RING_IDS=Object.keys(RINGS);
const CHARACTERS=[
{id:'swordman',imageFile:'Swordman.png',name:'剣士',rarity:'ノーマル',hp:100,atk:20,speed:20,charge:3,skill:'強撃',effect:'damage',power:50,target:'one',growth:.07,max:20,slot:1},

{id:'ドワーフ',imageFile:'ドワーフ.png',name:'ドワーフ',rarity:'レア',hp:170,atk:30,speed:15,charge:5,skill:'職人の心得',effect:'buffSelf',power:25,target:'self',growth:.16,max:10,slot:2},

{id:'アサシン',imageFile:'アサシン.png',name:'アサシン',rarity:'レア',hp:70,atk:70,speed:29,charge:2,skill:'回避',effect:'evadeSure',power:100,target:'self',growth:.16,max:10,slot:1},
{id:'鍛錬剣士',imageFile:'鍛錬剣士.png',name:'果てしなき鍛錬剣士',rarity:'エピック',hp:200,atk:40,speed:22,charge:2,skill:'乱舞',effect:'damage',power:40,target:'all',growth:.30,max:6,slot:2,passive:'アルティメットカウンター'},
{id:'狙撃手アーチャー',imageFile:'狙撃手アーチャー.png',name:'戦場の狙撃手アーチャー',rarity:'エピック',hp:160,atk:80,speed:19,charge:4,skill:'正射必中',effect:'damage',power:160,target:'one',growth:.30,max:6,slot:2,passive:'アタックセレクト'},
{id:'一閃スピアドン',imageFile:'一閃スピアドン.png',name:'紫電一閃スピアドン',rarity:'エピック',hp:200,atk:30,speed:24,charge:5,skill:'致命のひと突き',effect:'damage',power:300,target:'one',growth:.30,max:6,slot:2,passive:'ウィルパワー'}

function dealDamage(attacker,target,amount,isSkill=false){if(!target||target.hp<=0)return 0;if(target.evade>0){const chance=target.evade;target.evade=0;if(Math.random()<chance){showEffect(target,'回避','buff');battle.message=target.name+' は攻撃を回避！';return 0}}let damage=Math.max(1,Math.floor(amount));if(target.guard>0){damage=Math.max(1,Math.floor(damage*(1-target.guard)));target.guard=0}target.hp=Math.max(0,target.hp-damage);showEffect(target,'−'+damage);battle.message=attacker.name+' → '+target.name+'：'+damage+'ダメージ';if(target.id==='鍛錬剣士'&&target.hp>0&&attacker.hp>0&&Math.random()<(isSkill?1:.2)){const reflected=damage*2;attacker.hp=Math.max(0,attacker.hp-reflected);showEffect(attacker,'−'+reflected);battle.message+=' / アルティメットカウンター！'}return damage}
function healUnit(target,amount){const before=target.hp;target.hp=Math.min(target.maxHp,target.hp+Math.max(1,Math.floor(amount)));const healed=target.hp-before;showEffect(target,'+'+healed,'heal');return healed}
async function advanceTurn(){if(!battle||!battle.running||battle.busy)return;if(checkBattleEnd())return;clearActing();battle.pendingUseSkill=undefined;battle.targetUID=null;const u=chooseNextUnit();if(!u)return;battle.current=u;u.acting=true;if(u.poison>0){const d=Math.max(1,Math.floor(u.maxHp*.08));u.hp=Math.max(0,u.hp-d);u.poison--;showEffect(u,'−'+d);battle.message=u.name+' は毒で '+d+' ダメージ！';renderBattle();await sleep(650);if(!battle?.running)return;if(u.hp<=0){clearActing();if(!checkBattleEnd())advanceTurn();return}}if(u.side==='ally'){battle.awaitingAction=true;battle.message=u.name+' の行動を選択してください。';renderBattle();return}battle.awaitingAction=false;const c=byId(u.id),ready=u.skillCount>=u.charge;battle.message=u.name+' の行動予告：'+(ready?'スキル「'+c.skill+'」':'通常攻撃');renderBattle();const token=battle.token;await sleep(1100);if(!battle||!battle.running||battle.token!==token)return;await enemyAct(u)}
async function allyAct(useSkill){if(!battle?.running||!battle.awaitingAction||battle.busy)return;const u=battle.current;if(!u||u.side!=='ally'||(useSkill&&u.skillCount<u.charge))return;
  if(u.id==='狙撃手アーチャー'&&alive(battle.enemies).length>1){
    battle.pendingUseSkill=useSkill;
    battle.awaitingAction=false;
    battle.message='攻撃する敵を選択してください';
    renderBattle();
    return;
  }
  battle.targetUID=null;
  battle.busy=true;battle.awaitingAction=false;
  await performAction(u,useSkill);
  if(!battle?.running)return;
  battle.busy=false;clearActing();
  if(checkBattleEnd())return;
  await sleep(450);advanceTurn()}
async function enemyAct(u){if(!battle?.running)return;battle.busy=true;const c=byId(u.id),useSkill=u.skillCount>=u.charge;battle.message=u.name+' の'+(useSkill?'スキル「'+c.skill+'」':'通常攻撃')+'！';renderBattle();await sleep(300);await performAction(u,useSkill);if(!battle?.running)return;battle.busy=false;clearActing();if(checkBattleEnd())return;await sleep(500);advanceTurn()}
async function performAction(u,useSkill){if(!battle?.running)return;const c=byId(u.id);if(!useSkill){const target=chooseTarget(u);if(target)dealDamage(u,target,getAttackPower(u),false);u.skillCount=Math.min(u.charge,u.skillCount+1)}else{u.skillCount=0;const power=c.power*u.skillMultiplier,allies=u.side==='ally'?battle.allies:battle.enemies,opponents=u.side==='ally'?battle.enemies:battle.allies;if(c.effect==='damage'){const targets=c.target==='all'?alive(opponents):[chooseTarget(u)].filter(Boolean);for(const target of targets)dealDamage(u,target,power,true);if(c.target==='all')battle.message=u.name+' の「'+c.skill+'」！ 全体攻撃！'}else if(c.effect==='poison'){const target=chooseTarget(u);if(target){dealDamage(u,target,power,true);if(target.hp>0)target.poison=3}}else if(c.effect==='heal'){const target=random(alive(allies));if(target)healUnit(target,power);battle.message=u.name+' の「'+c.skill+'」！'}else if(c.effect==='healPercent'){for(const target of alive(allies))healUnit(target,target.maxHp*power/100);battle.message=u.name+' の「'+c.skill+'」！'}else if(c.effect==='evade'||c.effect==='evadeSure'){u.evade=c.effect==='evadeSure'?1:Math.min(1,power/100);showEffect(u,'回避','buff');battle.message=u.name+' は回避状態になった！'}else if(c.effect==='guard'){u.guard=Math.min(.95,power/100);showEffect(u,'防御','buff');battle.message=u.name+' は防御態勢を取った！'}else if(c.effect==='buffAlly'){for(const target of alive(allies)){target.buff=1+power/100;target.buffTurns=1;showEffect(target,'強化','buff')}battle.message=u.name+' の「'+c.skill+'」！'}else if(c.effect==='buffSelf'){u.permanentBuff+=power/100;showEffect(u,'強化','buff');battle.message=u.name+' の「'+c.skill+'」！'}}if(u.buffTurns>0&&!(useSkill&&c.effect==='buffAlly')){u.buffTurns--;if(u.buffTurns===0)u.buff=1}renderBattle();await sleep(850)}
function checkBattleEnd(){if(!battle?.running)return true;if(!alive(battle.enemies).length){finishBattle(true);return true}if(!alive(battle.allies).length){finishBattle(false);return true}return false}
function createStageDrop(stage){const candidates=[...new Set(STAGE_ENEMIES[stage].map(x=>x[0]))],successful=[];for(const id of candidates){const c=byId(id);if(c&&Math.random()*100<DROP_RATES[c.rarity])successful.push(id)}if(!successful.length)return null;const id=random(successful);return {id,name:byId(id).name,message:addCharacter(id)}}
function grantStageRewards(stage){const count=Number(state.stageClearCounts[stage])||0,firstClear=count===0,gold=Math.floor(STAGE_GOLD[stage]*Math.pow(.8,count));state.gold+=gold;let gems=0;if(firstClear&&Math.random()<.2){gems=50;state.gems+=gems}let ringReward=null;if(stage===20&&firstClear){state.ringInventory.power=(Number(state.ringInventory.power)||0)+1;ringReward='power'}const drop=createStageDrop(stage);state.stageClearCounts[stage]=count+1;state.clearedStage=Math.max(state.clearedStage,stage);state.stage=Math.min(MAX_STAGE,state.clearedStage+1);save();return {firstClear,gold,gems,ringReward,drop}}
function finishBattle(victory){if(!battle?.running)return;battle.running=false;battle.busy=false;battle.awaitingAction=false;clearActing();battle.result={victory,rewards:victory?grantStageRewards(battle.stage):null};renderBattle()}
function renderBattleResult(){const {victory,rewards}=battle.result;if(!victory){$('actionArea').innerHTML=`<div class="result"><h2>敗北…</h2><p>編成や装備を見直して再挑戦しよう。</p><button data-action="returnMap">草原マップへ戻る</button></div>`;return}let html=`<p>🪙 金貨 +${rewards.gold}</p>`;if(rewards.gems)html+=`<p>💎 ジェム +${rewards.gems}</p>`;if(rewards.ringReward)html+=`<p>🟠 チカラの指輪 ×1<br><span class="small">初回クリア確定報酬</span></p>`;if(rewards.drop)html+=`<p>🎁 キャラクタードロップ！<br><b>${esc(rewards.drop.name)}</b><br><span class="small">${esc(rewards.drop.message)}</span></p>`;$('actionArea').innerHTML=`<div class="result"><h2>🎉 ステージクリア！</h2><p>ステージ ${battle.stage} 勝利！</p>${rewards.firstClear?'<p>✨ 初回クリア！</p>':''}${html}<button data-action="returnMap">草原マップへ戻る</button></div>`}
function returnMap(){if(battle){battle.running=false;battle.token=-1}battle=null;selectedStage=Math.min(MAX_STAGE,Math.max(1,state.clearedStage+1));showPage('battle')}
/* ログインボーナス・ルーレット */
function dailyDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function readDaily(){try{return JSON.parse(localStorage.getItem(DAILY_KEY))||{}}catch(e){return {}}}
function saveDaily(){try{localStorage.setItem(DAILY_KEY,JSON.stringify(dailyData))}catch(e){console.warn('デイリー保存失敗',e)}}
function dailyAvailable(kind){return dailyData[kind]!==dailyDate()}
function updateDailyStatus(){const el=$('dailyStatus');if(el)el.textContent='ボーナス：'+(dailyAvailable('bonus')?'受取可能':'受取済み')+' ／ ルーレット：'+(dailyAvailable('wheel')?'挑戦可能':'挑戦済み')}
function openDailyModal(){$('dailyModal').classList.add('active')}
function closeDailyModal(){if(dailySpinning)return;$('dailyModal').classList.remove('active')}
function showDailyBonus(){$('dailyContent').innerHTML=`<h2>🎁 ログインボーナス</h2><p style="font-size:25px">💎 50ジェム</p><p style="font-size:25px">🪙 200金貨</p><button class="wide" data-action="dailyClaim" ${dailyAvailable('bonus')?'':'disabled'}>${dailyAvailable('bonus')?'受け取る':'本日は受取済み'}</button>`;openDailyModal()}
function claimDailyBonus(){if(!dailyAvailable('bonus'))return;dailyData.bonus=dailyDate();saveDaily();state.gems+=50;state.gold+=200;save();renderAll();$('dailyContent').innerHTML='<h2>🎉 受け取り完了！</h2><p>💎 50ジェム</p><p>🪙 200金貨</p><p>明日もログインしよう！</p>'}
function wheelGradient(){return 'conic-gradient('+DAILY_COLORS.map((color,i)=>`${color} ${i*60}deg ${(i+1)*60}deg`).join(',')+')'}
function showDailyWheel(){$('dailyContent').innerHTML=`<h2>🎰 ログインルーレット</h2><p>毎日1回無料！</p><div class="daily-wheel-wrap"><div class="daily-pointer">▼</div><div id="dailyWheel" class="daily-wheel" style="background:${wheelGradient()}"></div><div class="daily-center">✦</div></div><div id="dailyWheelResult">${dailyAvailable('wheel')?'本日の運試し！':'本日は挑戦済み'}</div><button class="wide" id="dailySpinButton" data-action="dailySpin" ${dailyAvailable('wheel')?'':'disabled'}>${dailyAvailable('wheel')?'無料で回す':'本日は挑戦済み'}</button><p class="small">100金貨30% / 300金貨25% / 500金貨15%<br>50ジェム15% / 100ジェム10% / 300ジェム5%</p>`;const wheel=$('dailyWheel');DAILY_PRIZES.forEach((prize,i)=>{const a=(i*60+30)*Math.PI/180,label=document.createElement('div');label.className='daily-wheel-label';label.textContent=prize.label;label.style.left=(50+32*Math.sin(a))+'%';label.style.top=(50-32*Math.cos(a))+'%';label.style.transform='translate(-50%,-50%)';wheel.parentElement.appendChild(label)});dailyRotation=0;openDailyModal()}
function chooseDailyPrize(){let r=Math.random()*100;for(let i=0;i<DAILY_PRIZES.length;i++){r-=DAILY_PRIZES[i].rate;if(r<0)return i}return DAILY_PRIZES.length-1}
function spinDailyWheel(){if(dailySpinning||!dailyAvailable('wheel'))return;const index=chooseDailyPrize(),prize=DAILY_PRIZES[index];dailySpinning=true;dailyData.wheel=dailyDate();saveDaily();$('dailySpinButton').disabled=true;$('dailyClose').disabled=true;$('dailyWheelResult').textContent='抽選中…';const target=(360-(index*60+30))%360;dailyRotation=360*6+target;const wheel=$('dailyWheel');requestAnimationFrame(()=>requestAnimationFrame(()=>{wheel.style.transform=`rotate(${dailyRotation}deg)`;wheel.parentElement.querySelectorAll('.daily-wheel-label').forEach(el=>{el.style.transition='transform 4.5s cubic-bezier(.12,.75,.12,1)';el.style.transform=`translate(-50%,-50%) rotate(${dailyRotation}deg)`})}));setTimeout(()=>{state[prize.type]+=prize.amount;save();renderAll();$('dailyWheelResult').innerHTML=`<h2>🎉 ${prize.label} 獲得！</h2>`;dailySpinning=false;$('dailyClose').disabled=false},4700)}
/* ボタンイベント */
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.page){showPage(button.dataset.page);return}const a=button.dataset.action,id=button.dataset.id,index=Number(button.dataset.index);switch(a){
case 'summon':summon(Number(button.dataset.count));break;
case 'nextSummon':summonIndex++;showSummon();break;
case 'skipSummon':finishSummon();break;
case 'toggleParty':toggleParty(id);break;
case 'openEncyclopedia':openEncyclopedia(id);break;
case 'closeEncyclopedia':$('encyclopediaModal').classList.remove('active');break;
case 'togglePartyFromDetail':toggleParty(id);openEncyclopedia(id);break;
case 'dexRarity':changeDexRarity(button.dataset.rarity);break;
case 'dexPage':changeDexPage(Number(button.dataset.direction));break;
case 'openRing':openRing(id);break;
case 'closeCharacterRingModal':$('characterRingModal').classList.remove('active');ringTarget=null;break;
case 'openSlot':openSlot(id,index);break;
case 'closeEquipmentModal':$('equipmentModal').classList.remove('active');slotTarget=null;if(ringTarget)renderRingModal();break;
case 'equip':equip(id,index,button.dataset.type);break;
case 'unequip':unequip(id,index);break;
case 'selectStage':selectStage(Number(button.dataset.stage));break;
case 'startBattle':startBattle();break;
case 'selectTarget':{
  if(!battle?.running||battle.busy||battle.pendingUseSkill===undefined)break;
  const uid=Number(button.dataset.uid);
  if(!alive(battle.enemies).some(u=>u.uid===uid))break;
  const useSkill=battle.pendingUseSkill;
  battle.pendingUseSkill=undefined;
  battle.targetUID=uid;
  battle.busy=true;
  battle.awaitingAction=false;
  (async()=>{
    const token=battle.token;
    await performAction(battle.current,useSkill);
    if(!battle?.running||battle.token!==token)return;
    battle.targetUID=null;
    battle.busy=false;
    clearActing();
    if(checkBattleEnd())return;
    await sleep(450);
    if(battle?.running&&battle.token===token)advanceTurn();
  })();
  break;
}
case 'cancelTarget':
  if(battle?.pendingUseSkill!==undefined){battle.pendingUseSkill=undefined;battle.awaitingAction=true;renderBattle()}
  break;
case 'battleAttack':allyAct(false);break;
case 'battleSkill':allyAct(true);break;
case 'returnMap':returnMap();break;
case 'dailyBonusOpen':showDailyBonus();break;
case 'dailyClaim':claimDailyBonus();break;
case 'dailyWheelOpen':showDailyWheel();break;
case 'dailySpin':spinDailyWheel();break;
case 'dailyClose':closeDailyModal();break;
}});
window.addEventListener('error',event=>{console.error(event.error||event.message);showError('ゲーム内エラー：'+(event.message||'不明なエラー'))});

<script>
/* ===== 新しい指輪4種類 ===== */
(() => {
  const extraRings = {
    dodge: {
      name: '回避の指輪',
      icon: '🟣',
      description: '攻撃を3%の確率で回避'
    },
    speed: {
      name: '素早さの指輪',
      icon: '🔵',
      description: '素早さ +2'
    },
    heal: {
      name: '癒しの指輪',
      icon: '🩷',
      description: '自分の行動時にHP10回復'
    },
    charge: {
      name: '溜めの指輪',
      icon: '🟡',
      description: '溜めを1軽減（最低4）'
    }
  };

  Object.assign(RINGS, extraRings);

  for (const type of Object.keys(extraRings)) {
    if (!RING_IDS.includes(type)) RING_IDS.push(type);
    state.ringInventory[type] =
      Math.max(0, Number(state.ringInventory[type]) || 0);
  }

  // 装備中の指輪を加算した溜め
  function ringCharge(id) {
    const original = byId(id).charge;
    if (original < 5) return original;
    return Math.max(
      4,
      original - getEquipped(id, 'charge')
    );
  }

  // 素早さ
  const oldGetStats = getStats;
  getStats = function(id) {
    const s = oldGetStats(id);
    s.speed += getEquipped(id, 'speed') * 2;
    return s;
  };

  // 戦闘開始時の能力
  const oldMakeUnit = makeUnit;
  makeUnit = function(id, side, options = {}) {
    const u = oldMakeUnit(id, side, options);
    if (side === 'ally') {
      u.charge = ringCharge(id);
    }
    return u;
  };

  // 回避の指輪
  const oldDealDamage = dealDamage;
  dealDamage = function(attacker, target, amount, isSkill = false) {
    if (target && target.hp > 0 && target.side === 'ally') {
      const count = getEquipped(target.id, 'dodge');
      if (Math.random() < count * 0.03) {
        showEffect(target, '回避', 'buff');
        battle.message = target.name + 'は攻撃を回避！';
        return 0;
      }
    }
    return oldDealDamage(attacker, target, amount, isSkill);
  };

  // 癒しの指輪
  const oldChooseNextUnit = chooseNextUnit;
  chooseNextUnit = function() {
    const u = oldChooseNextUnit();
    if (!u || u.side !== 'ally' || u.hp <= 0) return u;

    const amount = getEquipped(u.id, 'heal') * 10;
    const recovered = Math.min(u.maxHp - u.hp, amount);

    if (recovered > 0) {
      u.hp += recovered;
      const token = battle.token;
      setTimeout(() => {
        if (battle && battle.token === token) {
          showEffect(u, '+' + recovered, 'heal');
        }
      }, 0);
    }
    return u;
  };

  // 編成画面の溜め表示
  const oldCardHTML = cardHTML;
  cardHTML = function(id) {
    const c = byId(id);
    return oldCardHTML(id).replace(
      '溜め ' + c.charge + '<br>',
      '溜め ' + ringCharge(id) + '<br>'
    );
  };

  // 図鑑の溜め表示
  const oldOpenEncyclopedia = openEncyclopedia;
  openEncyclopedia = function(id) {
    oldOpenEncyclopedia(id);
    const c = byId(id);
    if (!c || !state.owned[id]) return;

    const detail = document.getElementById(
      'encyclopediaDetail'
    );
    detail.innerHTML = detail.innerHTML.replace(
      '⏳ スキル溜め：' + c.charge,
      '⏳ スキル溜め：' + ringCharge(id)
    );
  };

  save();
  renderAll();
})();
</script>

 
<script>
/* ===== 日替わりショップ ===== */
(() => {
  const shopElement = document.getElementById('shop');
  const shopRings = Object.keys(RINGS);
  const shopCharacters = CHARACTERS.filter(c =>
    c.rarity === 'ノーマル' || c.rarity === 'レア'
  );
  const shopPrice = c => c.rarity === 'レア' ? 5000 : 1500;

  function updateShopStock() {
    const date = dailyDate();
    const old = state.dailyShop;

    if (
      old &&
      old.date === date &&
      shopRings.includes(old.ring) &&
      Array.isArray(old.characters) &&
      old.characters.length === 2 &&
      old.characters[0] !== old.characters[1] &&
      old.characters.every(id => shopCharacters.some(c => c.id === id)) &&
      old.purchased
    ) return;

    const available = [...shopCharacters];
    const first = available.splice(
      Math.floor(Math.random() * available.length), 1
    )[0];
    const second = available.splice(
      Math.floor(Math.random() * available.length), 1
    )[0];

    state.dailyShop = {
      date,
      ring: shopRings[Math.floor(Math.random() * shopRings.length)],
      characters: [first.id, second.id],
      purchased: {
        ring: false,
        character0: false,
        character1: false,
        gems: false
      }
    };
    save();
  }

  function shopItem(key, image, name, detail, price) {
    const sold = state.dailyShop.purchased[key];
    const affordable = state.gold >= price;

    return `
      <div class="shop-product">
        <div class="shop-product-image">${image}</div>
        <b>${esc(name)}</b>
        <div class="small">${esc(detail)}</div>
        <div class="shop-product-price">
          🪙 ${price.toLocaleString('ja-JP')}
        </div>
        <button class="wide"
          data-action="shopPurchase"
          data-shop-key="${key}"
          ${sold || !affordable ? 'disabled' : ''}>
          ${sold ? '✓ 売り切れ' :
            affordable ? '購入する' : '金貨不足'}
        </button>
      </div>
    `;
  }

  function renderShop() {
    updateShopStock();
    const stock = state.dailyShop;
    const ring = RINGS[stock.ring];

    let html = shopItem(
      'ring',
      `<span class="shop-ring-icon">${ring.icon}</span>`,
      ring.name,
      ring.description,
      5000
    );

    stock.characters.forEach((id, i) => {
      const c = byId(id);
      html += shopItem(
        'character' + i,
        portrait(id),
        c.name,
        c.rarity + (state.owned[id] ? ' / 所持済み' : ' / 未所持'),
        shopPrice(c)
      );
    });

    html += shopItem(
      'gems',
      '<span class="shop-ring-icon">💎</span>',
      '100ジェム',
      'ジェム ×100',
      5000
    );

    shopElement.innerHTML = `
      <div class="panel">
        <h2 class="section-title">🛍️ 日替わりショップ</h2>
        <p class="small">
          毎日0時（日本時間）に商品と購入回数を更新！
        </p>
        <p>🪙 所持金貨：
          <b>${state.gold.toLocaleString('ja-JP')}</b>
        </p>
        <div id="shopMessage" role="status"></div>
        <div class="shop-product-grid">${html}</div>
        <p class="small">
          ※各商品は1日1回限り購入できます。
        </p>
      </div>
    `;
  }

  function purchaseShopItem(key) {
    updateShopStock();
    const stock = state.dailyShop;

    if (!['ring','character0','character1','gems'].includes(key)) return;
    if (stock.purchased[key]) return;

    let price = 5000;
    let message = '';

    if (key === 'ring') {
      message = RINGS[stock.ring].name + 'を獲得！';
    } else if (key === 'character0' || key === 'character1') {
      const i = key === 'character0' ? 0 : 1;
      const c = byId(stock.characters[i]);
      if (!c || !shopCharacters.some(x => x.id === c.id)) return;
      price = shopPrice(c);
      message = c.name + 'を購入！';
    } else {
      message = '100ジェムを獲得！';
    }

    if (state.gold < price) {
      showError('金貨が足りません');
      renderShop();
      return;
    }

    state.gold -= price;

    if (key === 'ring') {
      const type = stock.ring;
      state.ringInventory[type] =
        (Number(state.ringInventory[type]) || 0) + 1;
    } else if (key === 'character0' || key === 'character1') {
      const i = key === 'character0' ? 0 : 1;
      const id = stock.characters[i];
      message = byId(id).name + '：' + addCharacter(id);
    } else {
      state.gems += 100;
    }

    stock.purchased[key] = true;
    save();
    renderAll();
    renderShop();

    document.getElementById('shopMessage').textContent =
      '✅ ' + message;
  }

  const css = document.createElement('style');
  css.textContent = `
    .shop-product-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
      margin:12px 0;
    }
    .shop-product {
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:6px;
      background:#202d49;
      border:1px solid #394866;
      border-radius:12px;
      padding:9px 6px;
    }
    .shop-product-image {
      width:100%;
      height:110px;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .shop-product-image .portrait {
      width:100%;
      height:100%;
    }
    .shop-product b {
      font-size:13px;
      overflow-wrap:anywhere;
    }
    .shop-ring-icon {
      font-size:58px;
    }
    .shop-product-price {
      margin-top:auto;
      color:#f4c76b;
      font-weight:900;
    }
    .shop-product button {
      font-size:12px;
      padding:9px 3px;
    }
    #shopMessage:not(:empty) {
      color:#86efac;
      padding:8px;
    }
  `;
  document.head.appendChild(css);

  document.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;

    if (button.dataset.action === 'shopPurchase') {
      purchaseShopItem(button.dataset.shopKey);
    }

    if (button.dataset.page === 'shop') {
      renderShop();
    }
  });

  setInterval(() => {
    if (state.dailyShop?.date !== dailyDate()) {
      updateShopStock();
      if (shopElement.classList.contains('active')) {
        renderShop();
      }
    }
  }, 15000);

  renderShop();
})();
</script>

<style>
/* ===== 豪華な召喚演出 ===== */
#summonOverlay {
  --summon-color:#64c8ff;
  --summon-glow:#1684ff;
  background:radial-gradient(circle,#15345a,#030612 80%);
  overflow:hidden;
}
#summonOverlay.epic-mode {
  --summon-color:#ffe18a;
  --summon-glow:#ffb700;
  background:radial-gradient(circle,#463210,#05040b 80%);
}
#summonOverlay .summon-box {
  position:relative;
  z-index:2;
}
.summon-cinema {
  position:relative;
  height:min(52dvh,370px);
  min-height:270px;
  display:flex;
  justify-content:center;
  align-items:center;
  isolation:isolate;
}
.summon-magic {
  position:absolute;
  width:min(65vw,260px);
  aspect-ratio:1;
  border:3px solid var(--summon-color);
  border-radius:50%;
  box-shadow:0 0 30px var(--summon-glow),
             inset 0 0 35px var(--summon-glow);
  animation:summonRotate 4s linear infinite,
            summonAppear 1s ease-out both;
}
.summon-magic::before {
  content:"✦ ✧ ✦ ✧ ✦ ✧";
  position:absolute;
  inset:15px;
  border:2px dashed var(--summon-color);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--summon-color);
  letter-spacing:5px;
}
.summon-magic::after {
  content:"";
  position:absolute;
  inset:43px;
  border:2px solid var(--summon-color);
  border-radius:50%;
  box-shadow:0 0 20px var(--summon-glow);
}
.summon-particle {
  position:absolute;
  left:50%;
  top:50%;
  width:var(--size);
  height:var(--size);
  border-radius:50%;
  background:var(--summon-color);
  box-shadow:0 0 12px var(--summon-color);
  animation:summonParticle var(--duration) ease-in-out infinite;
  animation-delay:var(--delay);
}
.summon-character {
  position:relative;
  z-index:3;
  opacity:0;
  transform:scale(.3);
  filter:brightness(4);
}
.summon-character.visible {
  animation:summonReveal .85s ease-out forwards;
}
.summon-character img {
  width:min(55vw,190px);
  height:210px;
  object-fit:contain;
  filter:drop-shadow(0 0 20px var(--summon-glow));
}
.summon-information {
  opacity:0;
  transform:translateY(15px);
}
.summon-information.visible {
  animation:summonText .5s ease-out forwards;
}
.summon-information h2 {
  color:var(--summon-color);
  text-shadow:0 0 18px var(--summon-glow);
}
.summon-flash {
  position:fixed;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:5;
}
.summon-flash.play {
  animation:summonFlash .8s ease-out;
}
.summon-lightning {
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  background:linear-gradient(
    115deg,
    transparent 43%,
    #fff7c7 47%,
    #ffcf49 50%,
    transparent 54%
  );
}
.epic-mode .summon-lightning {
  animation:summonLightning .55s steps(2) infinite;
}
.epic-mode .summon-magic {
  animation:summonRotate 2s linear infinite,
            summonAppear 1s ease-out both,
            summonPulse .7s ease-in-out infinite alternate;
}
@keyframes summonRotate {
  to {transform:rotate(360deg)}
}
@keyframes summonAppear {
  from {opacity:0;scale:.1}
  to {opacity:1;scale:1}
}
@keyframes summonPulse {
  to {box-shadow:0 0 75px var(--summon-glow),
    inset 0 0 50px var(--summon-glow)}
}
@keyframes summonParticle {
  0% {opacity:0;transform:rotate(var(--angle)) translateX(145px)}
  50% {opacity:1}
  100% {opacity:0;transform:rotate(var(--angle)) translateX(10px)}
}
@keyframes summonReveal {
  from {opacity:0;transform:scale(.3);filter:brightness(4)}
  to {opacity:1;transform:scale(1);filter:brightness(1)}
}
@keyframes summonText {
  to {opacity:1;transform:translateY(0)}
}
@keyframes summonFlash {
  0% {opacity:0}
  30% {opacity:.95}
  100% {opacity:0}
}
@keyframes summonLightning {
  0%,100% {opacity:0}
  50% {opacity:.8}
}
</style>

<script>
/* ===== 新召喚アニメーション ===== */
(() => {
  let animationToken = 0;

  showSummon = function() {
    const item = summonQueue[summonIndex];

    if (!item) {
      finishSummon();
      return;
    }

    const token = ++animationToken;
    const index = summonIndex;
    const c = item.c;
    const overlay = $('summonOverlay');
    const epic = c.rarity === 'エピック';
    const duration = epic ? 4000 : 1500;

    overlay.classList.toggle('epic-mode', epic);

    const particles = Array.from({length:32},(_,i)=>`
      <span class="summon-particle" style="
        --angle:${i*137.5}deg;
        --size:${3+i%5}px;
        --duration:${1.2+i%4*.3}s;
        --delay:${-(i%9)*.2}s;
      "></span>
    `).join('');

    $('summonVisual').innerHTML = `
      <div class="summon-cinema">
        <div class="summon-magic"></div>
        <div class="summon-lightning"></div>
        ${particles}
        <div id="summonCharacter" class="summon-character">
          <img src="${imagePath(c.imageFile)}"
               alt="${esc(c.name)}"
               onerror="this.style.display='none';this.parentElement.append('⚔️')">
        </div>
      </div>

      <div id="summonInformation" class="summon-information">
        <h2>${esc(c.name)}</h2>
        <p class="${rarityClass(c.rarity)}">
          ✦ ${esc(c.rarity)} ✦
        </p>
        <p>${esc(item.message)}</p>
      </div>

      <div id="summonFlash" class="summon-flash"></div>
    `;

    $('summonProgress').textContent =
      (index+1)+' / '+summonQueue.length;

    $('summonControls').innerHTML = `
      <button id="summonNextButton"
              data-action="nextSummon" disabled>
        召喚中…
      </button>
      <button data-action="skipSummon">
        スキップ
      </button>
    `;

    setTimeout(()=>{
      if (
        token !== animationToken ||
        summonIndex !== index ||
        !overlay.classList.contains('active')
      ) return;

      $('summonFlash')?.classList.add('play');
      $('summonCharacter')?.classList.add('visible');
      $('summonInformation')?.classList.add('visible');

      const button = $('summonNextButton');
      if (button) {
        button.disabled = false;
        button.textContent =
          index === summonQueue.length-1
            ? '結果を見る'
            : '次へ';
      }
    },duration);
  };
})();
</script>

</body>
